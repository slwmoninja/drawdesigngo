  // of passthrough Worker as OpenAI's.
  const FP_GEMINI_KEY_STORAGE = 'floorplanner-gemini-key';
  function fpGetGeminiKey(){ try{ return localStorage.getItem(FP_GEMINI_KEY_STORAGE) || ''; }catch(e){ return ''; } }
  function fpSetGeminiKey(key){ try{ if(key) localStorage.setItem(FP_GEMINI_KEY_STORAGE, key); else localStorage.removeItem(FP_GEMINI_KEY_STORAGE); }catch(e){} }
  const FP_GEMINI_PROXY_STORAGE = 'floorplanner-gemini-proxy-url';
  const FP_GEMINI_PROXY_DEFAULT = 'https://floorplanner-gemini-proxy.rfwrites2.workers.dev'; // deployed 2026-09-11, locked to this app's GitHub Pages origin
  function fpGetGeminiProxyUrl(){ try{ return localStorage.getItem(FP_GEMINI_PROXY_STORAGE) || FP_GEMINI_PROXY_DEFAULT; }catch(e){ return FP_GEMINI_PROXY_DEFAULT; } }
  function fpSetGeminiProxyUrl(url){ try{ if(url) localStorage.setItem(FP_GEMINI_PROXY_STORAGE, url); else localStorage.removeItem(FP_GEMINI_PROXY_STORAGE); }catch(e){} }

  // Whether OpenAI trains on your prompts/photos is an OpenAI *account*
  // setting (platform.openai.com/settings/organization/data-controls) --
  // there's no API request field for it, so this app can't set it for you.
  // This checkbox is just your own acknowledgment/record of having turned
  // it on there; it doesn't change what gets sent.
  const FP_OPENAI_DATASHARING_ACK = 'floorplanner-openai-datasharing-ack';
  function fpGetDataSharingAck(){ try{ return localStorage.getItem(FP_OPENAI_DATASHARING_ACK) === '1'; }catch(e){ return false; } }
  function fpSetDataSharingAck(v){ try{ localStorage.setItem(FP_OPENAI_DATASHARING_ACK, v ? '1' : '0'); }catch(e){} }

  // Shows just enough of a saved key (prefix + last 4 chars) for the user
  // to visually confirm it matches what they actually copied, without this
  // app (or us) ever needing to see/ask for the full value.
  // Includes the character count deliberately -- a prefix+suffix-only mask
  // would still "look right" even if something truncated the middle of the
  // key (a real, documented failure mode for modern sk-proj-... keys, which
  // run 150-170+ characters -- some integrations historically truncated
  // them to ~100 assuming the shorter legacy sk-... format, causing exactly
  // this "looks valid, gets rejected" symptom with no other visible sign).
  function fpMaskKey(key){
    if(!key) return '';
    const masked = key.length <= 14 ? key.slice(0,4)+'…' : key.slice(0,10)+'…'+key.slice(-4);
    return masked + ' ['+key.length+' chars]';
  }
  // type="text" (not "password") deliberately -- on mobile, password-type
  // fields are prone to browser/OS password-manager autofill silently
  // overwriting a pasted value, which is indistinguishable from "the key is
  // just wrong" when debugging a rejected key. autocomplete/autocorrect/
  // autocapitalize are all disabled so mobile keyboards can't mangle a
  // paste either.
  const FP_KEY_INPUT_ATTRS = `type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"`;
  // OpenAI key/proxy setup for fpDetectObjectDimensions -- same shape as
  // fpGeminiKeyRowHtml below, one fixed provider, no toggle needed.
  function fpOpenAiKeyRowHtml(){
    const key = fpGetOpenAiKey();
    const proxyUrl = fpGetOpenAiProxyUrl();
    return `
      <label class="mini" style="display:block; color:var(--dim);">Proxy Worker URL
        <input type="text" id="fpProxyInput" placeholder="https://your-proxy.workers.dev" value="${fpEscapeHtml(proxyUrl)}" style="width:100%;">
      </label>
      <div class="fp-key-row" style="margin-top:.4rem;">
        ${key
          ? `<span>Key set: <code>${fpEscapeHtml(fpMaskKey(key))}</code></span><button class="fp-row-remove" id="fpKeyClear" style="width:auto; border-radius:6px; padding:.2rem .5rem;" title="Remove saved key">Clear key</button>`
          : `<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get an OpenAI key</a><input ${FP_KEY_INPUT_ATTRS} id="fpKeyInput" placeholder="sk-..."><button class="btn" id="fpKeySave" style="padding:.3rem .6rem; font-size:.74rem;">Save</button>`}
      </div>

  // Gemini key/proxy setup for the "Photoreal 3D" button -- same shape as
  // fpOpenAiKeyRowHtml above but for a single fixed provider (no toggle
  // needed, this feature only ever uses Gemini).

  function fpExtractJson(text){
    if(!text || !text.trim()){
      // A reasoning model (gpt-6-astra) can burn its whole token budget on
      // internal reasoning before writing any visible output on a genuinely
      // hard request (a detailed multi-room floor plan, several photos) --
      // that shows up here as an empty completion, not a malformed one.
      throw new Error('The model returned an empty response -- likely ran out of its token budget reasoning through a complex request. Try again, or split it into fewer photos/a simpler description.');
    }
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('Could not find JSON in the response: "' + text.slice(0,200) + '"');
    return JSON.parse(jsonMatch[0]);
  }

  // ---------- PWA: manual backup / restore of the floor plan (Steps 6/6b/7/7a) ----------
  // The floor plan (title/elements/objects/notes, stored
  // under FP_STORAGE_KEY) is the one piece of real user data this app
  // persists. This section is the backup/restore flow, same pattern as
  // HealthScore's.

  function fpEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Manual "Back up now" ----
  // A FileSystemFileHandle isn't JSON-serializable, so it has to live in
  // IndexedDB, not localStorage, across reloads -- lets repeat backups
  // overwrite the same on-disk file instead of re-prompting every time on
  // browsers that support it.
  const FP_BACKUP_HANDLE_DB = 'floorplanner-backup-fs', FP_BACKUP_HANDLE_STORE = 'handles', FP_BACKUP_HANDLE_KEY = 'backupFile';
  function openFpHandleDb(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(FP_BACKUP_HANDLE_DB, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(FP_BACKUP_HANDLE_STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async function loadSavedFpBackupHandle(){
    try{
      const db = await openFpHandleDb();
      return await new Promise((resolve, reject)=>{
        const req = db.transaction(FP_BACKUP_HANDLE_STORE,'readonly').objectStore(FP_BACKUP_HANDLE_STORE).get(FP_BACKUP_HANDLE_KEY);
        req.onsuccess = ()=>resolve(req.result||null);
        req.onerror = ()=>reject(req.error);
      });
    }catch(e){ return null; }
  }
  async function saveFpBackupHandle(handle){
    try{
      const db = await openFpHandleDb();
      await new Promise((resolve, reject)=>{
        const tx = db.transaction(FP_BACKUP_HANDLE_STORE,'readwrite');
        tx.objectStore(FP_BACKUP_HANDLE_STORE).put(handle, FP_BACKUP_HANDLE_KEY);
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
    }catch(e){ /* best-effort */ }
  }
  async function getWritableFpBackupHandle(){
    if(!window.showSaveFilePicker) return null;
    try{
      let handle = await loadSavedFpBackupHandle();
      if(handle){
        const perm = await handle.queryPermission({mode:'readwrite'});
        if(perm==='granted') return handle;
        const req = await handle.requestPermission({mode:'readwrite'});
        if(req==='granted') return handle;
        return null; // permission denied
      }
      handle = await window.showSaveFilePicker({
        suggestedName: 'floorplanner-plan.json',
        types: [{ description:'DrawDesignGo backup', accept:{'application/json':['.json']} }]
      });
      await saveFpBackupHandle(handle);
      return handle;
    }catch(e){
      return null; // user cancelled the picker, or any other failure -- caller falls back
    }
  }

  // The exact bytes already sitting in localStorage under FP_STORAGE_KEY
  // (title/elements/objects/notes/__idSeq) IS the backup
  // payload -- no separate export shape to keep in sync with fpSave()/fpLoad().
  function fpBackupPayload(){
    try{ return localStorage.getItem(FP_STORAGE_KEY) || ''; }catch(e){ return ''; }
  }
  const FP_BACKUP_LAST_FINGERPRINT_KEY = 'fp_last_backup_fingerprint';

  // Manual/on-demand only, from the About popup's "Back up now" -- never
  // called automatically. Skips writing/downloading anything unchanged since
  // the last backup: without this, every tap on a browser with no File System
  // Access API (iOS Safari, most Android Chrome) produces a brand-new
  // timestamped file whether or not anything actually changed. Returns
  // whether it actually wrote a backup, so the caller can tell "saved" from
  // "already up to date" instead of always claiming success.
  async function runFpBackupDownload(){
    const json = fpBackupPayload();
    if(!json) return false; // nothing saved yet -- floor plan hasn't been touched
    if(json === localStorage.getItem(FP_BACKUP_LAST_FINGERPRINT_KEY)) return false;

    const handle = await getWritableFpBackupHandle();
    if(handle){
      try{
        const writable = await handle.createWritable();
        await writable.write(json);
        await writable.close();
        localStorage.setItem(FP_BACKUP_LAST_FINGERPRINT_KEY, json);
        return true;
      }catch(e){ /* fall through to the timestamped-download fallback below */ }
    }
    try{
      const blob = new Blob([json], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      // Timestamped, not a fixed name -- a fixed name hits a hard "file
      // already exists" failure on-device rather than a silent rename, on the
      // browsers that land here (no File System Access API, or no granted
      // handle yet).
      const stamp = new Date().toISOString().replace(/[:.]/g,'-');
      a.download = `floorplanner-plan-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      localStorage.setItem(FP_BACKUP_LAST_FINGERPRINT_KEY, json);
      return true;
    }catch(e){ return false; }
  }

  // ---- Exit App Backup (Step 6b) -- silent, single overwritten IndexedDB
  // slot, entirely separate from the manual backup above. Never reachable
  // from any button/menu, no toast, no filename -- its only user-visible
  // effect is as a candidate source for the restore-on-empty-state auto-
  // detect flow below.
  const FP_EXIT_BACKUP_DB = 'floorplanner-exit-backup', FP_EXIT_BACKUP_STORE = 'snapshot', FP_EXIT_BACKUP_KEY = 'latest';
  const FP_EXIT_BACKUP_LAST_FINGERPRINT_KEY = 'fp_last_exit_backup_fingerprint';
  function openFpExitBackupDb(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(FP_EXIT_BACKUP_DB, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(FP_EXIT_BACKUP_STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async function writeFpExitBackup(){
    const json = fpBackupPayload();
    if(!json) return false;
    if(json === localStorage.getItem(FP_EXIT_BACKUP_LAST_FINGERPRINT_KEY)) return false;
    try{
      const db = await openFpExitBackupDb();
      await new Promise((resolve, reject)=>{
        const tx = db.transaction(FP_EXIT_BACKUP_STORE, 'readwrite');
        tx.objectStore(FP_EXIT_BACKUP_STORE).put(json, FP_EXIT_BACKUP_KEY);
        // Force an immediate commit attempt instead of waiting on the
        // browser's own idle-detection heuristic -- feature-detected, since
        // Safari/iOS has no IDBTransaction.commit() and silently keeps the
        // old auto-commit-on-idle behavior there.
        if(typeof tx.commit==='function') tx.commit();
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
      localStorage.setItem(FP_EXIT_BACKUP_LAST_FINGERPRINT_KEY, json);
      return true;
    }catch(e){ return false; } // best-effort/silent -- nothing to surface a failure to at exit time
  }
  // Debounced, called from fpSave() on every real edit -- by the time
  // backgrounding actually happens the snapshot is typically already
  // near-current instead of depending on one risky just-in-time write racing
  // the freeze (see writeFpExitBackup's tx.commit() above, and
  // flushPendingProjectSaves' immediate/undebounced call on visibilitychange/pagehide).
  let fpExitBackupDebounceId = null;
  function scheduleFpExitBackup(){
    if(fpExitBackupDebounceId) clearTimeout(fpExitBackupDebounceId);
    fpExitBackupDebounceId = setTimeout(()=>{ fpExitBackupDebounceId = null; writeFpExitBackup(); }, 500);
  }

  // Keeps the REAL on-disk backup file (not just the invisible IndexedDB
  // exit-snapshot above) from going stale for more than a few minutes, in
  // case of a hard crash/power-loss that never fires pagehide/visibilitychange
  // at all -- those events already flush immediately on a graceful close, so
  // this timer only matters for the ungraceful case. Deliberately does NOT
  // call getWritableFpBackupHandle() (that can pop a save-file picker) --
  // only writes if a handle was already granted from an earlier manual
  // "Back up now"/"Restore", and never prompts from a background timer.
  const FP_DISK_BACKUP_INTERVAL_MS = 4 * 60 * 1000; // comfortably under a 5-minute loss window
  async function periodicFpDiskBackupTick(){
    if(document.hidden) return; // backgrounding is already covered by visibilitychange's immediate flush
    const json = fpBackupPayload();
    if(!json || json === localStorage.getItem(FP_BACKUP_LAST_FINGERPRINT_KEY)) return; // nothing changed
    try{
      const handle = await loadSavedFpBackupHandle();
      if(!handle) return; // no real backup file set up yet -- nothing to keep fresh
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm!=='granted') return; // never request permission from a background timer
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      localStorage.setItem(FP_BACKUP_LAST_FINGERPRINT_KEY, json);
    }catch(e){ /* best-effort/silent, same as the exit backup */ }
  }
  setInterval(periodicFpDiskBackupTick, FP_DISK_BACKUP_INTERVAL_MS);
  async function readFpExitBackup(){
    try{
      const db = await openFpExitBackupDb();
      return await new Promise((resolve, reject)=>{
        const req = db.transaction(FP_EXIT_BACKUP_STORE, 'readonly').objectStore(FP_EXIT_BACKUP_STORE).get(FP_EXIT_BACKUP_KEY);
        req.onsuccess = ()=>resolve(req.result || null);
        req.onerror = ()=>reject(req.error);
      });
    }catch(e){ return null; }
  }

  // ---- Restore (Step 7) ----
  function fpValidBackupShape(parsed){
    return !!parsed && typeof parsed==='object' &&
      Array.isArray(parsed.elements) && Array.isArray(parsed.objects);
  }
  // Same blank template "Clear plan" already resets to -- used here so a
  // backup missing a field a future app version might add doesn't leave it
  // undefined.
  function fpBlankState(){
    return fpDefaultState();
  }
  function fpApplyRestoredState(parsed){
    const blank = fpBlankState();
    fpState = Object.assign({}, blank, parsed);
    fpIdSeq = parsed.__idSeq || 1000;
    delete fpState.__idSeq;
    fpEnsureRoomLabel();
    fpDeselect();
    fpHistory = [];
    document.getElementById('fpUndoBtn').disabled = true;
    document.getElementById('fpTitle').textContent = fpState.title;
    fpSave(); fpRender();
  }
  async function importFpBackupFile(file){
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!fpValidBackupShape(parsed)) throw new Error('This file does not look like a DrawDesignGo backup.');
      const ok = await fpConfirmModal('This will replace the current floor plan on this device with the contents of the imported file. Continue?', 'Replace');
      if(!ok) return;
      fpApplyRestoredState(parsed);
      document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
      toast('Floor plan restored.');
    }catch(e){
      toast('Could not import that file: ' + (e && e.message ? e.message : e), true);
    }
  }
  // Picks the newest DrawDesignGo backup out of one or more selected files --
  // matches this app's own timestamped filename first (sorts correctly as a
  // string, no file reads needed), falls back to File.lastModified for
  // anything else selected (e.g. a renamed file). Never makes the user
  // eyeball filenames.
  function fpPickLatestBackupFile(files){
    const list = Array.from(files||[]).filter(f=>/\.(json|js)$/i.test(f.name));
    if(list.length===0) return null;
    const stampOf = f=>{
      const m = f.name.match(/floorplanner-plan-(.+)\.(?:json|js)$/i);
      return m ? m[1] : null;
    };
    list.sort((a,b)=>{
      const sa = stampOf(a), sb = stampOf(b);
      if(sa && sb) return sa<sb ? 1 : sa>sb ? -1 : 0;
      if(sa && !sb) return -1;
      if(sb && !sa) return 1;
      return b.lastModified-a.lastModified;
    });
    return list[0];
  }
  function importLatestFpBackupFromFiles(files){
    const latest = fpPickLatestBackupFile(files);
    if(!latest){ if(files && files.length) toast('No .json or .js backup file found in what you selected.', true); return; }
    importFpBackupFile(latest);
  }
  // On browsers that support it, jumps the native picker straight into the
  // Downloads folder and allows multi-select in one go. iOS Safari and older/
  // other Android browsers fall back to the plain <input type=file multiple>
  // picker, which still supports multi-select and still auto-picks the newest.
  async function openFpBackupRestorePicker(fallbackInputEl){
    if(window.showOpenFilePicker){
      try{
        const handles = await window.showOpenFilePicker({
          multiple: true,
          startIn: 'downloads',
          types: [{description:'DrawDesignGo backup', accept:{
            'application/json':['.json'],
            'text/javascript':['.js'],
            'application/javascript':['.js']
          }}]
        });
        const files = await Promise.all(handles.map(h=>h.getFile()));
        importLatestFpBackupFromFiles(files);
        return;
      }catch(e){
        if(e.name==='AbortError') return; // user backed out of the picker -- don't chain into a second one
      }
    }
    fallbackInputEl.click();
  }

  // ---- Restore prompt at startup (Step 7a auto-detect) ----
  // Gated on FP_STORAGE_KEY being genuinely absent from localStorage (the
  // floor plan has never been edited on this device, OR it was wiped) AND
  // isInstalled() (some signal this device previously ran DrawDesignGo for
  // real -- either isStandaloneApp() itself, which stays true across a data
  // wipe since it's about the window's own display mode rather than storage,
  // or the persisted install-accepted flag). Without that second gate, a
  // genuinely brand-new visitor with zero backups would see "restore your
  // data?" before they've ever had any.
  //
  // Path A0 (every platform, checked first) -- a plain IndexedDB read of
  // Step 6b's Exit App Backup, needing no permission/gesture on any platform,
  // and the freshest silent source since it's refreshed on every real edit.
  async function tryFpAutoRestorePathA0(){
    try{
      const json = await readFpExitBackup();
      if(!json) return false;
      const parsed = JSON.parse(json);
      if(!fpValidBackupShape(parsed)) return false;
      offerFpAutoRestore(parsed);
      return true;
    }catch(e){ return false; }
  }
  // Path A (File System Access browsers only) -- query only, never
  // requestPermission() here; there's no user gesture this early in the page
  // lifecycle to justify escalating permission.
  async function tryFpAutoRestorePathA(){
    if(!window.showSaveFilePicker) return false;
    try{
      const handle = await loadSavedFpBackupHandle();
      if(!handle) return false;
      const perm = await handle.queryPermission({mode:'read'});
      if(perm!=='granted') return false;
      const file = await handle.getFile();
      const parsed = JSON.parse(await file.text());
      if(!fpValidBackupShape(parsed)) return false;
      offerFpAutoRestore(parsed);
      return true;
    }catch(e){ return false; }
  }
  function offerFpAutoRestore(parsed){
    const n = Array.isArray(parsed.objects) ? parsed.objects.length : 0;
    const wrap = openModal('Restore your floor plan?',
      '<div style="margin-bottom:14px;">This device\'s floor plan looks empty, but a backup was found' +
      (parsed.title ? ' &mdash; "' + fpEscapeHtml(parsed.title) + '"' : '') +
      (n ? ' (' + n + ' object' + (n===1?'':'s') + ')' : '') + '. Restore it?</div>' +
      '<button class="btn-primary" id="fpArYes">Restore</button>' +
      '<button class="btn-secondary" id="fpArNo">No, start fresh</button>'
    );
    wrap.querySelector('#fpArYes').addEventListener('click', ()=>{
      wrap.remove();
      fpApplyRestoredState(parsed);
      toast('Floor plan restored.');
      maybeShowInstallPrompt();
    });
    wrap.querySelector('#fpArNo').addEventListener('click', ()=>{
      wrap.remove();
      maybeShowInstallPrompt();
    });
  }
  // Path B (every other case -- most phones, with no Exit App Backup found
  // either, e.g. its very first session) -- nothing can be silently re-read
  // without a user gesture here, so the prompt itself IS the ask.
  function offerFpAutoRestorePathB(){
    const wrap = openModal('Restore your floor plan?',
      '<div style="margin-bottom:14px;">This device\'s floor plan looks empty. If you have a backup file saved, you can restore it now.</div>' +
      '<button class="btn-primary" id="fpArYes">Restore from file&hellip;</button>' +
      '<input type="file" id="fpArFileInput" accept="application/json,.json,.js,text/javascript,application/javascript" multiple style="display:none;">' +
      '<button class="btn-secondary" id="fpArNo">No, start fresh</button>'
    );
    const fileInput = wrap.querySelector('#fpArFileInput');
    wrap.querySelector('#fpArYes').addEventListener('click', ()=>{ openFpBackupRestorePicker(fileInput); });
    fileInput.addEventListener('change', ()=>{
      if(wrap.isConnected) wrap.remove();
      importLatestFpBackupFromFiles(fileInput.files);
      maybeShowInstallPrompt();
    });
    wrap.querySelector('#fpArNo').addEventListener('click', ()=>{
      wrap.remove();
      maybeShowInstallPrompt();
    });
  }
  function maybeOfferFpAutoRestore(){
    let hasData = false;
    try{ hasData = !!localStorage.getItem(FP_STORAGE_KEY); }catch(e){}
    if(hasData){ maybeShowInstallPrompt(); return; } // real on-device data exists -- never prompt over it
    if(!isInstalled()){ maybeShowInstallPrompt(); return; } // no signal this device ever ran DrawDesignGo before -- treat as a genuine first visit
    tryFpAutoRestorePathA0().then(handled=>{
      if(handled) return;
      tryFpAutoRestorePathA().then(handled2=>{
        if(!handled2) offerFpAutoRestorePathB();
      });
    });
  }

  // ---------- Single instance: if another tab/window of this app is already
  // open, this one asks the service worker to focus that one and closes
  // itself. window.close() is blocked in an ordinary tab (harmless no-op --
  // both stay open, which is the acceptable fallback), but is allowed for an
  // installed app's own standalone window, which is exactly the case this is
  // for (clicking the desktop/taskbar icon while the app is already running).
  // Runs alongside normal bootstrap rather than blocking it, so the common
  // single-window case never waits on this.
  (function enforceSingleInstance(){
    if(!('BroadcastChannel' in window)) return;
    try{
      const bc = new BroadcastChannel('drawdesigngo-instance');
      bc.onmessage = (e)=>{
        if(e.data==='ping'){
          bc.postMessage('pong'); // an existing window answering a newcomer's ping
        } else if(e.data==='pong'){
          if(navigator.serviceWorker && navigator.serviceWorker.controller){
            navigator.serviceWorker.controller.postMessage({ type:'focus-other' });
          }
          setTimeout(()=>{ try{ window.close(); }catch(err){} }, 80);
        }
      };
      bc.postMessage('ping');
    }catch(e){}
  })();

  // ---------- PWA: bootstrap ----------
  syncInstallUI();
  fpWireDragAutoScroll();
  initFloorPlan(); // reads FP_STORAGE_KEY via fpLoad() -- must run before the empty-state check below
  maybeOfferFpAutoRestore(); // resolves "restore your data?" first (Step 7a) if warranted, then itself chains into maybeShowInstallPrompt()
  checkForUpdate();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') checkForUpdate();
  });
  checkStoragePersistence();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }

})();
</script>
</body>
</html>
