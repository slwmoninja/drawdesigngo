  // Builds the inner SVG markup for one object's icon, in inch-space (its
  // own w x d). Renders only real supplied artwork (icon:'image', see the
  // Image library and the furniture-catalog entries wired up over time) --
  // no invented outline or decoration for anything that doesn't have real
  // artwork yet; it places and resizes normally, just with no icon drawn.
  // preserveAspectRatio="none" (not the default "meet") is deliberate: the
  // resize nodes above let a user stretch just one axis -- square into
  // rectangle, circle into oval -- and the artwork needs to actually
  // stretch with it rather than staying locked to its own native aspect
  // ratio and letterboxing inside the new footprint.
  function fpIconMarkup(item){
    if(item.icon==='image' && item.img){
      return `<image href="${item.img}" x="0" y="0" width="${item.w}" height="${item.d}" preserveAspectRatio="none" />`;
    }
    return '';
  }

  function fpAddObjectFromTemplate(tpl, cx, cy){
    fpPushHistory();
    const gridSize = fpComputeGridSize();
    fpState.objects.push({
      id: fpIdSeq++, label:'', w:tpl.w, d:tpl.d, shape:tpl.shape||'rect', icon:tpl.icon||'plain',
      img: tpl.img || null,
      cx: fpSnap(cx!=null ? cx : gridSize.w/2), cy: fpSnap(cy!=null ? cy : gridSize.h/2), rot:0,
    });
    fpSave(); fpRender();
  }

  // ---------- Image library: user-uploaded graphics (logos, artwork, etc),
  // placed on the plan like a library object but rendered as a raster image
  // (see the image branch in fpIconMarkup) instead of a vector icon. Persisted
  // in localStorage so uploads -- and the seeded example -- survive a reload.
  const FP_IMAGE_LIB_KEY = 'floorplanner-image-library';
  const FP_IMAGE_DEFAULT_EDGE_IN = 16.8; // in -- longer side of a freshly-uploaded image (30% smaller than the original 24in default); resizable afterward like any object. The seeded SBI logo below is sized independently, deliberately larger.
  const FP_IMAGE_MAX_EDGE_PX = 900; // downscale uploads so a phone photo doesn't balloon storage for what's ultimately a small icon
  const FP_SBI_LOGO_SEED = { id:'seed-sbi-logo', label:'Simply Beautiful Interiors', img:'./SBI_Logo_transparent.png', w:36, d:7.05 };
  const FP_BEADS_SEED = { id:'seed-beads', label:'Beads & Buttons', img:'./SBI_Logo_mini.jpg', w:16.8, d:12.6 };
  function fpGetImageLibrary(){
    let list;
    try{
      const raw = localStorage.getItem(FP_IMAGE_LIB_KEY);
      if(raw) list = JSON.parse(raw);
    }catch(e){}
    if(!list){
      list = [Object.assign({}, FP_SBI_LOGO_SEED), Object.assign({}, FP_BEADS_SEED)];
      fpSaveImageLibrary(list);
      return list;
    }
    // One-time self-heal for the seeded SBI logo entry specifically -- picks
    // up the transparent artwork + the ~50% larger default placement size
    // even for a library that was already seeded (in localStorage) with the
    // old opaque-background image/size before this change.
    const sbi = list.find(x=>x.id==='seed-sbi-logo');
    if(sbi && sbi.img!==FP_SBI_LOGO_SEED.img){
      Object.assign(sbi, FP_SBI_LOGO_SEED);
      fpSaveImageLibrary(list);
    }
    // One-time seed for the beads-and-buttons sample graphic on a library
    // that already existed (in localStorage) before this entry was added.
    if(!list.find(x=>x.id==='seed-beads')){
      list.push(Object.assign({}, FP_BEADS_SEED));
      fpSaveImageLibrary(list);
    }
    return list;
  }
  function fpSaveImageLibrary(list){ try{ localStorage.setItem(FP_IMAGE_LIB_KEY, JSON.stringify(list)); }catch(e){} }

  // ---------- Favorites: any graphic (a furniture/material item from
  // FP_LIBRARY, or an uploaded image) right-clicked into this list, keyed by
  // its own img path/data-URL since that's the one field every such graphic
  // has and it's unique per graphic. Stored as a standalone snapshot (not a
  // reference back into FP_LIBRARY/the image library) so a favorite still
  // renders correctly even if the source upload is later removed.
  const FP_FAVORITES_KEY = 'floorplanner-favorites';
  function fpGetFavorites(){
    let list;
    try{
      const raw = localStorage.getItem(FP_FAVORITES_KEY);
      if(raw) list = JSON.parse(raw);
    }catch(e){}
    if(!Array.isArray(list)) list = [];
    // One-time seed: the beads-and-buttons sample graphic (see FP_BEADS_SEED
    // above) ships pre-favorited so the new Favorites rail isn't empty on
    // first load, and self-heals back in if a user somehow lost it.
    if(!list.find(f=>f.img===FP_BEADS_SEED.img)){
      list.unshift(Object.assign({ shape:'rect', icon:'image' }, FP_BEADS_SEED));
      fpSaveFavorites(list);
    }
    return list;
  }
  function fpSaveFavorites(list){ try{ localStorage.setItem(FP_FAVORITES_KEY, JSON.stringify(list)); }catch(e){} }
  function fpIsFavorite(tpl){ return fpGetFavorites().some(f=>f.img===tpl.img); }
  function fpToggleFavorite(tpl){
    const list = fpGetFavorites();
    const idx = list.findIndex(f=>f.img===tpl.img);
    if(idx>=0) list.splice(idx,1);
    else list.push({ label:tpl.label, shape:tpl.shape||'rect', icon:tpl.icon||'image', img:tpl.img, w:tpl.w, d:tpl.d });
    fpSaveFavorites(list);
    fpRefreshFavoritesBar();
  }
  function fpRefreshFavoritesBar(){
    const bar = document.getElementById('fpFavBar');
    const list = document.getElementById('fpFavList');
    if(!bar || !list) return;
    const favorites = fpGetFavorites();
    bar.hidden = favorites.length===0;
    list.innerHTML = '';
    favorites.forEach(entry=>{
      const tpl = { label:entry.label, shape:entry.shape||'rect', icon:entry.icon||'image', img:entry.img, w:entry.w, d:entry.d };
      // A <div>, not a <button> -- it needs to contain its own nested heart
      // <button> (see fpMakeFavHeartBtn() below), and a <button> can't
      // contain another <button> per the HTML spec.
      const btn = document.createElement('div');
      btn.className = 'fp-fav-item'; btn.draggable = true; btn.tabIndex = 0; btn.setAttribute('role','button');
      btn.title = `${entry.label} — drag onto the grid, or tap to add at center`;
      btn.innerHTML = `<img src="${entry.img}" alt="">`;
      btn.addEventListener('click', ()=> fpAddObjectFromTemplate(tpl));
      btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); fpAddObjectFromTemplate(tpl); } });
      btn.addEventListener('dragstart', (e)=>{
        e.dataTransfer.setData('application/json', JSON.stringify(tpl));
        e.dataTransfer.effectAllowed = 'copy';
      });
      btn.appendChild(fpMakeFavHeartBtn(tpl));
      list.appendChild(btn);
    });
  }

  const FP_HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-6.72-4.35-9.33-8.2C.86 10.1 1.4 6.6 4.2 5.02c2.04-1.16 4.54-.62 5.8 1.09L12 8.6l2-2.49c1.26-1.71 3.76-2.25 5.8-1.09 2.8 1.58 3.34 5.08 1.53 7.78C18.72 16.65 12 21 12 21Z"/></svg>';
  // A small heart badge overlaid on every graphic card -- in the Objects
  // accordion, Uploads, or the Favorites rail itself -- that toggles it
  // in/out of Favorites on click. Clicking anywhere else on the card still
  // drags or adds it as before (see the click/dragstart handlers around each
  // call site) -- stopPropagation here, plus draggable=false so a drag can't
  // accidentally start by pressing on the heart, are what keep the two
  // clickable regions from interfering with each other. A native title
  // attribute (not a custom tooltip) shows "Favorite"/"Remove from
  // Favorites" on hover, matching every other button's hint in this app.
  function fpMakeFavHeartBtn(tpl){
    const heart = document.createElement('button');
    heart.type = 'button'; heart.draggable = false;
    heart.innerHTML = FP_HEART_SVG;
    function sync(){
      const isFav = fpIsFavorite(tpl);
      heart.className = 'fp-fav-heart-btn' + (isFav ? ' is-fav' : '');
      heart.title = isFav ? 'Remove from Favorites' : 'Favorite';
    }
    sync();
    heart.addEventListener('click', (e)=>{
      e.stopPropagation();
      fpToggleFavorite(tpl);
      sync(); // updates this specific badge immediately; fpToggleFavorite already rebuilds the Favorites rail itself
    });
    heart.addEventListener('dragstart', (e)=> e.stopPropagation());
    return heart;
  }

  function fpReadImageFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('Could not read that file.'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error('Could not read that image.'));
        img.onload = ()=>{
          const scale = Math.min(1, FP_IMAGE_MAX_EDGE_PX/Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth*scale)), h = Math.max(1, Math.round(img.naturalHeight*scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/png'), aspect: img.naturalWidth/img.naturalHeight });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function fpAddImageToLibrary(file){
    let result;
    try{ result = await fpReadImageFile(file); }
    catch(err){ toast(err.message || 'Could not read that image.', true); return; }
    const edge = FP_IMAGE_DEFAULT_EDGE_IN;
    const w = result.aspect>=1 ? edge : edge*result.aspect;
    const d = result.aspect>=1 ? edge/result.aspect : edge;
    const label = file.name.replace(/\.[^.]+$/, '') || 'Image';
    const list = fpGetImageLibrary();
    list.push({ id:'img-'+(fpIdSeq++), label, img:result.dataUrl, w:Math.round(w*10)/10, d:Math.round(d*10)/10 });
    fpSaveImageLibrary(list);
    fpRefreshImageLibraryGrid();
  }

  function fpRefreshImageLibraryGrid(){
    const grid = document.getElementById('fpImageUploadGrid');
    if(!grid) return;
    grid.innerHTML = '';

    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'fp-lib-item fp-lib-add';
    addBtn.title = 'Add your own image';
    addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Image</span>';
    addBtn.addEventListener('click', ()=> document.getElementById('fpImageUploadInput').click());
    grid.appendChild(addBtn);

    fpGetImageLibrary().forEach(entry=>{
      const tpl = { label:entry.label, shape:'rect', icon:'image', img:entry.img, w:entry.w, d:entry.d };
      // A <div>, not a <button> -- it needs to contain its own nested heart
      // <button> (see fpMakeFavHeartBtn() below), and a <button> can't
      // contain another <button> per the HTML spec.
      const btn = document.createElement('div');
      btn.className = 'fp-lib-item'; btn.draggable = true; btn.tabIndex = 0; btn.setAttribute('role','button');
      btn.title = `${entry.label} — drag onto the grid, or tap to add at center`;
      btn.innerHTML = `<img src="${entry.img}" alt=""><span>${fpEscapeHtml(entry.label)}</span>`;
      btn.addEventListener('click', ()=> fpAddObjectFromTemplate(tpl));
      btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); fpAddObjectFromTemplate(tpl); } });
      btn.addEventListener('dragstart', (e)=>{
        e.dataTransfer.setData('application/json', JSON.stringify(tpl));
        e.dataTransfer.effectAllowed = 'copy';
      });
      btn.appendChild(fpMakeFavHeartBtn(tpl));
      grid.appendChild(btn);
    });
  }

  // A name/measurement label the user can drag to reposition (stored as a
  // feet offset from the entity's own center, in its local -- i.e.
  // pre-rotation -- frame, so it stays anchored to the entity wherever that
  // entity itself moves or rotates) while a plain tap/click still opens its
  // details modal. Shared by furniture objects and structural lines alike.
  function fpWireDraggableLabel(label, item, centerPx, rotDeg, scale, defaultDx, defaultDy, onClick, selected){
    // The label's own on-screen angle is kept independent of the entity's
    // rotation -- item.labelRot (default 0) is the ABSOLUTE screen angle the
    // text is drawn at, so by default (labelRot unset) text stays upright
    // and readable no matter how far the object/wall itself is turned,
    // instead of inheriting rotDeg and ending up upside down or sideways.
    // Subtracting rotDeg here is what cancels out the entity's own rotation.
    function reposition(){
      const dx = item.labelDx!=null ? item.labelDx : defaultDx;
      const dy = item.labelDy!=null ? item.labelDy : defaultDy;
      // Furniture objects always carry their own live item.rot -- read it
      // fresh here (rather than the rotDeg snapshot from when this label was
      // created) so a call to this same reposition() from the object's own
      // rotate-handle drag (see its onMove below) reflects the in-progress
      // angle, not the angle from the last full render. Lines/walls have no
      // .rot field at all, so they fall back to the fixed rotDeg (always 0).
      const liveRotDeg = item.rot!=null ? item.rot : rotDeg;
      const labelDeg = (item.labelRot||0) - (liveRotDeg||0);
      Object.assign(label.style, {
        left:(centerPx.x + dx*scale)+'px', top:(centerPx.y + dy*scale)+'px',
        right:'auto', bottom:'auto', marginBottom:'0',
        transform:`translate(-50%,-100%) rotate(${labelDeg}deg)`,
      });
    }
    reposition();
    let dragged = false;
    label.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      fpPushHistory();
      dragged = false;
      const startX=e.clientX, startY=e.clientY;
      const startDx = item.labelDx!=null ? item.labelDx : defaultDx;
      const startDy = item.labelDy!=null ? item.labelDy : defaultDy;
      const rad = (rotDeg||0)*Math.PI/180, cr=Math.cos(-rad), sr=Math.sin(-rad);
      try{ label.setPointerCapture(e.pointerId); }catch(err){}
      function move(ev){
        const dxScreen=ev.clientX-startX, dyScreen=ev.clientY-startY;
        if(Math.hypot(dxScreen,dyScreen)>3) dragged = true;
        const ldx = dxScreen*cr - dyScreen*sr, ldy = dxScreen*sr + dyScreen*cr;
        item.labelDx = startDx + ldx/scale;
        item.labelDy = startDy + ldy/scale;
        reposition();
      }
      function up(){
        label.removeEventListener('pointermove', move);
        label.removeEventListener('pointerup', up);
        if(dragged){ fpSave(); fpRender(); }
        else{ fpHistory.pop(); document.getElementById('fpUndoBtn').disabled = fpHistory.length===0; }
      }
      label.addEventListener('pointermove', move);
      label.addEventListener('pointerup', up);
    });
    label.addEventListener('click', (e)=>{ e.stopPropagation(); if(!dragged) onClick(); });

    // Spin handle: drag to set item.labelRot to any custom absolute angle,
    // overriding the default upright orientation above. Only shown while
    // selected (like the object's own rotate handle) -- display/overflow
    // are set directly here rather than via a shared ancestor CSS class,
    // since furniture objects (.fp-item) and walls/lines (no such wrapper)
    // don't share one.
    label.style.overflow = selected ? 'visible' : '';
    const spinHandle = document.createElement('div');
    spinHandle.className = 'fp-label-spin-handle';
    spinHandle.title = "Drag to spin this label's text angle";
    spinHandle.style.display = selected ? 'block' : 'none';
    label.appendChild(spinHandle);
    spinHandle.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      e.preventDefault();
      fpPushHistory();
      try{ spinHandle.setPointerCapture(e.pointerId); }catch(err){}
      function onMove(ev){
        const rect = label.getBoundingClientRect();
        const ccx = rect.left+rect.width/2, ccy = rect.top+rect.height/2;
        const angle = Math.atan2(ev.clientY-ccy, ev.clientX-ccx) * 180/Math.PI;
        item.labelRot = Math.round(angle/5)*5;
        reposition();
      }
      function onUp(){
        spinHandle.removeEventListener('pointermove', onMove);
        spinHandle.removeEventListener('pointerup', onUp);
        fpSave();
      }
      spinHandle.addEventListener('pointermove', onMove);
      spinHandle.addEventListener('pointerup', onUp);
    });
    return reposition;
  }

  // Asks OpenAI (text-only, via a small CORS proxy Worker -- see
  // cloudflare-worker/README.md) for a typical real-world width x depth
  // given just an item's name -- no photo involved, this is a plain text
  // completion.
  async function fpDetectObjectDimensions(name){
    const proxyUrl = fpGetOpenAiProxyUrl();
    if(!proxyUrl) throw new Error('Set your OpenAI proxy Worker URL first (see cloudflare-worker/README.md).');
    if(!fpGetOpenAiKey()) throw new Error('Set your OpenAI API key first (open Settings to add one).');
    const prompt = `You are estimating typical real-world dimensions for a piece of furniture or fixture based on its name. Item: "${name}". Respond with ONLY a JSON object, no markdown fences, no commentary: {"w": number, "d": number} -- width and depth in INCHES, typical for this item as sold/used in a home. If the name is vague, pick a reasonable common size.`;
    const resp = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'content-type':'application/json', 'authorization':'Bearer ' + fpGetOpenAiKey() },
      body: JSON.stringify({
        model: 'gpt-6-astra',
        max_completion_tokens: 200,
        response_format: { type:'json_object' },
        messages: [{ role:'user', content: prompt }],
      }),
    });
    if(!resp.ok){
      const errBody = await resp.text().catch(()=>'');
      throw new Error('API error ' + resp.status + (errBody ? ': ' + errBody.slice(0,200) : ''));
    }
    const data = await resp.json();
    const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const result = fpExtractJson(text);
    return { w: Math.max(1, Number(result.w)||24), d: Math.max(1, Number(result.d)||24) };
  }

  // ---------- Every physical-measurement field in the app (furniture size,
  // wall/opening length) is entered as a whole feet + inches pair -- e.g.
  // "0 ft, 9 in" -- rather than one decimal-feet or decimal-inches number.
  function fpFtInFieldsHtml(prefix, totalInches){
    const ft = Math.floor(Math.max(0,totalInches)/12);
    const inch = Math.round(Math.max(0,totalInches) - ft*12);
    return `<div style="display:flex; gap:.4rem; align-items:center;">
      <input type="number" id="${prefix}Ft" class="fp-detail-input" style="width:100%;" min="0" value="${ft}">
      <span class="mini">ft</span>
      <input type="number" id="${prefix}In" class="fp-detail-input" style="width:100%;" min="0" max="11" value="${inch}">
      <span class="mini">in</span>
    </div>`;
  }
  function fpSetFtInFields(wrap, prefix, totalInches){
    const ft = Math.floor(Math.max(0,totalInches)/12);
    const inch = Math.round(Math.max(0,totalInches) - ft*12);
    wrap.querySelector('#'+prefix+'Ft').value = ft;
    wrap.querySelector('#'+prefix+'In').value = inch;
  }
  function fpReadFtInFields(wrap, prefix, fallbackInches){
    const ft = parseFloat(wrap.querySelector('#'+prefix+'Ft').value);
    const inch = parseFloat(wrap.querySelector('#'+prefix+'In').value);
    const total = (isNaN(ft)?0:ft)*12 + (isNaN(inch)?0:inch);
    return total>0 ? total : fallbackInches;
  }

  function fpOpenObjectDetailsModal(item){
    const wrap = openModal('Object Details', `
      <label class="mini" style="display:block; margin-bottom:.6rem;">Name
        <input type="text" id="fpObjNameInput" class="fp-detail-input" style="width:100%; margin-top:.25rem;" value="${fpEscapeHtml(item.label||'')}">
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Width
        ${fpFtInFieldsHtml('fpObjWidth', item.w)}
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Depth
        ${fpFtInFieldsHtml('fpObjDepth', item.d)}
      </label>
      <button class="btn" id="fpObjAutoDetectBtn" type="button" style="width:100%; margin-bottom:.6rem; border-color:var(--accent); color:var(--accent);">&#10024; Auto-detect dimensions</button>
      <p class="fp-hint" id="fpObjDetectStatus" style="margin:0 0 .6rem;"></p>
      <button class="btn-primary" id="fpObjSaveBtn" type="button">Save</button>
    `);
    const nameInput = wrap.querySelector('#fpObjNameInput');
    const status = wrap.querySelector('#fpObjDetectStatus');
    nameInput.focus();
    wrap.querySelector('#fpObjAutoDetectBtn').addEventListener('click', async ()=>{
      const name = nameInput.value.trim();
      if(!name){ status.textContent = 'Enter a name first.'; return; }
      status.textContent = 'Detecting…';
      try{
        const dims = await fpDetectObjectDimensions(name);
        fpSetFtInFields(wrap, 'fpObjWidth', dims.w);
        fpSetFtInFields(wrap, 'fpObjDepth', dims.d);
        status.textContent = 'Done -- adjust if needed.';
      }catch(err){
        status.textContent = 'Failed: ' + (err && err.message ? err.message : 'unknown error');
      }
    });
    function save(){
      fpPushHistory();
      item.label = nameInput.value.trim();
      item.w = Math.max(1, fpReadFtInFields(wrap, 'fpObjWidth', item.w));
      item.d = Math.max(1, fpReadFtInFields(wrap, 'fpObjDepth', item.d));
      fpSave(); fpRender();
      wrap.remove();
    }
    wrap.querySelector('#fpObjSaveBtn').addEventListener('click', save);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  }

  // Room-name label objects (item.type==='label', see fpEnsureRoomLabel())
  // get their own lighter modal -- just the name, no width/depth/auto-detect
  // fields, since the label IS the object. Editing/saving here only ever
  // touches this one object's item.label, never fpState.title -- that's
  // what lets Russ rename an individual room without renaming the project,
  // and copy/paste this object (same Copy/Copy all/marquee system as
  // everything else) to label additional rooms independently.
  function fpOpenRoomLabelModal(item){
    const wrap = openModal('Room Name', `
      <label class="mini" style="display:block; margin-bottom:.6rem;">Name
        <input type="text" id="fpRoomLabelInput" class="fp-detail-input" style="width:100%; margin-top:.25rem;" value="${fpEscapeHtml(item.label||'')}">
      </label>
      <div style="display:flex; gap:.5rem;">
        <button class="btn" id="fpRoomLabelDeleteBtn" type="button" style="flex:1; border-color:var(--danger); color:var(--danger);">Delete</button>
        <button class="btn-primary" id="fpRoomLabelSaveBtn" type="button" style="flex:1;">Save</button>
      </div>
    `);
    const nameInput = wrap.querySelector('#fpRoomLabelInput');
    nameInput.focus(); nameInput.select();
    wrap.querySelector('#fpRoomLabelDeleteBtn').addEventListener('click', ()=>{
      fpDeleteItem('object', item.id);
      wrap.remove();
    });
    function save(){
      fpPushHistory();
      item.label = nameInput.value.trim();
      fpSave(); fpRender();
      wrap.remove();
    }
    wrap.querySelector('#fpRoomLabelSaveBtn').addEventListener('click', save);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  }

  // Any structural line -- wall, dashed wall, or a drawn opening/window/door
  // -- gets the same Name + Length treatment furniture objects get. Length
  // is the only "measurement" a line has; changing it keeps the start point
  // and current angle fixed and moves the end point to match.
  function fpOpenLineDetailsModal(el){
    const lenFt = Math.hypot(el.x2-el.x1, el.y2-el.y1);
    const wrap = openModal('Line Details', `
      <label class="mini" style="display:block; margin-bottom:.6rem;">Name
        <input type="text" id="fpLineNameInput" class="fp-detail-input" style="width:100%; margin-top:.25rem;" value="${fpEscapeHtml(el.label||'')}">
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Length
        ${fpFtInFieldsHtml('fpLineLen', lenFt*12)}
      </label>
      <div style="display:flex; gap:.5rem;">
        <button class="btn" id="fpLineDeleteBtn" type="button" style="flex:1; border-color:var(--danger); color:var(--danger);">Delete</button>
        <button class="btn-primary" id="fpLineSaveBtn" type="button" style="flex:1;">Save</button>
      </div>
    `);
    const nameInput = wrap.querySelector('#fpLineNameInput');
    nameInput.focus();
    wrap.querySelector('#fpLineDeleteBtn').addEventListener('click', ()=>{
      fpPushHistory();
      fpState.elements = fpState.elements.filter(e=>e.id!==el.id);
      fpDeselect();
      fpSave(); fpRender();
      wrap.remove();
    });
    function save(){
      fpPushHistory();
      el.label = nameInput.value.trim();
      const newLenFt = Math.max(0.5, fpReadFtInFields(wrap, 'fpLineLen', lenFt*12)/12);
      const curLen = Math.hypot(el.x2-el.x1, el.y2-el.y1) || 1;
      const ux = (el.x2-el.x1)/curLen, uy = (el.y2-el.y1)/curLen;
      el.x2 = el.x1 + ux*newLenFt; el.y2 = el.y1 + uy*newLenFt;
      fpSave(); fpRender();
      wrap.remove();
    }
    wrap.querySelector('#fpLineSaveBtn').addEventListener('click', save);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  }

  function fpDefaultState(){
    return {
      title: 'Project Title',
      elements: [],
      objects: [],
      notes: [],
    };
  }

  function fpLoad(){
    try{
      const raw = localStorage.getItem(FP_STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        fpIdSeq = parsed.__idSeq || 1000;
        delete parsed.__idSeq;
        return parsed;
      }
    }catch(e){}
    return fpDefaultState();
  }
  function fpSave(){
    try{
      const toSave = Object.assign({}, fpState, { __idSeq: fpIdSeq });
      localStorage.setItem(FP_STORAGE_KEY, JSON.stringify(toSave));
    }catch(e){}
    scheduleFpExitBackup(); // debounced silent safety-net snapshot -- see the PWA backup/restore section below
    scheduleFpProjectSave(); // keeps the active entry in Recent Projects in sync -- see below
  }
  function fpPushHistory(){
    fpHistory.push(JSON.stringify(fpState));
    if(fpHistory.length>30) fpHistory.shift();
    document.getElementById('fpUndoBtn').disabled = false;
  }
  function fpUndo(){
    if(!fpHistory.length) return;
    fpState = JSON.parse(fpHistory.pop());
    document.getElementById('fpUndoBtn').disabled = fpHistory.length===0;
    fpDeselect();
    fpSave();
    fpRender();
  }

  function fpSnap(v){ return Math.round(v/FP_GRID_STEP)*FP_GRID_STEP; }

  // Grid always starts at (0,0) and grows only in +X/+Y to cover whatever's
  // actually on the plan -- see fpElementBounds/fpObjectBoundsFeet below
  // (shared with the export code, which needs the same bounding-box math).
  function fpComputeGridSize(){
    let maxX=0, maxY=0;
    fpState.elements.forEach(el=>{ const b=fpElementBounds(el); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); });
    fpState.objects.forEach(o=>{ const b=fpObjectBoundsFeet(o); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); });
    return {
      w: Math.max(FP_GRID_MIN_W, Math.ceil(maxX + FP_GRID_PAD)),
      h: Math.max(FP_GRID_MIN_H, Math.ceil(maxY + FP_GRID_PAD)),
    };
  }
  // Shifts everything back onto the grid if anything ended up with a
  // negative coordinate (an AI import that didn't quite anchor its origin
  // at (0,0), most likely) -- the grid always starts at (0,0), so negative
  // content would render into the canvas-wrap's padding, off the visible
  // grid entirely, instead of being covered by fpComputeGridSize() above.
  function fpNormalizeOrigin(){
    let minX=Infinity, minY=Infinity;
    const consider = (x,y)=>{ minX=Math.min(minX,x); minY=Math.min(minY,y); };
    fpState.elements.forEach(el=>{ const b=fpElementBounds(el); consider(b.minX,b.minY); });
    fpState.objects.forEach(o=>{ const b=fpObjectBoundsFeet(o); consider(b.minX,b.minY); });
    if(minX===Infinity || (minX>=0 && minY>=0)) return;
    const pad = 2;
    const dx = minX<0 ? (pad-minX) : 0, dy = minY<0 ? (pad-minY) : 0;
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){ el.x1+=dx; el.y1+=dy; el.x2+=dx; el.y2+=dy; }
      else { el.cx+=dx; el.cy+=dy; }
    });
    fpState.objects.forEach(o=>{ o.cx+=dx; o.cy+=dy; });
  }

  // fpMultiSelectedIds: array of {kind,id} picked out by a marquee drag (see
  // fpMarqueeSelect()) -- a *subset* of the plan, distinct from fpSelectAllActive
  // (literally everything). null when no marquee selection is active.
  let fpMultiSelectedIds = null;
  function fpDeselect(){ fpSelectedId = null; fpSelectedKind = null; fpSelectAllActive = false; fpMultiSelectedIds = null; }

  // True if this (kind,id) is part of whatever's currently selected, in any
  // of the three selection modes (select-all, marquee multi-select, or a
  // plain single click-select). Shared by the render loop's own
  // selected/isSelected checks so all three modes highlight consistently.
  function fpIsPicked(kind, id){
    if(fpSelectAllActive) return true;
    if(fpMultiSelectedIds && fpMultiSelectedIds.some(x=>x.kind===kind && x.id===id)) return true;
    return fpSelectedKind===kind && fpSelectedId===id;
  }
  // True whenever MORE than one item could be selected at once (select-all
  // or a marquee multi-select) -- the render loop uses this to suppress
  // per-item resize/rotate handles (see .fp-multi-selected in the CSS),
  // since a handle set per item would be clutter across several of them.
  function fpIsBulkSelected(){ return fpSelectAllActive || !!(fpMultiSelectedIds && fpMultiSelectedIds.length); }

  // Lightweight selection: toggles the CSS class on existing DOM nodes and
  // drops any stale node-handle layer, instead of a full fpRender() -- so
  // it's safe to call right before a drag starts without yanking the
  // element being dragged out of the document. Resize/rotate node handles
  // for a newly selected element reappear on the next full fpRender() (on
  // drag release), which is an acceptable one-step lag in exchange for
  // never rebuilding out from under a live drag.
  function fpSelect(kind, id){
    fpSelectedKind = kind; fpSelectedId = id; fpSelectAllActive = false; fpMultiSelectedIds = null;
    document.querySelectorAll('#fpCanvas .fp-item').forEach(node=>{
      node.classList.toggle('selected', kind==='object' && Number(node.dataset.id)===id);
      // Left over from a prior select-all/marquee -- without removing it
      // here, an object picked out of one would keep its resize/rotate
      // handles suppressed (see the CSS' :not(.fp-multi-selected)) even
      // though it's now a genuine single selection.
      node.classList.remove('fp-multi-selected');
    });
    document.querySelectorAll('#fpCanvas .fp-el').forEach(node=>{
      node.classList.toggle('selected', kind==='element' && Number(node.dataset.id)===id);
    });
    const nodesLayer = document.querySelector('#fpCanvas .fp-nodes-layer');
    if(nodesLayer) nodesLayer.remove();
  }

  // "Select all" for Copy all / Ctrl+Cmd+A -- unlike fpSelect() above this
  // isn't lightweight (it needs a real fpRender() so every wall/shape/object
  // picks up fpSelectAllActive in the render loop's own selected/isSelected
  // checks), but select-all is a deliberate, infrequent action, not
  // something firing on every drag frame.
  function fpSelectAll(){
    fpDeselect();
    fpSelectAllActive = true;
    fpRender();
  }

  // Marquee (rubber-band) multi-select: everything whose bounding box falls
  // fully inside the dragged rectangle (feet, not screen px) becomes the new
  // selection -- see the Select-mode drag handling in fpWireCanvasInteraction()
  // for where box comes from. A real fpRender() (like fpSelectAll() above),
  // for the same reason: every affected item's selected state lives in the
  // render loop, not something toggled node-by-node here.
  function fpMarqueeSelect(box){
    const picked = [];
    fpState.elements.forEach(el=>{
      const b = fpElementBounds(el);
      if(b.minX>=box.x1 && b.maxX<=box.x2 && b.minY>=box.y1 && b.maxY<=box.y2) picked.push({kind:'element', id:el.id});
    });
    fpState.objects.forEach(o=>{
      const b = fpObjectBoundsFeet(o);
      if(b.minX>=box.x1 && b.maxX<=box.x2 && b.minY>=box.y1 && b.maxY<=box.y2) picked.push({kind:'object', id:o.id});
    });
    fpDeselect();
    if(picked.length===1){ fpSelect(picked[0].kind, picked[0].id); fpRender(); return; }
    if(picked.length>1) fpMultiSelectedIds = picked;
    fpRender();
  }

  // Delete tool: a toggled mode (like Draw), not a one-shot action -- once
  // on, tapping any wall/shape/object deletes it immediately and the mode
  // stays on so several items can be removed in a row; tapping the Delete
  // button again (or switching to Select/Draw) turns it back off.
  let fpDeleteModeActive = false;
  // Single source of truth for which toolbar control(s) show the green
  // "in use" border -- called after anything that can change fpMode,
  // fpDrawTool, or fpDeleteModeActive, so exactly one story is ever true at
  // once: Delete active means only Delete is highlighted (everything else
  // below is suppressed regardless of what Draw/Select tool was active
  // underneath); otherwise Select alone is highlighted in Select mode, and
  // in Draw mode both the Draw button AND whichever specific placement tool
  // is armed (the plain line/shape <select> or the Opening/Window/Door
  // dropdown, never both) are highlighted together.
  function fpSyncToolActiveUI(){
    const drawActive = fpMode==='draw' && !fpDeleteModeActive;
    const selectActive = fpMode==='select' && !fpDeleteModeActive;
    const isOpeningTool = fpDrawTool==='opening' || fpDrawTool==='window' || fpDrawTool==='door';
    const drawBtn = document.getElementById('fpModeDrawBtn');
    const selectBtn = document.getElementById('fpModeSelectBtn');
    const toolSelect = document.getElementById('fpDrawToolSelect');
    const openingBtn = document.getElementById('fpOpeningDdBtn');
    if(drawBtn) drawBtn.classList.toggle('active', drawActive);
    if(selectBtn) selectBtn.classList.toggle('active', selectActive);
    if(toolSelect) toolSelect.classList.toggle('fp-tool-select-active', drawActive && !isOpeningTool);
    if(openingBtn) openingBtn.classList.toggle('fp-opening-dd-btn-active', drawActive && isOpeningTool);
  }
  // Right-click menu: mirrors just the toolbar's 6 key-action controls (the
  // same ones with the beveled .fp-key-btn treatment). Draw/Select/Delete
  // and the Opening/Copy dropdown *triggers* work by literally .click()-ing
  // the real button -- for Opening/Copy that opens their own dropdown (same
  // as clicking them in the toolbar) rather than picking a default choice,
  // so there's exactly one code path per action and the toolbar's own
  // active-state highlighting is always correct regardless of which menu
  // triggered it. "Solid line" is the one exception: it's a plain <select>
  // option, not a button, and select.click() doesn't reliably open a native
  // dropdown via script across browsers -- so it runs a custom action that
  // sets the value and dispatches a real 'change' event instead, which
  // still routes through the select's own existing change handler rather
  // than duplicating what that handler does.
  // Sets the toolbar's draw-tool <select> and arms Draw mode -- shared by
  // "Solid line"'s own top-level click and every entry in its submenu below,
  // so picking any of them (including re-picking "Solid line" itself from
  // the fanned-out list) goes through the select's own real 'change' handler
  // rather than duplicating what it does.
  function fpRunDrawToolChoice(tool){
    const sel = document.getElementById('fpDrawToolSelect');
    sel.value = tool;
    sel.dispatchEvent(new Event('change', { bubbles:true }));
    fpSetMode('draw');
  }
  const FP_CONTEXT_MENU_ITEMS = [
    { label:'Draw', btn:'fpModeDrawBtn' },
    { label:'Solid line', submenu:[
        { label:'Solid line', run:()=>fpRunDrawToolChoice('line') },
        { label:'Dashed line', run:()=>fpRunDrawToolChoice('dashedline') },
        { label:'Rectangle', run:()=>fpRunDrawToolChoice('rect') },
        { label:'Square', run:()=>fpRunDrawToolChoice('square') },
        { label:'Circle', run:()=>fpRunDrawToolChoice('circle') },
        { label:'Oval', run:()=>fpRunDrawToolChoice('oval') },
      ] },
    { label:'Opening', btn:'fpOpeningDdBtn', submenu:[
        // Each entry .click()s the real toolbar Opening-dropdown item (same
        // single-source-of-truth approach as every other context-menu item)
        // rather than reimplementing what that click already does.
        { label:'Opening', run:()=>document.querySelector('#fpOpeningDdMenu .fp-opening-dd-item[data-tool="opening"]').click() },
        { label:'Window', run:()=>document.querySelector('#fpOpeningDdMenu .fp-opening-dd-item[data-tool="window"]').click() },
        { label:'Door', run:()=>document.querySelector('#fpOpeningDdMenu .fp-opening-dd-item[data-tool="door"]').click() },
      ] },
    { label:'Select', btn:'fpModeSelectBtn' },
    { label:'Copy', btn:'fpCopyDdBtn' },
    { label:'Delete', btn:'fpDeleteBtn' },
  ];
  // Keeps a fanned-out submenu on-screen: measures after layout and flips to
  // the opposite side/edge (via CSS classes, see .fp-flip-x/.fp-flip-y
  // above) if it would otherwise overflow the viewport near a right or
  // bottom edge -- same idea as the top-level menu's own clamp below, just
  // applied to a child flyout instead of the whole menu.
  function fpPositionContextSubmenu(sm){
    sm.classList.remove('fp-flip-x','fp-flip-y');
    requestAnimationFrame(()=>{
      const r = sm.getBoundingClientRect();
      if(r.right > window.innerWidth) sm.classList.add('fp-flip-x');
      if(r.bottom > window.innerHeight) sm.classList.add('fp-flip-y');
    });
  }
  function fpOpenContextMenu(clientX, clientY){
    const menu = document.getElementById('fpContextMenu');
    menu.innerHTML = FP_CONTEXT_MENU_ITEMS.map((it,i)=>{
      const realBtn = it.btn ? document.getElementById(it.btn) : null;
      const disabled = !!(realBtn && realBtn.disabled);
      const arrow = it.submenu ? ' <span class="fp-context-submenu-arrow">&#9656;</span>' : '';
      let html = '<div class="fp-context-menu-row">' +
        '<button type="button" class="fp-context-menu-item" data-idx="'+i+'"'+(disabled?' disabled':'')+'>'+fpEscapeHtml(it.label)+arrow+'</button>';
      if(it.submenu){
        html += '<div class="fp-context-submenu" data-parent-idx="'+i+'" hidden>' +
          it.submenu.map((sub,j)=>'<button type="button" class="fp-context-menu-item" data-idx="'+i+'" data-sub-idx="'+j+'">'+fpEscapeHtml(sub.label)+'</button>').join('') +
        '</div>';
      }
      return html + '</div>';
    }).join('');
    menu.querySelectorAll('.fp-context-menu-row > .fp-context-menu-item').forEach(node=>{
      node.addEventListener('click', (e)=>{
        // Without this, the *original* click on this menu item keeps
        // bubbling after realBtn.click() below (itself a separate, nested
        // event) already opened the Opening/Copy dropdown -- reaching the
        // document-level dismiss listener further down, which then closes
        // that dropdown right back again since this menu item isn't inside
        // it.
        e.stopPropagation();
        const it = FP_CONTEXT_MENU_ITEMS[Number(node.dataset.idx)];
        if(it.submenu){
          // Top-level click on an item with sub-choices only fans them out
          // (or folds them back in) -- it never runs an action itself, since
          // every real action now lives one level down as a specific choice.
          const sm = menu.querySelector('.fp-context-submenu[data-parent-idx="'+node.dataset.idx+'"]');
          const wasHidden = sm.hidden;
          menu.querySelectorAll('.fp-context-submenu').forEach(other=>{ other.hidden = true; });
          sm.hidden = !wasHidden;
          if(!sm.hidden) fpPositionContextSubmenu(sm);
          return;
        }
        menu.hidden = true;
        if(it.run){ it.run(); return; }
        const realBtn = document.getElementById(it.btn);
        if(realBtn && !realBtn.disabled) realBtn.click();
      });
    });
    menu.querySelectorAll('.fp-context-submenu .fp-context-menu-item').forEach(node=>{
      node.addEventListener('click', (e)=>{
        e.stopPropagation();
        menu.hidden = true;
        const sub = FP_CONTEXT_MENU_ITEMS[Number(node.dataset.idx)].submenu[Number(node.dataset.subIdx)];
        if(sub.run) sub.run();
      });
    });
    menu.style.left = clientX+'px';
    menu.style.top = clientY+'px';
    menu.hidden = false;
    // Clamp on-screen after layout -- a menu opened near the right/bottom
    // edge would otherwise render partly off the viewport.
    requestAnimationFrame(()=>{
      const r = menu.getBoundingClientRect();
      if(r.right > window.innerWidth) menu.style.left = Math.max(4, window.innerWidth - r.width - 8)+'px';
      if(r.bottom > window.innerHeight) menu.style.top = Math.max(4, window.innerHeight - r.height - 8)+'px';
    });
  }
  function fpSetDeleteMode(active){
    fpDeleteModeActive = active;
    const btn = document.getElementById('fpDeleteBtn');
    if(btn) btn.classList.toggle('active', active);
    const canvas = document.getElementById('fpCanvas');
    if(canvas) canvas.classList.toggle('fp-delete-mode', active);
    if(active) fpDeselect();
    fpSyncToolActiveUI();
  }
  function fpDeleteItem(kind, id){
    fpPushHistory();
    if(kind==='element'){
      fpState.elements = fpState.elements.filter(el=>el.id!==id);
    } else if(kind==='object'){
      fpState.objects = fpState.objects.filter(o=>o.id!==id);
    }
    if(fpSelectedId===id) fpDeselect();
    fpSave(); fpRender();
  }
  function fpDeleteSelected(){
    if(fpSelectedId==null) return;
    fpDeleteItem(fpSelectedKind, fpSelectedId);
  }

  // ---------- Export: shared bounds/SVG snapshot, used by PNG/JPG/PDF/DXF/copy ----------
  function fpObjectBoundsFeet(item){
    const hw = (item.w/12)/2, hd = (item.d/12)/2;
    return { minX:item.cx-hw, minY:item.cy-hd, maxX:item.cx+hw, maxY:item.cy+hd };
  }
  function fpElementBounds(el){
    if(fpIsLineType(el.type)){
      return { minX:Math.min(el.x1,el.x2), minY:Math.min(el.y1,el.y2), maxX:Math.max(el.x1,el.x2), maxY:Math.max(el.y1,el.y2) };
    }
    if(el.type==='circle'){
      return { minX:el.cx-el.r, minY:el.cy-el.r, maxX:el.cx+el.r, maxY:el.cy+el.r };
    }
    // rect/square/oval -- ignore rotation for a simple, slightly-generous bbox
    const half = Math.max(el.w,el.h)/2;
    return { minX:el.cx-half, minY:el.cy-half, maxX:el.cx+half, maxY:el.cy+half };
  }
  function fpComputePlanBounds(){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    const consider = b=>{ minX=Math.min(minX,b.minX); minY=Math.min(minY,b.minY); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); };
    fpState.elements.forEach(el=>consider(fpElementBounds(el)));
    fpState.objects.forEach(o=>consider(fpObjectBoundsFeet(o)));
    if(minX===Infinity) return { minX:0, minY:0, maxX:10, maxY:10 }; // empty plan fallback
    const pad = 2; // feet
    return { minX:minX-pad, minY:minY-pad, maxX:maxX+pad, maxY:maxY+pad };
  }
  function fpBoundsFor(kind, id){
    if(kind==='element'){
      const el = fpState.elements.find(e=>e.id===id);
      return el ? fpElementBounds(el) : null;
    }
    const o = fpState.objects.find(x=>x.id===id);
    return o ? fpObjectBoundsFeet(o) : null;
  }
  function fpSelectionBounds(){
    if(fpMultiSelectedIds && fpMultiSelectedIds.length){
      let b = null;
      fpMultiSelectedIds.forEach(({kind,id})=>{
        const ib = fpBoundsFor(kind, id);
        if(!ib) return;
        b = b ? { minX:Math.min(b.minX,ib.minX), minY:Math.min(b.minY,ib.minY), maxX:Math.max(b.maxX,ib.maxX), maxY:Math.max(b.maxY,ib.maxY) } : ib;
      });
      return b;
    }
    if(fpSelectedId==null) return null;
    return fpBoundsFor(fpSelectedKind, fpSelectedId);
  }

  // Builds a standalone, self-contained SVG string of the plan (or a region
  // of it) at a fixed export scale -- independent of the on-screen zoom --
  // for rasterizing to PNG/JPG, printing to PDF, or copying to the clipboard.
  const FP_EXPORT_SCALE = 40; // px per foot
  function fpBuildExportSvg(bounds){
    const scale = FP_EXPORT_SCALE;
    const w = Math.max(1, Math.round((bounds.maxX-bounds.minX)*scale));
    const h = Math.max(1, Math.round((bounds.maxY-bounds.minY)*scale));
    const px = (x,y) => [ (x-bounds.minX)*scale, (y-bounds.minY)*scale ];
    let body = '';
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){
        const lineStyle = FP_LINE_TYPE_STYLE[el.type];
        const stroke = lineStyle ? lineStyle.stroke : '#2a2f36';
        const dash = lineStyle ? lineStyle.dash : (el.type==='dashedline' ? '10,7' : null);
        const strokeWidth = lineStyle ? FP_OPENING_STROKE_WIDTH : FP_WALL_STROKE_WIDTH;
        // Plain walls skip whatever range an opening/window/door on top of
        // them covers, same as the live canvas (see fpVisibleWallRanges()) --
        // exported art shouldn't show a solid wall poking through a door.
        const ranges = lineStyle ? [[0,1]] : fpVisibleWallRanges(el, fpState.elements);
        ranges.forEach(([lo,hi])=>{
          const [x1,y1] = px(el.x1+(el.x2-el.x1)*lo, el.y1+(el.y2-el.y1)*lo);
          const [x2,y2] = px(el.x1+(el.x2-el.x1)*hi, el.y1+(el.y2-el.y1)*hi);
          body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;
        });
        if(lineStyle && lineStyle.double){
          const dxr = el.x2-el.x1, dyr = el.y2-el.y1, len = Math.hypot(dxr,dyr)||1;
          const off = 2.5/scale;
          const [ox1,oy1] = px(el.x1-dyr/len*off, el.y1+dxr/len*off);
          const [ox2,oy2] = px(el.x2-dyr/len*off, el.y2+dxr/len*off);
          body += `<line x1="${ox1}" y1="${oy1}" x2="${ox2}" y2="${oy2}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linecap="round"/>`;
        }
      } else if(el.type==='circle'){
        const [cx,cy] = px(el.cx,el.cy);
        body += `<circle cx="${cx}" cy="${cy}" r="${el.r*scale}" stroke="#2a2f36" stroke-width="2" fill="none"/>`;
      } else if(el.type==='oval'){
        const [cx,cy] = px(el.cx,el.cy);
        body += `<ellipse cx="${cx}" cy="${cy}" rx="${el.w/2*scale}" ry="${el.h/2*scale}" stroke="#2a2f36" stroke-width="2" fill="none" transform="rotate(${el.rot||0} ${cx} ${cy})"/>`;
      } else {
        const [x,y] = px(el.cx-el.w/2, el.cy-el.h/2);
        const [cx,cy] = px(el.cx,el.cy);
        body += `<rect x="${x}" y="${y}" width="${el.w*scale}" height="${el.h*scale}" stroke="#2a2f36" stroke-width="2" fill="none" transform="rotate(${el.rot||0} ${cx} ${cy})"/>`;
      }
    });
    fpState.objects.forEach(item=>{
      const pw = (item.w/12)*scale, pd = (item.d/12)*scale;
      const [x,y] = px(item.cx-item.w/24, item.cy-item.d/24);
      const [cx,cy] = px(item.cx,item.cy);
      if(item.type==='label'){
        // Room-name labels bake straight into Print/PDF/PNG/JPG/Copy-all as a
        // real heading -- no icon artwork, and left-anchored (not centered)
        // so it reads like a title sitting at its placed point rather than a
        // furniture caption floating below a shape.
        const text = (item.label && item.label.trim()) || 'Untitled Room';
        body += `<text x="${x}" y="${cy}" text-anchor="start" dominant-baseline="middle" font-size="18" font-weight="700" fill="#1f6b2c" font-family="sans-serif">${fpEscapeHtml(text)}</text>`;
        return;
      }
      body += `<g transform="rotate(${item.rot||0} ${cx} ${cy})"><svg x="${x}" y="${y}" width="${pw}" height="${pd}" viewBox="0 0 ${item.w} ${item.d}" preserveAspectRatio="none">${fpIconMarkup(item)}</svg></g>`;
      if(item.label && item.label.trim()){
        body += `<text x="${cx}" y="${y+pd+13}" text-anchor="middle" font-size="11" fill="#2a2f36" font-family="sans-serif">${fpEscapeHtml(item.label)}</text>`;
      }
    });
    return `<svg xmlns="${SVG_NS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="0" y="0" width="${w}" height="${h}" fill="#ffffff"/>${body}</svg>`;
  }
  function fpRasterizeSvg(svgString, w, h){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas);
      };
      // A bare <img> error Event has no .message -- wrap it in a real Error
      // so callers' catch blocks can show something more useful than a
      // silent, contentless failure (this is exactly what an SVG missing
      // its xmlns= attribute looks like when loaded as a standalone image).
      img.onerror = ()=> reject(new Error('Could not rasterize the generated image (invalid SVG markup).'));
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
    });
  }

  // ---------- 3D View: isometric SVG projection of the current plan ----------
  // Deterministic, built straight from fpState's own numbers -- no API call
  // to produce this part. Never shown to the user directly (client feedback
  // was that flat-shaded massing boxes aren't a usable format); it exists
  // purely as Gemini's structural reference image for the "Photoreal 3D"
  // flow below, since it's accurate by construction and can't misread a
  // dimension the way an image-reading model can.
  const FP_3D_ANGLE = Math.PI/6; // 30 deg, classic 2:1 dimetric
  function fp3dProject(x,y,z,scale){
    return [ (x-y)*Math.cos(FP_3D_ANGLE)*scale, ((x+y)*Math.sin(FP_3D_ANGLE) - z)*scale ];
  }
  function fp3dShade(hex, amt){
    const n = parseInt(hex.replace('#',''),16) || 0x999999;
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,Math.round(r+amt)));
    g=Math.max(0,Math.min(255,Math.round(g+amt)));
    b=Math.max(0,Math.min(255,Math.round(b+amt)));
    return `rgb(${r},${g},${b})`;
  }
  function fp3dPoly(pts, fill, stroke, opacity){
    const e = document.createElementNS(SVG_NS,'polygon');
    e.setAttribute('points', pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));
    e.setAttribute('fill', fill);
    e.setAttribute('stroke', stroke);
    e.setAttribute('stroke-width','0.5');
    if(opacity!=null) e.setAttribute('opacity', opacity);
    return e;
  }
  // A box at (cx,cy) in plan feet, width w (feet, local x before rotation),
  // depth d (feet, local y), height h (feet), rotated rotDeg around its own
  // center -- matches how fpState stores objects (rotation about cx/cy).
  function fp3dAddBox(g, cx,cy,z,w,d,h, rotDeg, color, scale, ox,oy, opacity){
    const rad = (rotDeg||0) * Math.PI/180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const corner = (lx,ly) => [ cx + lx*cos - ly*sin, cy + lx*sin + ly*cos ];
    const c0=corner(-w/2,-d/2), c1=corner(w/2,-d/2), c2=corner(w/2,d/2), c3=corner(-w/2,d/2);
    const b0=fp3dProject(c0[0],c0[1],z,scale), b1=fp3dProject(c1[0],c1[1],z,scale), b2=fp3dProject(c2[0],c2[1],z,scale), b3=fp3dProject(c3[0],c3[1],z,scale);
    const t0=fp3dProject(c0[0],c0[1],z+h,scale), t1=fp3dProject(c1[0],c1[1],z+h,scale), t2=fp3dProject(c2[0],c2[1],z+h,scale), t3=fp3dProject(c3[0],c3[1],z+h,scale);
    const off = p => [p[0]+ox, p[1]+oy];
    g.appendChild(fp3dPoly([t0,t1,t2,t3].map(off), fp3dShade(color,26), fp3dShade(color,-20), opacity));
    g.appendChild(fp3dPoly([b0,b1,t1,t0].map(off), fp3dShade(color,0), fp3dShade(color,-30), opacity));
    g.appendChild(fp3dPoly([b0,b3,t3,t0].map(off), fp3dShade(color,-35), fp3dShade(color,-50), opacity));
  }
  function fp3dAddWallPlane(g, x1,y1,x2,y2, h, color, scale, ox,oy, opacity){
    const b0=fp3dProject(x1,y1,0,scale), b1=fp3dProject(x2,y2,0,scale), t1=fp3dProject(x2,y2,h,scale), t0=fp3dProject(x1,y1,h,scale);
    const off = p=>[p[0]+ox,p[1]+oy];
    g.appendChild(fp3dPoly([b0,b1,t1,t0].map(off), color, fp3dShade(color,-40), opacity));
  }
  function fp3dRawBounds(){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    const consider=(x,y)=>{ minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); };
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){ consider(el.x1,el.y1); consider(el.x2,el.y2); }
      else if(el.type==='circle'){ consider(el.cx-el.r,el.cy-el.r); consider(el.cx+el.r,el.cy+el.r); }
      else { const half=Math.max(el.w,el.h)/2; consider(el.cx-half,el.cy-half); consider(el.cx+half,el.cy+half); }
    });
    fpState.objects.forEach(o=>{
      if(o.type==='label') return;
      const hw=(o.w/12)/2, hd=(o.d/12)/2;
      consider(o.cx-hw,o.cy-hd); consider(o.cx+hw,o.cy+hd);
    });
    if(minX===Infinity) return { minX:0,minY:0,maxX:16,maxY:16 };
    return { minX,minY,maxX,maxY };
  }
  // Buckets a wall-ish line element by which side of the room's bounding box
  // it runs along, so we can decide which two (adjacent) walls to render
  // solid vs. leave open for the camera to see inside -- 'other' covers
  // diagonal/chamfered segments that aren't clearly on one side.
  function fp3dClassifySide(el, b){
    const dx=el.x2-el.x1, dy=el.y2-el.y1;
    const midX=(el.x1+el.x2)/2, midY=(el.y1+el.y2)/2;
    const cx=(b.minX+b.maxX)/2, cy=(b.minY+b.maxY)/2;
    if(Math.abs(dy) <= Math.abs(dx)*0.25) return midY < cy ? 'top' : 'bottom';
    if(Math.abs(dx) <= Math.abs(dy)*0.25) return midX < cx ? 'left' : 'right';
    return 'other';
  }
  // Picks the pair of adjacent sides with the most windows/doors on them --
  // those are the walls worth showing solid (you can't see a window in a
  // wall that isn't drawn). The opposite two sides are left open so the
  // camera can see the furniture inside, same convention as a dollhouse cutaway.
  function fp3dChooseSolidSides(walls, features, b){
    const counts = { top:0, bottom:0, left:0, right:0 };
    features.forEach(f=>{ const s=fp3dClassifySide(f,b); if(counts[s]!=null) counts[s]++; });
    const pairs = [['top','left'],['top','right'],['bottom','left'],['bottom','right']];
    let best = pairs[0], bestScore = -1;
    pairs.forEach(p=>{ const score = counts[p[0]]+counts[p[1]]; if(score>bestScore){ bestScore=score; best=p; } });
    return { a:best[0], b:best[1] };
  }
  function fp3dHeightFor(label){
    const s = (label||'').toLowerCase();
    if(/\b(bed|crib|bunk)\b/.test(s)) return 1.9;
    if(/\b(pool|pond|spa|hot tub|plunge)\b/.test(s)) return 0.3;
    if(/\b(wardrobe|armoire|bookshelf|bookcase|cabinet|hutch|filing|credenza)\b/.test(s)) return 5.2;
    if(/\b(fridge|refrigerator|dishwasher|washer|dryer|island|hob|sink|range|oven)\b/.test(s)) return 3.0;
    if(/\b(lamp|light|pendant|sconce|chandelier|fixture)\b/.test(s)) return 0.4;
    if(/\b(sofa|sectional|loveseat|chaise|daybed|bench)\b/.test(s)) return 2.3;
    if(/\b(chair|stool|recliner|ottoman)\b/.test(s)) return 2.7;
    if(/\b(rug|planter|hedge|path|paver|decking|deck box)\b/.test(s)) return 0.25;
    return 2.4;
  }
  function fp3dBuildSvg(){
    const scale = 26;
    const b = fp3dRawBounds();
    const pad = 2;
    const wallElements = fpState.elements.filter(el=>fpIsLineType(el.type));
    const walls = wallElements.filter(el=>el.type==='line'||el.type==='dashedline');
    const features = wallElements.filter(el=>!!FP_LINE_TYPE_STYLE[el.type]); // opening/window/door
    const solid = fp3dChooseSolidSides(walls, features, b);
    const isSolidSide = side => side===solid.a || side===solid.b;
    const height = 8; // ft -- not captured on the 2D plan, assumed standard ceiling

    // Find the actual screen-space bounding box by projecting all 8 corners
    // of the padded footprint (at floor and ceiling height) -- with this
    // projection formula, the extreme edges are NOT simply the (minX,minY)
    // and (maxX,maxY) plan corners (e.g. (minX,maxY) projects to the most
    // negative screen-x), so this has to be measured rather than assumed.
    const corners3d = [];
    [b.minX-pad, b.maxX+pad].forEach(x=>[b.minY-pad, b.maxY+pad].forEach(y=>[0,height].forEach(z=>corners3d.push([x,y,z]))));
    const projCorners = corners3d.map(([x,y,z])=>fp3dProject(x,y,z,scale));
    const minSx = Math.min(...projCorners.map(p=>p[0])), maxSx = Math.max(...projCorners.map(p=>p[0]));
    const minSy = Math.min(...projCorners.map(p=>p[1])), maxSy = Math.max(...projCorners.map(p=>p[1]));
    const margin = 20;
    const pxW = Math.round(maxSx - minSx) + margin*2;
    const pxH = Math.round(maxSy - minSy) + margin*2;

    const svg = document.createElementNS(SVG_NS,'svg');
    // createElementNS sets the SVG namespace on the live DOM node, but
    // .outerHTML serialization doesn't reliably re-emit it as an xmlns=
    // attribute -- fine for an element living in an HTML page, but fatal
    // once that markup is lifted out as a standalone data:image/svg+xml
    // string (fpRasterizeSvg, below): without an explicit xmlns, the <img>
    // has no context to know it's SVG and just fails to load, silently,
    // with an error Event that has no .message -- which is why this used
    // to surface as a bare "Something went wrong" with no other detail.
    svg.setAttribute('xmlns', SVG_NS);
    svg.setAttribute('viewBox', `0 0 ${pxW} ${pxH}`);
    svg.setAttribute('width', pxW); svg.setAttribute('height', pxH);
    svg.setAttribute('style', 'max-width:100%; height:auto; display:block;');
    const g = document.createElementNS(SVG_NS,'g');
    svg.appendChild(g);
    const ox = margin - minSx, oy = margin - minSy;

    // Floor (bounding-box rectangle -- simple and robust for any plan shape;
    // a chamfered corner will still show correctly in the walls above it,
    // just with the floor slab extending very slightly past it underneath).
    const f0=fp3dProject(b.minX-pad,b.minY-pad,0,scale), f1=fp3dProject(b.maxX+pad,b.minY-pad,0,scale),
          f2=fp3dProject(b.maxX+pad,b.maxY+pad,0,scale), f3=fp3dProject(b.minX-pad,b.maxY+pad,0,scale);
    g.appendChild(fp3dPoly([f0,f1,f2,f3].map(p=>[p[0]+ox,p[1]+oy]), '#d8c9a8', '#a9976f'));

    // Walls: solid sides get a full-height plane per visible (non-opening)
    // sub-range, plus a feature pane/panel for any window or door on them.
    // Non-orthogonal (chamfer) segments always render, at partial height,
    // since they're a real boundary feature regardless of camera side.
    walls.forEach(w=>{
      const side = fp3dClassifySide(w, b);
      if(side==='other'){
        fp3dAddWallPlane(g, w.x1,w.y1,w.x2,w.y2, height*0.35, '#e9e2d3', scale, ox,oy, 0.95);
        return;
      }
      if(!isSolidSide(side)) return;
      const dir = fpLineDir(w);
      fpVisibleWallRanges(w, fpState.elements).forEach(([lo,hi])=>{
        const x1=w.x1+(w.x2-w.x1)*lo, y1=w.y1+(w.y2-w.y1)*lo, x2=w.x1+(w.x2-w.x1)*hi, y2=w.y1+(w.y2-w.y1)*hi;
        fp3dAddWallPlane(g, x1,y1,x2,y2, height, '#efe9dd', scale, ox,oy, 1);
      });
    });
    features.forEach(f=>{
      const side = fp3dClassifySide(f, b);
      if(!isSolidSide(side)) return;
      if(f.type==='window'){
        fp3dAddWallPlane(g, f.x1,f.y1,f.x2,f.y2, height*0.6, '#bfe1f2', scale, ox,oy, 0.9);
      } else if(f.type==='door'){
        fp3dAddWallPlane(g, f.x1,f.y1,f.x2,f.y2, height*0.75, '#8a5a34', scale, ox,oy, 0.85);
      }
      // 'opening' (no fixture) intentionally left as a gap -- nothing drawn.
    });

    // Floor-level items (freeform shapes) + furniture, painter-sorted far-to-near.
    const items = [];
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)) return;
      const color = el.color || '#8b8d8e';
      if(el.type==='circle'){
        items.push({ cx:el.cx, cy:el.cy, w:el.r*2, d:el.r*2, h:0.08, rot:0, color });
      } else {
        items.push({ cx:el.cx, cy:el.cy, w:el.w, d:el.h, h:0.08, rot:el.rot||0, color });
      }
    });
    fpState.objects.forEach(o=>{
      if(o.type==='label') return;
      items.push({ cx:o.cx, cy:o.cy, w:o.w/12, d:o.d/12, h:fp3dHeightFor(o.label), rot:o.rot||0, color:'#93a3ac' });
    });
    items.sort((a,b2)=>(a.cx+a.cy)-(b2.cx+b2.cy));
    items.forEach(it=>{
      fp3dAddBox(g, it.cx, it.cy, 0, it.w, it.d, it.h, it.rot, it.color, scale, ox,oy);
    });

    return svg;
  }

  // Plain-text, coordinate-exact description of the plan -- sent to Gemini
  // alongside the wireframe reference image so it has the real numbers to
  // fall back on rather than only visually estimating them off the image
  // (the same "read structured data, not a picture" principle the free 3D
  // View is built on, applied to the photoreal request too).
  function fp3dBuildTextSpec(){
    const b = fp3dRawBounds();
    const lines = [];
    lines.push(`Room bounding box: ${(b.maxX-b.minX).toFixed(1)} ft x ${(b.maxY-b.minY).toFixed(1)} ft. Ceiling height: 8 ft (assumed -- not specified on the original plan). All coordinates below are in feet, in the same (x,y) system, x increasing to the right and y increasing "down"/away, matching the attached reference image exactly.`);
    const wallEls = fpState.elements.filter(el=>el.type==='line'||el.type==='dashedline');
    if(wallEls.length){
      lines.push('Wall segments (straight boundary lines):');
      wallEls.forEach(w=>lines.push(`- (${w.x1.toFixed(1)}, ${w.y1.toFixed(1)}) to (${w.x2.toFixed(1)}, ${w.y2.toFixed(1)})`));
    }
    const features = fpState.elements.filter(el=>!!FP_LINE_TYPE_STYLE[el.type]);
    if(features.length){
      lines.push('Windows and doors:');
      features.forEach(f=>lines.push(`- ${f.type} from (${f.x1.toFixed(1)}, ${f.y1.toFixed(1)}) to (${f.x2.toFixed(1)}, ${f.y2.toFixed(1)})`));
    }
    const furniture = fpState.objects.filter(o=>o.type!=='label');
    if(furniture.length){
      lines.push('Furniture and fixtures (center point, width x depth in feet, rotation in degrees clockwise):');
      furniture.forEach(o=>{
        const label = (o.label && o.label.trim()) || 'unlabeled item';
        lines.push(`- ${label} at (${o.cx.toFixed(1)}, ${o.cy.toFixed(1)}), ${(o.w/12).toFixed(2)} x ${(o.d/12).toFixed(2)} ft, rotation ${o.rot||0}°`);
      });
    }
    return lines.join('\n');
  }
  function fp3dBuildPhotorealPrompt(){
    return `Attached is a plain schematic isometric "wireframe" reference image of an interior room, generated directly from precise coordinates (listed below -- trust these numbers over anything you might otherwise visually estimate from the image).\n\n${fp3dBuildTextSpec()}\n\nGenerate a photorealistic 3D isometric interior render of this exact room: the same room shape, the same wall/window/door positions and sizes, and the same furniture pieces in the same positions, sizes, and orientations as listed above and shown in the reference image. Add realistic materials, finishes, lighting, and appropriate decor -- but do not change the structure, dimensions, door/window placement, or furniture layout, and keep the same isometric camera angle as the reference image.`;
  }
  const FP_GEMINI_IMAGE_MODEL = 'gemini-3.1-flash-image';
  async function fp3dGeneratePhotoreal(svg){
    const key = fpGetGeminiKey();
    const proxyUrl = fpGetGeminiProxyUrl();
    if(!key) throw new Error('Set your Gemini API key first (Settings > Photoreal 3D).');
    if(!proxyUrl) throw new Error('Set your Gemini proxy Worker URL first (Settings > Photoreal 3D).');
    const w = Number(svg.getAttribute('width')), h = Number(svg.getAttribute('height'));
    const canvas = await fpRasterizeSvg(svg.outerHTML, w, h);
    const base64 = canvas.toDataURL('image/png').split(',')[1];
    const resp = await fetch(`${proxyUrl}/v1beta/models/${FP_GEMINI_IMAGE_MODEL}:generateContent`, {
      method: 'POST',
      headers: { 'content-type':'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ parts: [
          { text: fp3dBuildPhotorealPrompt() },
          { inline_data: { mime_type: 'image/png', data: base64 } },
        ] }],
        generationConfig: { responseModalities: ['IMAGE'] },
      }),
    });
    if(!resp.ok){
      const errBody = await resp.text().catch(()=>'');
      if(resp.status === 429){
        // Image-output models like this one commonly carry a Free-tier quota of
        // zero -- the very first call 429s, it's not usage building up over time.
        // Billing on the linked Cloud project (not necessarily spending anything)
        // is what unlocks a real quota. See aistudio.google.com/rate-limit.
        throw new Error(`This Gemini model (${FP_GEMINI_IMAGE_MODEL}) may not be available on your key's Free tier -- image models often have a quota of 0 there, so even a first-ever call fails. Check aistudio.google.com/rate-limit for this model, and enable billing on the linked Google Cloud project if it shows 0.`);
      }
      throw new Error('Gemini API error ' + resp.status + (errBody ? ': ' + errBody.slice(0,300) : ''));
    }
    const data = await resp.json();
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const imgPart = parts.find(p=>p.inlineData && p.inlineData.data);
    if(!imgPart){
      const reason = data.candidates && data.candidates[0] && data.candidates[0].finishReason;
      throw new Error('Gemini did not return an image.' + (reason ? ' (finishReason: '+reason+')' : ''));
    }
    return `data:${imgPart.inlineData.mimeType || 'image/png'};base64,${imgPart.inlineData.data}`;
  }

  // The schematic wireframe (fp3dBuildSvg) is never shown to the user --
  // client feedback was that flat-shaded massing boxes aren't a usable
  // format for them or their clients. It still exists purely as Gemini's
  // structural reference image (see fp3dGeneratePhotoreal), passed as
  // inline image data and never rendered into the page.
  function fp3dOpenViewModal(){
    if(!fpState || (!fpState.elements.length && !fpState.objects.length)){
      toast('Draw or import a floor plan first.', true);
      return;
    }
    if(!fpGetGeminiKey() || !fpGetGeminiProxyUrl()){
      const wrap = openModal('3D View',
        '<p class="fp-hint" style="margin-top:0;">This turns your plan into a photorealistic 3D isometric render, using your own Gemini API key.</p>' +
        '<p class="fp-hint">No Gemini key saved yet. <a href="#" id="fp3dOpenSettingsLink">Set it up in Settings</a>.</p>'
      );
      wrap.querySelector('#fp3dOpenSettingsLink').addEventListener('click', (e)=>{ e.preventDefault(); wrap.remove(); infoBtn.click(); });
      return;
    }
    const wrap = openModal('3D View',
      '<p class="fp-hint" id="fp3dStatus" style="margin-top:0;">Generating a photorealistic 3D isometric render with Gemini -- this can take up to a minute...</p>' +
      '<div id="fp3dResult"></div>'
    );
    async function run(){
      const status = wrap.querySelector('#fp3dStatus');
      const resultWrap = wrap.querySelector('#fp3dResult');
      status.textContent = 'Generating a photorealistic 3D isometric render with Gemini -- this can take up to a minute...';
      resultWrap.innerHTML = '';
      try{
        const svg = fp3dBuildSvg();
        const dataUrl = await fp3dGeneratePhotoreal(svg);
        status.textContent = '';
        resultWrap.innerHTML = '<img id="fp3dImg" style="max-width:100%; border-radius:8px; display:block;">' +
          '<div style="margin-top:.6rem; display:flex; gap:.5rem; justify-content:flex-end;">' +
            '<button type="button" class="btn" id="fp3dRetryBtn">Regenerate</button>' +
            '<button type="button" class="btn" id="fp3dDownloadBtn" style="border-color:var(--accent); color:var(--accent);">Download PNG</button>' +
          '</div>';
        resultWrap.querySelector('#fp3dImg').src = dataUrl;
        resultWrap.querySelector('#fp3dDownloadBtn').addEventListener('click', async ()=>{
          const blob = await (await fetch(dataUrl)).blob();
          await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}-3d.png`, 'PNG image', {'image/png':['.png']});
        });
        resultWrap.querySelector('#fp3dRetryBtn').addEventListener('click', run);
      }catch(err){
        status.textContent = (err && err.message) || 'Something went wrong.';
        resultWrap.innerHTML = '<div style="text-align:right;"><button type="button" class="btn" id="fp3dRetryBtn">Try again</button></div>';
        resultWrap.querySelector('#fp3dRetryBtn').addEventListener('click', run);
      }
    }
    run();
  }

  function fpSafeFileName(title){
    return (title||'floor-plan').trim().replace(/[\\/:*?"<>|]+/g,'-').slice(0,60) || 'floor-plan';
  }
  // Always shows a fresh save-location picker (unlike the auto-backup path,
  // which silently reuses a remembered handle) -- this is "Save As", so a new
  // destination each time is the point.
  async function fpSaveBlobWithPicker(blob, suggestedName, description, acceptMap){
    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({ suggestedName, types:[{ description, accept:acceptMap }] });
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        return true;
      }catch(e){ if(e && e.name==='AbortError') return false; /* else fall through to plain download */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = suggestedName;
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  }

  async function fpExportRaster(format){ // 'png' | 'jpeg'
    const bounds = fpComputePlanBounds();
    const svg = fpBuildExportSvg(bounds);
    const w = Math.round((bounds.maxX-bounds.minX)*FP_EXPORT_SCALE), h = Math.round((bounds.maxY-bounds.minY)*FP_EXPORT_SCALE);
    const canvas = await fpRasterizeSvg(svg, w, h);
    const mime = format==='jpeg' ? 'image/jpeg' : 'image/png';
    const blob = await new Promise(res=>canvas.toBlob(res, mime, 0.95));
    if(!blob){ toast('Could not create the image.', true); return; }
    const ext = format==='jpeg' ? 'jpg' : 'png';
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.${ext}`, format==='jpeg'?'JPEG image':'PNG image', {[mime]:['.'+ext]});
  }

  async function fpExportPdf(){
    const bounds = fpComputePlanBounds();
    const svg = fpBuildExportSvg(bounds);
    const container = document.getElementById('fpPrintContainer');
    container.innerHTML = svg;
    document.body.classList.add('fp-printing');
    window.print();
    // No reliable "print dialog closed" event across browsers -- clear the
    // print-only content shortly after, well past when the dialog opens.
    setTimeout(()=>{ document.body.classList.remove('fp-printing'); container.innerHTML=''; }, 1000);
  }

  async function fpExportProjectFile(){
    const json = fpBackupPayload();
    if(!json){ toast('Nothing to export yet.', true); return; }
    const blob = new Blob([json], {type:'application/json'});
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.json`, 'DrawDesignGo project file', {'application/json':['.json']});
  }

  // ---- DXF export -----------------------------------------------------
  // True binary DWG is a large, proprietary Autodesk format -- infeasible to
  // write correctly from scratch. DXF is the open, text-based CAD exchange
  // format AutoCAD (and virtually everything else) reads natively, so it
  // actually satisfies "import into other CAD programs" without pretending
  // to be a real DWG file. Coordinates are in feet; Y is flipped since DXF's
  // convention is Y-up while this app's plan uses screen-style Y-down.
  function fpDxfLine(x1,y1,x2,y2){ return `0\nLINE\n8\n0\n10\n${x1}\n20\n${y1}\n11\n${x2}\n21\n${y2}\n`; }
  function fpDxfCircle(cx,cy,r){ return `0\nCIRCLE\n8\n0\n10\n${cx}\n20\n${cy}\n40\n${r}\n`; }
  function fpDxfText(x,y,text,height){ return `0\nTEXT\n8\n0\n10\n${x}\n20\n${y}\n40\n${height}\n1\n${String(text).replace(/[\r\n]+/g,' ')}\n`; }
  function fpRotatePoint(x,y,cx,cy,deg){
    const rad = deg*Math.PI/180;
    const dx=x-cx, dy=y-cy;
    return [ cx+dx*Math.cos(rad)-dy*Math.sin(rad), cy+dx*Math.sin(rad)+dy*Math.cos(rad) ];
  }
  function fpBuildDxf(){
    let body = '';
    const flipY = y => -y;
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){
        body += fpDxfLine(el.x1, flipY(el.y1), el.x2, flipY(el.y2));
        const lineStyle = FP_LINE_TYPE_STYLE[el.type];
        if(lineStyle && lineStyle.double){
          const dxr = el.x2-el.x1, dyr = el.y2-el.y1, len = Math.hypot(dxr,dyr)||1, off = 0.2;
          body += fpDxfLine(el.x1-dyr/len*off, flipY(el.y1+dxr/len*off), el.x2-dyr/len*off, flipY(el.y2+dxr/len*off));
        }
      } else if(el.type==='circle'){
        body += fpDxfCircle(el.cx, flipY(el.cy), el.r);
      } else if(el.type==='oval'){
        const N=48; let prev=null;
        for(let i=0;i<=N;i++){
          const t=(i/N)*2*Math.PI;
          let x=el.cx+Math.cos(t)*el.w/2, y=el.cy+Math.sin(t)*el.h/2;
          [x,y]=fpRotatePoint(x,y,el.cx,el.cy,el.rot||0);
          if(prev) body += fpDxfLine(prev[0], flipY(prev[1]), x, flipY(y));
          prev=[x,y];
        }
      } else { // rect | square
        const hw=el.w/2, hh=el.h/2;
        const corners = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy])=>fpRotatePoint(el.cx+dx, el.cy+dy, el.cx, el.cy, el.rot||0));
        for(let i=0;i<4;i++){ const a=corners[i], b=corners[(i+1)%4]; body += fpDxfLine(a[0], flipY(a[1]), b[0], flipY(b[1])); }
      }
    });
    fpState.objects.forEach(item=>{
      const hw=(item.w/12)/2, hd=(item.d/12)/2;
      const corners = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([dx,dy])=>fpRotatePoint(item.cx+dx, item.cy+dy, item.cx, item.cy, item.rot||0));
      for(let i=0;i<4;i++){ const a=corners[i], b=corners[(i+1)%4]; body += fpDxfLine(a[0], flipY(a[1]), b[0], flipY(b[1])); }
      if(item.label && item.label.trim()){
        body += fpDxfText(item.cx-hw, flipY(item.cy-hd-0.3), item.label, 0.25);
      }
    });
    return `0\nSECTION\n2\nENTITIES\n${body}0\nENDSEC\n0\nEOF\n`;
  }
  async function fpExportDxf(){
    const dxf = fpBuildDxf();
    const blob = new Blob([dxf], {type:'application/dxf'});
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.dxf`, 'DXF drawing (opens in AutoCAD and most CAD software)', {'application/dxf':['.dxf']});
  }
