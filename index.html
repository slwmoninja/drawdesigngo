<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DrawDesignGo — Grid-based floor plan editor</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png?v=1e2652ec">
<link rel="apple-touch-icon" href="./icon-192.png?v=1e2652ec">
<style>
  :root{
    --bg:#ffffff; --panel:#f6f7f9; --panel2:#eceef1; --border:#dde1e6;
    --text:#1c2128; --dim:#6b7280; --accent:#0f9c86; --accent-dim:#0b7d6a;
    --danger:#c93756; --danger-dim:#a12945; --warn:#a3720a;
    --obj:#5b7a99; --obj-dim:#48627e; /* furniture/object color -- distinct from the teal UI accent */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  header{
    display:flex; flex-direction:column; gap:.25rem; padding:.75rem 1rem;
    border-bottom:1px solid var(--border); background:var(--panel);
    position:sticky; top:0; z-index:20;
  }
  header .headerTop{ display:flex; align-items:center; gap:.6rem; }
  header h1{ margin:0; line-height:0; display:flex; align-items:center; gap:.6rem; }
  header h1 img{ height:3.4rem; width:auto; display:block; border-radius:6px; }
  header h1 .header-mark{ height:5.98rem; width:5.98rem; border-radius:50%; flex:none; }
  header .spacer{flex:1;}

  main{max-width:1180px; margin:0 auto; padding:1rem;}

  /* ---------- Buttons: one consistent look for every key action/mode control.
     Hierarchy comes from label and position, not from mixing filled/outline/pill
     styles -- hover/long-press on any of them shows its title as a brief hint
     (see the Hints section below) instead of permanent on-screen instructions. */
  .btn{
    background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:.45rem .75rem; font-weight:600; font-size:.82rem;
    cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn.active{ border-color:var(--accent); color:var(--accent); background:rgba(64,208,181,.12); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:.6rem .7rem; margin-bottom:.8rem;
  }
  .toolbar label.mini{ color:var(--dim); font-size:.75rem; display:flex; align-items:center; gap:.4rem; }
  .toolbar .divider{ width:1px; align-self:stretch; background:var(--border); margin:0 .2rem; }

  /* ---------- Floor Plan screen ---------- */
  #floorplanScreen{ display:block; }
  .segGroup{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .fp-toolbar .spacer{ flex:1; }
  .fp-toolbar select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:.45rem .6rem; font-size:.82rem;
  }
  /* Mirrors .btn.active -- lets the draw-tool <select> show the same green
     "in use" border as every other active-tool control (see
     fpSyncToolActiveUI()) when its own value is the current fpDrawTool. */
  .fp-toolbar select.fp-tool-select-active{ border-color:var(--accent); color:var(--accent); background:rgba(64,208,181,.12); }

  /* ---------- Opening/Window/Door tool dropdown (custom, not <select>, so
     each option can show a small line-style icon next to its label). ---------- */
  .fp-opening-dd{ position:relative; }
  .fp-opening-dd-btn-active{ border-color:var(--accent); color:var(--accent); }
  #fpOpeningDdBtn{ display:inline-flex; align-items:center; gap:.4rem; }
  .fp-opening-dd-menu{
    position:absolute; top:calc(100% + .3rem); left:0; z-index:15; min-width:9rem;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.15); padding:.3rem; display:flex; flex-direction:column; gap:.15rem;
  }
  .fp-opening-dd-menu[hidden]{ display:none; }
  .fp-opening-dd-item{
    display:flex; align-items:center; gap:.5rem; background:transparent; border:none;
    color:var(--text); font-size:.82rem; font-weight:600; padding:.4rem .5rem; border-radius:6px; cursor:pointer;
  }
  .fp-opening-dd-item:hover{ background:var(--panel2); }
  .fp-layout{ display:grid; grid-template-columns:1fr; gap:.9rem; align-items:start; }
  @media (min-width:900px){ .fp-layout{ grid-template-columns:1fr 300px; } }

  .fp-main{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:.8rem 1rem 1rem; min-width:0; /* grid items default to min-width:auto,
    which would let this grow to fit the canvas's own (auto-fit-computed)
    width instead of the grid track -- without this, canvas width and the
    autoFit calc that derives from wrap.clientWidth feed back into each
    other, growing a little on every re-render (i.e. on every edit). */
  }
  .fp-title{
    margin:.1rem 0 .7rem; font-size:1.15rem; font-weight:700; color:#228B22;
    outline:none; border-radius:6px; padding:.15rem .3rem; display:inline-block;
    /* Embossed: a light highlight above-left plus a dark shadow below-right
       reads as raised/pressed-into-the-page, rather than a flat drop shadow. */
    text-shadow: -1px -1px 0 rgba(255,255,255,.55), 1px 1px 1.5px rgba(0,0,0,.45);
  }
  .fp-title:hover, .fp-title:focus{ background:var(--panel2); }
  .fp-zoom-row{
    display:flex; align-items:center; gap:.4rem; margin:0 0 .5rem;
  }
  .fp-zoom-btn{ padding:.15rem .55rem; min-width:2rem; }
  .fp-canvas-wrap{
    overflow:auto; border-radius:10px;
    background:radial-gradient(ellipse at 50% 40%, #f4f5f7 0%, #e6e9ec 100%);
    padding:40px;
  }
  .fp-canvas{
    position:relative; background:#ffffff;
    border:2px solid rgba(28,33,40,.2); box-sizing:content-box;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
  }
  .fp-canvas.fp-draw-mode{ cursor:crosshair; }
  .fp-canvas.fp-delete-mode,
  .fp-canvas.fp-delete-mode .fp-el,
  .fp-canvas.fp-delete-mode .fp-el .fp-el-shape,
  .fp-canvas.fp-delete-mode .fp-item{
    cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 24 24'><path d='M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14' fill='none' stroke='%23c93756' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") 12 12, pointer;
  }
  #fpDeleteBtn.active{ border-color:var(--danger); color:var(--danger); background:rgba(201,55,86,.12); }
  .fp-svg{ position:absolute; left:0; top:0; pointer-events:none; }
  .fp-el{ pointer-events:auto; }
  .fp-el .fp-el-shape{ cursor:grab; }
  .fp-el.selected .fp-el-shape{ stroke:var(--accent) !important; }
  .fp-el.selected .fp-el-shape-secondary{ stroke:var(--accent) !important; }
  /* Hide-under-opening (see fpVisibleWallRanges()): a wall's real shape
     stays in the DOM as an invisible full-span hit-target so it's still
     selectable/draggable across its whole original length, while the
     decorative .fp-el-shape-visible segments draw only what isn't covered. */
  .fp-el-shape.fp-hidden-under-opening{ opacity:0; }
  .fp-node, .fp-rotate-node{
    fill:var(--accent); stroke:#0a1512; stroke-width:1.5px; cursor:pointer; pointer-events:auto;
  }
  .fp-rotate-node{ fill:var(--warn); }
  /* Draw mode always means "place the next thing," even when the pointer
     happens to be over an existing wall/opening/object -- a hand/grab
     cursor there implied you could drag it, which conflicted with the very
     common case of tracing an opening/window/door directly on top of a
     wall. Higher specificity than the plain .fp-el-shape/.fp-item rules
     above, so this wins regardless of source order (mirrors the existing
     .fp-canvas.fp-delete-mode override pattern). */
  .fp-canvas.fp-draw-mode .fp-el .fp-el-shape,
  .fp-canvas.fp-draw-mode .fp-item{ cursor:crosshair; }

  .fp-item{
    position:absolute; cursor:grab; touch-action:none; user-select:none;
  }
  .fp-item:active{ cursor:grabbing; }
  .fp-item.selected{ z-index:5; }
  .fp-item-icon{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .fp-item-label{
    position:absolute; left:50%; bottom:100%; margin-bottom:.3rem; transform:translateX(-50%);
    font-size:.68rem; font-weight:600; color:var(--text); outline:none;
    max-width:160%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    padding:0; cursor:pointer;
  }
  .fp-item-label.placeholder{ color:var(--dim); font-style:italic; font-weight:500; }
  .fp-item-label:hover, .fp-item-label:focus{ white-space:normal; }
  .fp-rotate-handle{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:9px; height:9px; border-radius:50%; background:var(--warn);
    cursor:grab; display:none; z-index:2;
  }
  .fp-item.selected .fp-rotate-handle{ display:block; }
  .fp-rotate-handle::before{
    content:""; position:absolute; top:9px; left:50%; width:1px; height:9px;
    background:var(--warn); transform:translateX(-50%);
  }
  .fp-obj-node{
    position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; border-radius:50%;
    background:var(--accent); border:1.5px solid #0a1512; cursor:pointer; display:none; z-index:2;
  }
  .fp-item.selected .fp-obj-node{ display:block; }
  .fp-obj-node.nw{ left:0; top:0; } .fp-obj-node.ne{ left:100%; top:0; }
  .fp-obj-node.sw{ left:0; top:100%; } .fp-obj-node.se{ left:100%; top:100%; }
  .fp-obj-node.n{ left:50%; top:0; } .fp-obj-node.s{ left:50%; top:100%; }
  .fp-obj-node.e{ left:100%; top:50%; } .fp-obj-node.w{ left:0; top:50%; }

  .fp-hint{ margin:.6rem 0 0; font-size:.74rem; color:var(--dim); }
  .fp-edit-bar{ display:flex; gap:.5rem; margin-top:.8rem; }
  .fp-edit-bar input{
    flex:1; min-width:0; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:.5rem .7rem; font-size:.82rem;
  }
  .fp-edit-bar input:focus{ outline:none; border-color:var(--accent); }

  .fp-side{ display:flex; flex-direction:column; gap:.7rem; }
  .fp-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:.7rem .8rem;
  }
  .fp-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem; }
  .fp-panel-head h3{ margin:0; font-size:.82rem; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .fp-add-row{
    width:1.5rem; height:1.5rem; border-radius:50%; border:1px solid var(--border);
    background:var(--panel2); color:var(--accent); font-size:.9rem; line-height:1; cursor:pointer;
  }
  .fp-list{ display:flex; flex-direction:column; gap:.4rem; }
  .fp-row{
    display:flex; align-items:center; gap:.35rem; font-size:.74rem;
  }
  .fp-row input[type=text], .fp-row select, .fp-row input[type=number]{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:5px; padding:.25rem .35rem; font-size:.72rem; min-width:0;
  }
  .fp-row input[type=text].fp-row-grow{ flex:1; min-width:3rem; }
  .fp-row input[type=number]{ width:3.4rem; }
  .fp-row input[type=color]{ width:1.4rem; height:1.4rem; padding:0; border:none; background:none; flex:0 0 auto; }
  .fp-row-remove{
    flex:0 0 auto; width:1.3rem; height:1.3rem; border-radius:50%; border:none;
    background:var(--panel2); color:var(--danger); cursor:pointer; font-size:.7rem; line-height:1;
  }
  .fp-lib-cat{ border-top:1px solid var(--border); padding:.4rem 0 0; }
  .fp-lib-cat:first-child{ border-top:none; padding-top:0; }
  .fp-lib-cat summary{
    cursor:pointer; font-size:.76rem; font-weight:600; color:var(--text);
    padding:.3rem 0; list-style:none; display:flex; align-items:center; gap:.35rem;
  }
  .fp-lib-cat summary::-webkit-details-marker{ display:none; }
  .fp-lib-cat summary::before{ content:'\25B8'; color:var(--dim); font-size:.7rem; transition:transform .15s; }
  .fp-lib-cat[open] summary::before{ transform:rotate(90deg); }
  .fp-lib-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:.4rem; padding:.3rem 0 .5rem; }
  .fp-lib-item{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:.3rem .2rem .35rem; cursor:grab; display:flex; flex-direction:column;
    align-items:center; gap:.2rem;
  }
  .fp-lib-item:hover{ border-color:var(--accent); }
  .fp-lib-item:active{ cursor:grabbing; }
  .fp-lib-item svg{ width:100%; height:2.1rem; }
  .fp-lib-item span{
    font-size:.6rem; color:var(--dim); text-align:center; line-height:1.15;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .fp-lib-item img{ width:100%; height:2.1rem; object-fit:contain; }
  .fp-lib-item.fp-lib-add{
    background:transparent; border-style:dashed; cursor:pointer; justify-content:center;
  }
  .fp-lib-item.fp-lib-add:hover{ background:var(--panel2); }
  .fp-lib-item.fp-lib-add svg{ width:1.5rem; height:1.5rem; color:var(--dim); }
  .fp-lib-item.fp-lib-add:hover svg{ color:var(--accent); }

  /* ---------- Generate-from-photos modal ---------- */
  .fp-photo-drop{
    border:1.5px dashed var(--border); border-radius:10px; padding:1.2rem;
    text-align:center; color:var(--dim); font-size:.82rem; cursor:pointer;
  }
  .fp-photo-drop:hover, .fp-photo-drop.drag{ border-color:var(--accent); color:var(--text); }
  .fp-photo-thumbs{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
  .fp-photo-thumb{ position:relative; width:64px; height:64px; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
  .fp-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fp-photo-thumb button{
    position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:rgba(20,22,26,.85); color:#fff; border:none; font-size:.6rem; line-height:1; cursor:pointer;
  }
  #fpKnownDims{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:.5rem .6rem; font-size:.82rem; font-family:inherit; resize:vertical;
  }
  .fp-detail-input{
    background:var(--panel2); border:1px solid var(--border); color:#1a3a8f;
    border-radius:6px; padding:.4rem .55rem; font-size:.85rem; font-weight:600;
  }
  .fp-key-row{
    display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:.7rem;
    padding-top:.7rem; border-top:1px solid var(--border); font-size:.76rem; color:var(--dim);
  }
  .fp-key-row input[type=password]{
    flex:1; min-width:10rem; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:.35rem .5rem; font-size:.78rem;
  }

  /* ---------- Hints: hover (desktop) or long-press (touch) on any button shows
     its title as a small bubble, instead of a permanent on-screen instruction. */
  .hintBubble{
    position:fixed; z-index:60; background:var(--panel2); border:1px solid var(--border);
    color:var(--text); padding:.4rem .6rem; border-radius:8px; font-size:.76rem;
    line-height:1.35; max-width:260px; box-shadow:0 8px 20px rgba(0,0,0,.18);
    pointer-events:none;
  }

  .toast{
    position:fixed; bottom:1.1rem; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:.6rem 1rem; border-radius:10px; font-size:.82rem; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:90vw;
  }
  .toast.err{ border-color:var(--danger); color:#ffd7de; }

  .spinnerRow{ display:flex; align-items:center; gap:.5rem; color:var(--dim); font-size:.8rem; }
  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--border);
    border-top-color:var(--accent); animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #fpPrintContainer{ display:none; }
  @media print{
    body.fp-printing > *:not(#fpPrintContainer){ display:none !important; }
    body.fp-printing #fpPrintContainer{ display:block !important; }
    #fpPrintContainer svg{ width:100%; height:auto; }
  }

  /* ---------- Install pill: pill-shaped, top-right of the topbar. The About
     popup (this app's Settings-equivalent surface) keeps showing it as an
     inert status line after install instead of hiding it entirely. ---------- */
  .topbar-install-btn{
    background:rgba(64,208,181,.14); border:1px solid var(--accent); color:var(--accent);
    border-radius:999px; padding:.4rem .85rem; font-weight:700; font-size:.78rem;
    cursor:pointer; white-space:nowrap;
  }
  .topbar-install-btn.installed{
    background:var(--panel2); border-color:var(--border); color:var(--dim); cursor:default;
  }
  #infoBtn, .topbar-icon-btn{
    border-radius:999px; padding:.3rem; line-height:1;
    width:2.9rem; height:2.9rem; display:inline-flex; align-items:center; justify-content:center;
  }

  /* ---------- Centered popup modal (install/uninstall steps, About, the
     proactive install-prompt) -- not a position-anchored tooltip, since a
     tooltip pinned to the top-right pill's tap point would run off-screen. */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:1rem;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:1.15rem 1.25rem; max-width:420px; width:100%; max-height:82vh; overflow:auto;
    position:relative; box-shadow:0 16px 40px rgba(0,0,0,.5);
  }
  .modal h3{ margin:0 0 .7rem; font-size:1.02rem; }
  .modal .modal-close{
    position:absolute; top:.6rem; right:.65rem; background:none; border:none;
    color:var(--dim); font-size:1.05rem; cursor:pointer; padding:.2rem .4rem;
  }
  .modal .modal-close:hover{ color:var(--text); }
  .modal-body{ color:var(--text); font-size:.86rem; line-height:1.5; }
  .modal-body ol{ margin:.3rem 0 0; padding-left:1.1rem; }
  .about-row{ display:flex; justify-content:space-between; padding:.35rem 0; border-bottom:1px solid var(--border); font-size:.84rem; }
  .about-row:last-child{ border-bottom:none; }
  .about-row .k{ color:var(--dim); }
  .btn-primary{
    background:var(--accent); color:#0a1512; border:none; border-radius:9px;
    padding:.7rem 1rem; font-weight:700; font-size:.88rem; cursor:pointer; width:100%;
  }
  .btn-secondary{
    background:transparent; color:var(--text); border:1px solid var(--border); border-radius:9px;
    padding:.7rem 1rem; font-weight:600; font-size:.88rem; cursor:pointer; width:100%; margin-top:.5rem;
  }

  /* ---------- Pull-to-refresh indicator: fixed, top-center, off-screen
     above the viewport until dragged into view. ---------- */
  .pull-refresh{
    position:fixed; top:0; left:50%; transform:translate(-50%,-60px);
    width:38px; height:38px; border-radius:50%; background:var(--panel);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    z-index:70; box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .pull-refresh.hidden{ display:none; }
  .pull-refresh .arrow{ color:var(--accent); font-size:1.05rem; transition:transform .15s; }
  .pull-refresh.ready .arrow{ transform:rotate(180deg); }
  .pull-refresh.spinning .arrow{ display:none; }
  .pull-refresh.spinning::after{
    content:''; width:16px; height:16px; border-radius:50%; border:2px solid var(--border);
    border-top-color:var(--accent); animation:spin .7s linear infinite;
  }
</style>
</head>
<body>

<div class="pull-refresh hidden" id="pullRefresh"><span class="arrow">&#8595;</span></div>

<header>
  <div class="headerTop">
    <h1><img class="header-mark" src="./icon-512.png" alt=""><img class="header-wordmark" src="./ddg-logo.png" alt="DrawDesignGo"></h1>
    <div class="spacer"></div>
    <button class="topbar-install-btn" id="installBtn" style="display:none;" title="Install DrawDesignGo on this device">Install</button>
    <button class="btn topbar-icon-btn" id="printBtn" title="Print this floor plan">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
    <button class="btn topbar-icon-btn" id="infoBtn" title="Settings">

<script src="./vendor/pdfjs/pdf.min.js"></script>
<script>
(function(){
  'use strict';

  // ---------- DOM ----------
  const installBtn = document.getElementById('installBtn');
  const infoBtn = document.getElementById('infoBtn');
  const printBtn = document.getElementById('printBtn');
  printBtn.addEventListener('click', ()=> fpExportPdf());

  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';

  // ---------- Utility ----------
  function toast(msg, isErr){
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.remove(); }, isErr ? 4200 : 2600);
  }

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  // ---------- Hints: hover shows the native title tooltip on desktop; on touch,
  // where hover doesn't exist, a long-press shows the same text as a small bubble.
  // Every button carries its explanation in its title attribute instead of a
  // permanent on-screen instruction, and that's the single source for both.
  (function initLongPressHints(){
    let timer = null, bubble = null, moved = false;
    function show(target){
      const text = target.getAttribute('title');
      if(!text) return;
      hide();
      bubble = document.createElement('div');
      bubble.className = 'hintBubble';
      bubble.textContent = text;
      document.body.appendChild(bubble);
      const r = target.getBoundingClientRect();
      const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
      bubble.style.left = clamp(r.left, 8, window.innerWidth-bw-8) + 'px';
      bubble.style.top = Math.max(8, r.top - bh - 8) + 'px';
    }
    function hide(){ if(bubble){ bubble.remove(); bubble=null; } }
    document.addEventListener('touchstart', (e)=>{
      const target = e.target.closest('[title]');
      clearTimeout(timer);
      hide();
      if(!target) return;
      moved = false;
      timer = setTimeout(()=>{ if(!moved) show(target); }, 480);
    }, { passive:true });
    document.addEventListener('touchmove', ()=>{ moved = true; clearTimeout(timer); }, { passive:true });
    document.addEventListener('touchend', ()=>{ clearTimeout(timer); if(bubble) setTimeout(hide, 1600); }, { passive:true });
    document.addEventListener('touchcancel', ()=>{ clearTimeout(timer); hide(); }, { passive:true });
    // A long-press that revealed a hint shouldn't also fire the element's click / open a text-selection menu.
    document.addEventListener('contextmenu', (e)=>{ if(bubble) e.preventDefault(); });
  })();

  // ---------- PWA: version marker ----------
  // Kept in sync automatically by scripts/sync_pwa_version.py on every
  // commit (derived from a content hash of index.html/manifest.json/icons) --
  // never hand-bumped, so it always reflects what's actually deployed and can
  // be used to confirm a reload picked up the latest push.
  const APP_VERSION = '1.0+fd6796fe';

  // ---------- PWA: generic centered popup ----------
  // Reused for install/uninstall steps, the About panel (this single-screen
  // tool's stand-in for a Settings screen), and the proactive install
  // prompt -- a centered modal rather than a position-anchored tooltip, since
  // a tooltip pinned to the top-right pill's tap point would run off-screen.
  function openModal(title, bodyHtml){
    const wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal">' +
          '<button class="modal-close" aria-label="Close">&#10005;</button>' +
          '<h3>'+title+'</h3>' +
          '<div class="modal-body">'+bodyHtml+'</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    function close(){ wrap.remove(); }
    wrap.querySelector('.modal-close').addEventListener('click', close);
    wrap.querySelector('.modal-backdrop').addEventListener('click', (e)=>{ if(e.target===e.currentTarget) close(); });
    return wrap;
  }

  // In-app replacement for window.confirm() -- native blocking dialogs
  // (alert/confirm/prompt) are unreliable in an installed standalone-mode
  // PWA window on several platforms (silently no-op, auto-resolve, or render
  // oddly), so anything destructive routes through this instead.
  function fpConfirmModal(message, confirmLabel){
    return new Promise(resolve=>{
      const wrap = openModal('Are you sure?', `
        <p style="margin:0 0 1rem;">${fpEscapeHtml(message)}</p>
        <button class="btn-primary" id="fpConfirmYes">${fpEscapeHtml(confirmLabel||'Confirm')}</button>
        <button class="btn-secondary" id="fpConfirmNo">Cancel</button>
      `);
      let resolved = false;
      function finish(v){ if(resolved) return; resolved = true; resolve(v); }
      wrap.querySelector('#fpConfirmYes').addEventListener('click', ()=>{ finish(true); wrap.remove(); });
      wrap.querySelector('#fpConfirmNo').addEventListener('click', ()=>{ finish(false); wrap.remove(); });
      wrap.querySelector('.modal-close').addEventListener('click', ()=>finish(false));
      wrap.querySelector('.modal-backdrop').addEventListener('click', (e)=>{ if(e.target===e.currentTarget) finish(false); });
    });
  }

  // ---------- PWA: install pill ----------
  // True once actually running as the installed/home-screen app rather than
  // a regular browser tab -- display-mode covers Chrome/Edge/Android,
  // navigator.standalone is Safari's own (non-standard, iOS-only) equivalent.
  function isStandaloneApp(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  const INSTALL_FLAG_KEY = 'floorplannerInstallPromptAccepted';
  const INSTALL_ASKED_KEY = 'floorplannerInstallPromptAsked';
  function getInstallFlag(){ try{ return localStorage.getItem(INSTALL_FLAG_KEY)==='1'; }catch(e){ return false; } }
  function setInstallFlag(v){ try{ if(v) localStorage.setItem(INSTALL_FLAG_KEY,'1'); else localStorage.removeItem(INSTALL_FLAG_KEY); }catch(e){} }
  // Not just isStandaloneApp() alone -- a regular tab that just walked
  // through a manual/native install doesn't itself flip to
  // display-mode:standalone until the user actually relaunches from the real
  // Home Screen icon.
  function isInstalled(){
    return isStandaloneApp() || getInstallFlag();
  }

  const INSTALL_STEPS_HTML =
    '<strong>iPhone/iPad (Safari):</strong>' +
    '<ol><li>Tap the Share icon in the toolbar.</li>' +
      '<li>Scroll down and tap "Add to Home Screen".</li>' +
      '<li>Tap "Add".</li></ol><br>' +
    '<strong>Android (Chrome):</strong>' +
    '<ol><li>Tap the &#8942; menu.</li>' +
      '<li>Tap "Add to Home screen" or "Install app".</li>' +
      '<li>Tap "Install" (or "Add") to confirm.</li></ol><br>' +
    '<strong>Desktop Chrome/Edge:</strong>' +
    '<ol><li>Look for an install icon in the address bar (small monitor-with-arrow), or check the &#8942; menu for an item named "Install DrawDesignGo…", "Save and share → Install page as app…", or "Apps → Install this site as an app…" (exact wording varies by browser version).</li>' +
      '<li>Click "Install".</li>' +
      '<li>If you don\'t see any install option at all: make sure you\'re on the live https:// address (not a local file), then reload and wait a few seconds -- the browser only offers to install once it has decided the site qualifies, which can take a moment.</li></ol>';
  const UNINSTALL_STEPS_HTML =
    '<strong>iPhone/iPad:</strong>' +
    '<ol><li>Touch and hold the icon.</li>' +
      '<li>Tap "Remove App".</li>' +
      '<li>Tap "Delete App" to confirm.</li></ol><br>' +
    '<strong>Android:</strong>' +
    '<ol><li>Touch and hold the icon.</li>' +
      '<li>Tap "Uninstall".</li>' +
      '<li>Confirm.</li></ol><br>' +
    '<strong>Desktop Chrome/Edge:</strong>' +
    '<ol><li>Right-click the icon.</li>' +
      '<li>Click "Uninstall".</li>' +
      '<li>Confirm.</li></ol>';

  // Chrome/Edge/Android fire this instead of installing immediately, handing
  // over an event whose .prompt() shows the native install UI on demand --
  // captured up front and held until the pill is actually tapped.
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    // Chrome only fires this when it believes DrawDesignGo is NOT currently
    // installed for this origin -- the one reliable signal that a stuck-true
    // flag is stale (site storage survives an OS-level Home Screen uninstall,
    // which is what leaves the flag stuck true in the first place).
    if(getInstallFlag()){ setInstallFlag(false); }
    syncInstallUI();
  });
  window.addEventListener('appinstalled', ()=>{
    deferredInstallPrompt = null;
    setInstallFlag(true);
    syncInstallUI();
  });

  // Shared by the pill's tap and the proactive install-prompt popup's
  // "Install" button -- one native-vs-manual branch, not two.
  function triggerInstall(){
    if(deferredInstallPrompt){
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null; // one-shot -- the browser invalidates it after a single use either way
      promptEvent.prompt();
      promptEvent.userChoice.then((choice)=>{
        if(choice.outcome==='accepted'){ setInstallFlag(true); }
        syncInstallUI();
      });
    }else{
      openModal('Install on Home Screen', INSTALL_STEPS_HTML);
    }
  }

  function onInstallPillClick(){
    if(isInstalled()){ openModal('Uninstall', UNINSTALL_STEPS_HTML); }
    else{ triggerInstall(); }
  }
  installBtn.addEventListener('click', onInstallPillClick);

  // Shown top-right of the header, which is shared chrome across every
  // screen -- disappears entirely once installed (nothing left to act on),
  // except inside the About popup below, which keeps it visible as an inert
  // "Installed" status line since that's the one place to go confirm state.
  function syncInstallUI(){
    const installed = isInstalled();
    installBtn.style.display = installed ? 'none' : 'inline-block';
  }

  function aboutInstallRowHtml(){
    const installed = isInstalled();
    if(installed){
      return '<button class="topbar-install-btn installed" id="aboutInstallBtn" style="width:100%;margin-top:.6rem;">Installed</button>';
    }
    return '<button class="topbar-install-btn" id="aboutInstallBtn" style="width:100%;margin-top:.6rem;">Install</button>';
  }
  infoBtn.addEventListener('click', ()=>{
    const showResetLink = !isStandaloneApp() && getInstallFlag();
    const wrap = openModal('Settings',
      '<div class="about-row"><span class="k">Version</span><span>'+APP_VERSION+'</span></div>' +
      aboutInstallRowHtml() +
      (showResetLink ?
        '<div style="margin-top:.6rem;"><a href="#" id="resetInstallLink" style="color:var(--dim); font-size:.78rem;">Not on your Home Screen? Reset install status</a></div>'
        : '') +
      '<div style="margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--border);">' +
        '<div style="font-weight:600; margin-bottom:.5rem;">AI provider (used for Import Photo)</div>' +
        '<div id="fpSettingsProviderWrap"></div>' +
      '</div>' +
      '<div style="margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--border);">' +
        '<div style="font-weight:600; margin-bottom:.5rem;">Floor plan backup</div>' +
        '<button class="btn" id="fpBackupNowBtn" style="width:100%;">Back up now</button>' +
        '<button class="btn" id="fpRestoreBtn" style="width:100%; margin-top:.5rem;">Restore from backup&hellip;</button>' +
        '<input type="file" id="fpRestoreFileInput" accept="application/json,.json,.js,text/javascript,application/javascript" multiple style="display:none;">' +
      '</div>'
    );
    function renderSettingsProvider(){
      const provider = fpGetProvider();
      const container = wrap.querySelector('#fpSettingsProviderWrap');
      container.innerHTML = fpBuildProviderConfigHtml(provider);
      fpWireProviderConfig(container, provider, renderSettingsProvider);
    }
    renderSettingsProvider();
    wrap.querySelector('#aboutInstallBtn').addEventListener('click', ()=>{ wrap.remove(); onInstallPillClick(); });
    const resetLink = wrap.querySelector('#resetInstallLink');
    if(resetLink){
      resetLink.addEventListener('click', (e)=>{
        e.preventDefault();
        setInstallFlag(false);
        syncInstallUI();
        wrap.remove();
        toast('Install status reset.');
      });
    }
    // Manual backup (Step 6) / restore (Step 7) for the floor plan -- the one
    // piece of real user data this app persists (see the big PWA
    // backup/restore comment block near fpSave()/initFloorPlan()).
    wrap.querySelector('#fpBackupNowBtn').addEventListener('click', async ()=>{
      if(!fpBackupPayload()){ toast('Nothing to back up yet — edit your floor plan first.', true); return; }
      const wrote = await runFpBackupDownload();
      toast(wrote ? 'Backup saved.' : 'Already up to date — no changes since last backup.');
    });
    const restoreFileInput = wrap.querySelector('#fpRestoreFileInput');
    wrap.querySelector('#fpRestoreBtn').addEventListener('click', ()=>{ openFpBackupRestorePicker(restoreFileInput); });
    restoreFileInput.addEventListener('change', ()=>{ importLatestFpBackupFromFiles(restoreFileInput.files); });
  });

  // Proactive "Install DrawDesignGo?" prompt, shown once ever per device,
  // ~1.5s after load so beforeinstallprompt (which can arrive a moment after
  // load) has a real chance to populate deferredInstallPrompt first, giving
  // "Install" here the same shot at the fast native one-tap path as the pill.
  function maybeShowInstallPrompt(){
    if(isInstalled()) return;
    let asked = false;
    try{ asked = localStorage.getItem(INSTALL_ASKED_KEY)==='1'; }catch(e){}
    if(asked) return;
    setTimeout(()=>{
      if(isInstalled()) return; // could have installed (or been asked elsewhere) during the delay
      try{ localStorage.setItem(INSTALL_ASKED_KEY,'1'); }catch(e){}
      const wrap = openModal('Install DrawDesignGo?',
        '<div style="margin-bottom:.9rem;">Install to get project-saving features.</div>' +
        '<button class="btn-primary" id="installPromptYes">Install</button>' +
        '<button class="btn-secondary" id="installPromptNo">Not now</button>'
      );
      wrap.querySelector('#installPromptYes').addEventListener('click', ()=>{ wrap.remove(); triggerInstall(); });
      wrap.querySelector('#installPromptNo').addEventListener('click', ()=>{
        wrap.remove();
        toast('No problem — look for the Install button in the top right whenever you\'re ready.');
      });
    }, 1500);
  }

  // Best-effort ask not to auto-evict this origin's storage under low-disk
  // pressure. DrawDesignGo keeps no persisted photo/edit data (photos stay
  // in-tab and are exported explicitly via Save As/Copy), so this only
  // protects the handful of install/update bookkeeping keys in
  // localStorage -- low-stakes, but the call is free, so it's still made.
  function checkStoragePersistence(){
    if(!(navigator.storage && navigator.storage.persist)) return;
    (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false)).then((persisted)=>{
      if(persisted) return;
      navigator.storage.persist().then((granted)=>{
        if(!granted && navigator.storage.estimate){
          navigator.storage.estimate().then((est)=>{
            console.warn('[DrawDesignGo] storage persistence not granted; usage/quota estimate:', est);
          }).catch(()=>{});
        }
      }).catch(()=>{});
    }).catch(()=>{});
  }

  // ---------- PWA: update checking ----------
  // Two independent signals, run together -- see checkForUpdate(). Never
  // reloads while a field is focused; defers and retries on the next check
  // instead of yanking a URL/filename someone is mid-typing out from under
  // them.
  function isUserTyping(){
    const el = document.activeElement;
    if(!el) return false;
    if(el.tagName==='TEXTAREA') return true;
    if(el.tagName==='INPUT') return /^(text|search|number|url)$/i.test(el.type||'text');
    return false;
  }
  // Signal 1: index.html's own etag/last-modified, remembered across
  // sessions so the very first check of a new session can catch "what got
  // served just now is already behind what's on the server."
  const DEPLOYED_TAG_KEY = 'floorplannerDeployedTag';
  let deployedVersionTag = (()=>{ try{ return localStorage.getItem(DEPLOYED_TAG_KEY); }catch(e){ return null; } })();
  // Signal 2: forces the service worker's own byte-diff check right now
  // instead of waiting on the browser's lazy schedule (up to ~24h). Once a
  // genuinely new worker activates (it calls skipWaiting()/clients.claim()
  // itself -- see sw.js), 'controllerchange' fires and that's what actually
  // triggers the reload, not reg.update() itself (which only starts the check).
  let swReloadPending = false, swReloadTriggered = false;
  // Deletes index.html from every Cache Storage bucket this origin owns (not
  // just sw.js's current CACHE_NAME) so the reload below actually gets fresh
  // content instead of sw.js's stale-while-revalidate handler re-serving the
  // same cached shell it was trying to escape.
  function purgeCachedShell(){
    if(!('caches' in window)) return Promise.resolve();
    return caches.keys().then((names)=>Promise.all(names.map((n)=>caches.open(n).then((c)=>c.delete('./index.html'))))).catch(()=>{});
  }
  function reloadForNewServiceWorker(){
    if(swReloadTriggered) return; // controllerchange can fire more than once per page life
    if(isUserTyping()){ swReloadPending = true; return; } // retried from checkForUpdate's next call
    swReloadTriggered = true;
    purgeCachedShell().then(()=>{ location.reload(); });
  }
  if(navigator.serviceWorker){
    navigator.serviceWorker.addEventListener('controllerchange', reloadForNewServiceWorker);
  }
  // Returns a status string so callers wanting feedback (pull-to-refresh)
  // can react -- the load/visibilitychange callers just ignore it.
  function checkForUpdate(){
    if(swReloadPending && !isUserTyping()){ reloadForNewServiceWorker(); return Promise.resolve('reloading'); }
    const swCheck = (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
      ? navigator.serviceWorker.getRegistration().then((reg)=>{ if(reg) reg.update().catch(()=>{}); }).catch(()=>{})
      : Promise.resolve();
    return swCheck.then(()=>{
      return fetch(location.pathname+'?_='+Date.now(), { cache:'no-store', method:'HEAD' }).then((res)=>{
        const tag = res.headers.get('etag') || res.headers.get('last-modified');
        if(!tag) return 'unknown';
        if(deployedVersionTag===null){
          deployedVersionTag = tag;
          try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
          return 'up-to-date';
        }
        if(tag===deployedVersionTag) return 'up-to-date';
        if(isUserTyping()) return 'deferred';
        deployedVersionTag = tag;
        try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
        return purgeCachedShell().then(()=>{ location.reload(); return 'reloading'; });
      }).catch(()=>'offline'); // offline or blocked -- silently skip, next successful check catches up
    });
  }

  // ---------- PWA: pull-to-refresh ----------
  // Forces an update check on demand instead of waiting for backgrounding/
  // foregrounding. Only activates when the touch starts at the very top of
  // the page's own scroll AND not inside the stage canvas panning/drawing
  // surfaces (#stageScroll / #placeStageScroll each have their own touch
  // handling for select/brush/erase/drag gestures — pull-to-refresh would
  // otherwise fight those) and no modal is open.
  (function initPullToRefresh(){
    const indicator = document.getElementById('pullRefresh');
    if(!indicator) return;
    const THRESHOLD = 70;
    let startY = null, dragging = false, ready = false;
    document.addEventListener('touchstart', (e)=>{
      const insideStage = e.target.closest && e.target.closest('#stageScroll, #placeStageScroll');
      if(window.scrollY===0 && !insideStage && !document.querySelector('.modal-backdrop')){
        startY = e.touches[0].clientY;
        dragging = true; ready = false;
        indicator.classList.remove('hidden');
      }
    }, { passive:true });
    document.addEventListener('touchmove', (e)=>{
      if(!dragging || startY===null) return;
      const dy = e.touches[0].clientY - startY;
      if(dy>0 && window.scrollY===0){
        const dist = Math.min(dy, THRESHOLD*1.6);
        ready = dy > THRESHOLD;
        indicator.style.transform = 'translate(-50%, '+(dist-60)+'px)';
        indicator.classList.toggle('ready', ready);
      }
    }, { passive:true });
    document.addEventListener('touchend', ()=>{
      if(!dragging) return;
      dragging = false;
      if(!ready){
        indicator.classList.remove('ready');
        indicator.style.transform = '';
        indicator.classList.add('hidden');
        startY = null;
        return;
      }
      indicator.classList.remove('ready');
      indicator.classList.add('spinning');
      indicator.style.transform = 'translate(-50%, 10px)';
      checkForUpdate().then((status)=>{
        if(status !== 'reloading'){ // otherwise the page is already navigating away
          indicator.classList.remove('spinning');
          indicator.style.transform = '';
          indicator.classList.add('hidden');
        }
        startY = null;
      });
    }, { passive:true });
  })();

  // ---------- Floor Plan editor ----------
  // A blank grid canvas: Draw mode places structural elements (solid/dashed
  // lines, rectangles, squares, circles, ovals) snapped to grid nodes;
  // Select mode moves/reshapes/rotates/deletes whatever's on the plan.
  // Objects (furniture) are placeholder templates until a real library is
  // supplied, dragged/rotated the same way as before. No photo analysis
  // happens here -- see the "generate from photos" section below for that.
  const FP_SCALE = 22; // px per foot, before auto-fit/zoom are applied
  const FP_STORAGE_KEY = 'floorplanner-plan-v2';
  // The grid is NOT a fixed size -- it's recomputed on every render to
  // always cover the actual plan content (elements + objects), so a drawn
  // or imported structure is never bigger than its own working area. Never
  // shrinks below a minimum so a blank/small plan still has room to draw.
  const FP_GRID_MIN_W = 24, FP_GRID_MIN_H = 18; // feet -- floor, even on an empty plan
  const FP_GRID_PAD = 6; // feet of breathing room beyond the content's own bounding box
  const FP_GRID_STEP = 0.5; // feet -- snap resolution; every grid intersection is a "node"
  const SVG_NS = 'http://www.w3.org/2000/svg';
  let fpState = null;
  let fpSelectedId = null;
  let fpSelectedKind = null; // 'element' | 'object'
  let fpZoomMultiplier = 1; // manual zoom on top of auto-fit, reset by the Fit button
  let fpHistory = [];
  let fpIdSeq = 1;
  let fpMode = 'draw'; // 'select' | 'draw'
  let fpDrawTool = 'line'; // line | dashedline | rect | square | circle | oval | opening | window | door
  let fpDrawPending = null; // in-progress line placement: {x1,y1} in feet

  // Opening/window/door are drawn exactly like a wall (two clicked points,
  // see isLineTool below) but styled distinctly and never tied to a
  // specific wall element -- free-floating, like any other structural line.
  const FP_LINE_TYPE_STYLE = {
    opening: { stroke:'#1c2128', dash:'1,5' },              // black, dotted
    window:  { stroke:'#b8860b', dash:'9,6' },              // dark yellow/goldenrod, dashed
    door:    { stroke:'#7a4a24', dash:null, double:true },  // brown, solid double line
  };
  // Plain walls (line/dashedline) render thinner than opening/window/door --
  // a wall is the base layer everything else sits on top of, so it should
  // read as lighter-weight than the fixtures placed into it.
  const FP_WALL_STROKE_WIDTH = 2;
  const FP_OPENING_STROKE_WIDTH = 3;
  function fpIsLineType(type){ return type==='line' || type==='dashedline' || !!FP_LINE_TYPE_STYLE[type]; }

  // How close an opening/window/door has to sit to a wall's own infinite
  // line (perpendicular distance, in feet) to count as "on" that wall for
  // the hide-the-wall-underneath effect below -- generous enough to
  // tolerate each element being independently snapped to the 0.5ft grid,
  // tight enough not to falsely match a different, merely-parallel wall a
  // few feet away.
  const FP_COVER_TOL = 0.15;
  function fpLineDir(el){
    const dx = el.x2-el.x1, dy = el.y2-el.y1, len = Math.hypot(dx,dy);
    return len>1e-6 ? {dx:dx/len, dy:dy/len, len} : {dx:0, dy:0, len:0};
  }
  // Sub-ranges of `wall` (t in [0,1], t=0 at (x1,y1), t=1 at (x2,y2)) that
  // are NOT covered by any opening/window/door element sitting on top of
  // it -- lets a plain wall visually "disappear" wherever the user has laid
  // an opening over it (see the render loop and fpBuildExportSvg below).
  // Purely a render-time computation, never touches the wall's own
  // x1/y1/x2/y2, so moving or deleting the covering opening (which just
  // triggers the next render) makes the wall whole again automatically --
  // no separate "restore" step needed.
  function fpVisibleWallRanges(wall, allElements){
    const w = fpLineDir(wall);
    if(w.len < 1e-6) return [[0,1]];
    const covered = [];
    allElements.forEach(other=>{
      if(other===wall || !FP_LINE_TYPE_STYLE[other.type]) return; // opening/window/door only
      const o = fpLineDir(other);
      if(o.len < 1e-6) return;
      const cross = Math.abs(w.dx*o.dy - w.dy*o.dx);
      if(cross > 0.02) return; // not parallel to the wall -- can't be "on" it
      const perp1 = (other.x1-wall.x1)*(-w.dy) + (other.y1-wall.y1)*w.dx;
      const perp2 = (other.x2-wall.x1)*(-w.dy) + (other.y2-wall.y1)*w.dx;
      if(Math.abs(perp1) > FP_COVER_TOL || Math.abs(perp2) > FP_COVER_TOL) return; // not on the wall's line
      const t1 = ((other.x1-wall.x1)*w.dx + (other.y1-wall.y1)*w.dy)/w.len;
      const t2 = ((other.x2-wall.x1)*w.dx + (other.y2-wall.y1)*w.dy)/w.len;
      const lo = Math.max(0, Math.min(t1,t2)), hi = Math.min(1, Math.max(t1,t2));
      if(hi > lo) covered.push([lo,hi]);
    });
    if(!covered.length) return [[0,1]];
    covered.sort((a,b)=>a[0]-b[0]);
    const merged = [covered[0].slice()];
    for(let i=1;i<covered.length;i++){
      const last = merged[merged.length-1];
      if(covered[i][0] <= last[1]) last[1] = Math.max(last[1], covered[i][1]);
      else merged.push(covered[i].slice());
    }
    const visible = [];
    let cursor = 0;
    merged.forEach(([lo,hi])=>{
      if(lo > cursor) visible.push([cursor, lo]);
      cursor = Math.max(cursor, hi);
    });
    if(cursor < 1 - 1e-9) visible.push([cursor, 1]);
    return visible;
  }

  const FP_IMAGE_LIB_KEY = 'floorplanner-image-library';
  const FP_IMAGE_DEFAULT_EDGE_IN = 16.8; // in -- longer side of a freshly-uploaded image (30% smaller than the original 24in default); resizable afterward like any object. The seeded SBI logo below is sized independently, deliberately larger.
  const FP_IMAGE_MAX_EDGE_PX = 900; // downscale uploads so a phone photo doesn't balloon storage for what's ultimately a small icon
  const FP_SBI_LOGO_SEED = { id:'seed-sbi-logo', label:'Simply Beautiful Interiors', img:'./SBI_Logo_transparent.png', w:36, d:7.05 };
  function fpGetImageLibrary(){
    let list;
    try{
      const raw = localStorage.getItem(FP_IMAGE_LIB_KEY);
      if(raw) list = JSON.parse(raw);
    }catch(e){}
    if(!list){
      list = [Object.assign({}, FP_SBI_LOGO_SEED)];
      fpSaveImageLibrary(list);

    // up the transparent artwork + the ~50% larger default placement size

    const sbi = list.find(x=>x.id==='seed-sbi-logo');
    if(sbi && sbi.img!==FP_SBI_LOGO_SEED.img){
      Object.assign(sbi, FP_SBI_LOGO_SEED);
      fpSaveImageLibrary(list);
    }
    return list;
  }
  function fpSaveImageLibrary(list){ try{ localStorage.setItem(FP_IMAGE_LIB_KEY, JSON.stringify(list)); }catch(e){} }

  function fpReadImageFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('Could not read that file.'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error('Could not read that image.'));
        img.onload = ()=>{
          const scale = Math.min(1, FP_IMAGE_MAX_EDGE_PX/Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth*scale)), h = Math.max(1, Math.round(img.naturalHeight*scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/png'), aspect: img.naturalWidth/img.naturalHeight });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function fpAddImageToLibrary(file){
    let result;
    try{ result = await fpReadImageFile(file); }
    catch(err){ toast(err.message || 'Could not read that image.', true); return; }
    const edge = FP_IMAGE_DEFAULT_EDGE_IN;
    const w = result.aspect>=1 ? edge : edge*result.aspect;
    const d = result.aspect>=1 ? edge/result.aspect : edge;
    const label = file.name.replace(/\.[^.]+$/, '') || 'Image';
    const list = fpGetImageLibrary();
    list.push({ id:'img-'+(fpIdSeq++), label, img:result.dataUrl, w:Math.round(w*10)/10, d:Math.round(d*10)/10 });
    fpSaveImageLibrary(list);
    fpRefreshImageLibraryGrid();
  }

  function fpRefreshImageLibraryGrid(){
    const grid = document.getElementById('fpImageUploadGrid');
    if(!grid) return;
    grid.innerHTML = '';

    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'fp-lib-item fp-lib-add';
    addBtn.title = 'Add your own image';
    addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Image</span>';
    addBtn.addEventListener('click', ()=> document.getElementById('fpImageUploadInput').click());
    grid.appendChild(addBtn);

    fpGetImageLibrary().forEach(entry=>{
      const tpl = { label:entry.label, shape:'rect', icon:'image', img:entry.img, w:entry.w, d:entry.d };
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'fp-lib-item'; btn.draggable = true;
      btn.title = `${entry.label} — drag onto the grid, or tap to add at center`;
      btn.innerHTML = `<img src="${entry.img}" alt=""><span>${fpEscapeHtml(entry.label)}</span>`;
      btn.addEventListener('click', ()=> fpAddObjectFromTemplate(tpl));
      btn.addEventListener('dragstart', (e)=>{
        e.dataTransfer.setData('application/json', JSON.stringify(tpl));
        e.dataTransfer.effectAllowed = 'copy';
      });
      grid.appendChild(btn);
    });
  }

  // A name/measurement label the user can drag to reposition (stored as a
  // feet offset from the entity's own center, in its local -- i.e.
  // pre-rotation -- frame, so it stays anchored to the entity wherever that
  // entity itself moves or rotates) while a plain tap/click still opens its
  // details modal. Shared by furniture objects and structural lines alike.
  function fpWireDraggableLabel(label, item, centerPx, rotDeg, scale, defaultDx, defaultDy, onClick){
    function reposition(){
      const dx = item.labelDx!=null ? item.labelDx : defaultDx;
      const dy = item.labelDy!=null ? item.labelDy : defaultDy;
      Object.assign(label.style, {
        left:(centerPx.x + dx*scale)+'px', top:(centerPx.y + dy*scale)+'px',
        right:'auto', bottom:'auto', marginBottom:'0', transform:'translate(-50%,-100%)',
      });
    }
    reposition();
    let dragged = false;
    label.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      fpPushHistory();
      dragged = false;
      const startX=e.clientX, startY=e.clientY;
      const startDx = item.labelDx!=null ? item.labelDx : defaultDx;
      const startDy = item.labelDy!=null ? item.labelDy : defaultDy;
      const rad = (rotDeg||0)*Math.PI/180, cr=Math.cos(-rad), sr=Math.sin(-rad);
      try{ label.setPointerCapture(e.pointerId); }catch(err){}
      function move(ev){
        const dxScreen=ev.clientX-startX, dyScreen=ev.clientY-startY;
        if(Math.hypot(dxScreen,dyScreen)>3) dragged = true;
        const ldx = dxScreen*cr - dyScreen*sr, ldy = dxScreen*sr + dyScreen*cr;
        item.labelDx = startDx + ldx/scale;
        item.labelDy = startDy + ldy/scale;
        reposition();
      }
      function up(){
        label.removeEventListener('pointermove', move);
        label.removeEventListener('pointerup', up);
        if(dragged){ fpSave(); fpRender(); }
        else{ fpHistory.pop(); document.getElementById('fpUndoBtn').disabled = fpHistory.length===0; }
      }
      label.addEventListener('pointermove', move);
      label.addEventListener('pointerup', up);
    });
    label.addEventListener('click', (e)=>{ e.stopPropagation(); if(!dragged) onClick(); });
  }

  // Asks OpenAI (text-only, via the same CORS proxy the photo-generation
  // path uses) for a typical real-world width x depth given just an item's
  // name -- no photo involved, this is a plain text completion. Always
  // OpenAI specifically (not whichever provider is set for photo import),
  // per how this was asked for.
  async function fpDetectObjectDimensions(name){
    const proxyUrl = fpGetOpenAiProxyUrl();
    if(!proxyUrl) throw new Error('Set your OpenAI proxy Worker URL first (see cloudflare-worker/README.md).');
    if(!fpGetOpenAiKey()) throw new Error('Set your OpenAI API key first (open "Import Photo" to add one).');
    const prompt = `You are estimating typical real-world dimensions for a piece of furniture or fixture based on its name. Item: "${name}". Respond with ONLY a JSON object, no markdown fences, no commentary: {"w": number, "d": number} -- width and depth in INCHES, typical for this item as sold/used in a home. If the name is vague, pick a reasonable common size.`;
    const resp = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'content-type':'application/json', 'authorization':'Bearer ' + fpGetOpenAiKey() },
      body: JSON.stringify({
        model: 'gpt-6-astra',
        max_completion_tokens: 200,
        response_format: { type:'json_object' },
        messages: [{ role:'user', content: prompt }],
      }),
    });
    if(!resp.ok){
      const errBody = await resp.text().catch(()=>'');
      throw new Error('API error ' + resp.status + (errBody ? ': ' + errBody.slice(0,200) : ''));
    }
    const data = await resp.json();
    const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const result = fpExtractJson(text);
    return { w: Math.max(1, Number(result.w)||24), d: Math.max(1, Number(result.d)||24) };
  }

  // ---------- Every physical-measurement field in the app (furniture size,
  // wall/opening length) is entered as a whole feet + inches pair -- e.g.
  // "0 ft, 9 in" -- rather than one decimal-feet or decimal-inches number.
  function fpFtInFieldsHtml(prefix, totalInches){
    const ft = Math.floor(Math.max(0,totalInches)/12);
    const inch = Math.round(Math.max(0,totalInches) - ft*12);
    return `<div style="display:flex; gap:.4rem; align-items:center;">
      <input type="number" id="${prefix}Ft" class="fp-detail-input" style="width:100%;" min="0" value="${ft}">
      <span class="mini">ft</span>
      <input type="number" id="${prefix}In" class="fp-detail-input" style="width:100%;" min="0" max="11" value="${inch}">
      <span class="mini">in</span>
    </div>`;
  }
  function fpSetFtInFields(wrap, prefix, totalInches){
    const ft = Math.floor(Math.max(0,totalInches)/12);
    const inch = Math.round(Math.max(0,totalInches) - ft*12);
    wrap.querySelector('#'+prefix+'Ft').value = ft;
    wrap.querySelector('#'+prefix+'In').value = inch;
  }
  function fpReadFtInFields(wrap, prefix, fallbackInches){
    const ft = parseFloat(wrap.querySelector('#'+prefix+'Ft').value);
    const inch = parseFloat(wrap.querySelector('#'+prefix+'In').value);
    const total = (isNaN(ft)?0:ft)*12 + (isNaN(inch)?0:inch);
    return total>0 ? total : fallbackInches;
  }

  function fpOpenObjectDetailsModal(item){
    const wrap = openModal('Object Details', `
      <label class="mini" style="display:block; margin-bottom:.6rem;">Name
        <input type="text" id="fpObjNameInput" class="fp-detail-input" style="width:100%; margin-top:.25rem;" value="${fpEscapeHtml(item.label||'')}">
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Width
        ${fpFtInFieldsHtml('fpObjWidth', item.w)}
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Depth
        ${fpFtInFieldsHtml('fpObjDepth', item.d)}
      </label>
      <button class="btn" id="fpObjAutoDetectBtn" type="button" style="width:100%; margin-bottom:.6rem; border-color:var(--accent); color:var(--accent);">&#10024; Auto-detect dimensions</button>
      <p class="fp-hint" id="fpObjDetectStatus" style="margin:0 0 .6rem;"></p>
      <button class="btn-primary" id="fpObjSaveBtn" type="button">Save</button>
    `);
    const nameInput = wrap.querySelector('#fpObjNameInput');
    const status = wrap.querySelector('#fpObjDetectStatus');
    nameInput.focus();
    wrap.querySelector('#fpObjAutoDetectBtn').addEventListener('click', async ()=>{
      const name = nameInput.value.trim();
      if(!name){ status.textContent = 'Enter a name first.'; return; }
      status.textContent = 'Detecting…';
      try{
        const dims = await fpDetectObjectDimensions(name);
        fpSetFtInFields(wrap, 'fpObjWidth', dims.w);
        fpSetFtInFields(wrap, 'fpObjDepth', dims.d);
        status.textContent = 'Done -- adjust if needed.';
      }catch(err){
        status.textContent = 'Failed: ' + (err && err.message ? err.message : 'unknown error');
      }
    });
    function save(){
      fpPushHistory();
      item.label = nameInput.value.trim();
      item.w = Math.max(1, fpReadFtInFields(wrap, 'fpObjWidth', item.w));
      item.d = Math.max(1, fpReadFtInFields(wrap, 'fpObjDepth', item.d));
      fpSave(); fpRender();
      wrap.remove();
    }
    wrap.querySelector('#fpObjSaveBtn').addEventListener('click', save);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  }

  // Any structural line -- wall, dashed wall, or a drawn opening/window/door
  // -- gets the same Name + Length treatment furniture objects get. Length
  // is the only "measurement" a line has; changing it keeps the start point
  // and current angle fixed and moves the end point to match.
  function fpOpenLineDetailsModal(el){
    const lenFt = Math.hypot(el.x2-el.x1, el.y2-el.y1);
    const wrap = openModal('Line Details', `
      <label class="mini" style="display:block; margin-bottom:.6rem;">Name
        <input type="text" id="fpLineNameInput" class="fp-detail-input" style="width:100%; margin-top:.25rem;" value="${fpEscapeHtml(el.label||'')}">
      </label>
      <label class="mini" style="display:block; margin-bottom:.6rem;">Length
        ${fpFtInFieldsHtml('fpLineLen', lenFt*12)}
      </label>
      <div style="display:flex; gap:.5rem;">
        <button class="btn" id="fpLineDeleteBtn" type="button" style="flex:1; border-color:var(--danger); color:var(--danger);">Delete</button>
        <button class="btn-primary" id="fpLineSaveBtn" type="button" style="flex:1;">Save</button>
      </div>
    `);
    const nameInput = wrap.querySelector('#fpLineNameInput');
    nameInput.focus();
    wrap.querySelector('#fpLineDeleteBtn').addEventListener('click', ()=>{
      fpPushHistory();
      fpState.elements = fpState.elements.filter(e=>e.id!==el.id);
      fpDeselect();
      fpSave(); fpRender();
      wrap.remove();
    });
    function save(){
      fpPushHistory();
      el.label = nameInput.value.trim();
      const newLenFt = Math.max(0.5, fpReadFtInFields(wrap, 'fpLineLen', lenFt*12)/12);
      const curLen = Math.hypot(el.x2-el.x1, el.y2-el.y1) || 1;
      const ux = (el.x2-el.x1)/curLen, uy = (el.y2-el.y1)/curLen;
      el.x2 = el.x1 + ux*newLenFt; el.y2 = el.y1 + uy*newLenFt;
      fpSave(); fpRender();
      wrap.remove();
    }
    wrap.querySelector('#fpLineSaveBtn').addEventListener('click', save);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  }

  function fpDefaultState(){
    return {
      title: 'Untitled Floor Plan',
      elements: [],
      objects: [],
      notes: [],
    };
  }

  function fpLoad(){
    try{
      const raw = localStorage.getItem(FP_STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        fpIdSeq = parsed.__idSeq || 1000;
        delete parsed.__idSeq;
        return parsed;
      }
    }catch(e){}
    return fpDefaultState();
  }
  function fpSave(){
    try{
      const toSave = Object.assign({}, fpState, { __idSeq: fpIdSeq });
      localStorage.setItem(FP_STORAGE_KEY, JSON.stringify(toSave));
    }catch(e){}
    scheduleFpExitBackup(); // debounced silent safety-net snapshot -- see the PWA backup/restore section below
    scheduleFpProjectSave(); // keeps the active entry in Recent Projects in sync -- see below
  }
  function fpPushHistory(){
    fpHistory.push(JSON.stringify(fpState));
    if(fpHistory.length>30) fpHistory.shift();
    document.getElementById('fpUndoBtn').disabled = false;
  }
  function fpUndo(){
    if(!fpHistory.length) return;
    fpState = JSON.parse(fpHistory.pop());
    document.getElementById('fpUndoBtn').disabled = fpHistory.length===0;
    fpDeselect();
    fpSave();
    fpRender();
  }

  function fpSnap(v){ return Math.round(v/FP_GRID_STEP)*FP_GRID_STEP; }

  // Grid always starts at (0,0) and grows only in +X/+Y to cover whatever's
  // actually on the plan -- see fpElementBounds/fpObjectBoundsFeet below
  // (shared with the export code, which needs the same bounding-box math).
  function fpComputeGridSize(){
    let maxX=0, maxY=0;
    fpState.elements.forEach(el=>{ const b=fpElementBounds(el); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); });
    fpState.objects.forEach(o=>{ const b=fpObjectBoundsFeet(o); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); });
    return {
      w: Math.max(FP_GRID_MIN_W, Math.ceil(maxX + FP_GRID_PAD)),
      h: Math.max(FP_GRID_MIN_H, Math.ceil(maxY + FP_GRID_PAD)),
    };
  }
  // Shifts everything back onto the grid if anything ended up with a
  // negative coordinate (an AI import that didn't quite anchor its origin
  // at (0,0), most likely) -- the grid always starts at (0,0), so negative
  // content would render into the canvas-wrap's padding, off the visible
  // grid entirely, instead of being covered by fpComputeGridSize() above.
  function fpNormalizeOrigin(){
    let minX=Infinity, minY=Infinity;
    const consider = (x,y)=>{ minX=Math.min(minX,x); minY=Math.min(minY,y); };
    fpState.elements.forEach(el=>{ const b=fpElementBounds(el); consider(b.minX,b.minY); });
    fpState.objects.forEach(o=>{ const b=fpObjectBoundsFeet(o); consider(b.minX,b.minY); });
    if(minX===Infinity || (minX>=0 && minY>=0)) return;
    const pad = 2;
    const dx = minX<0 ? (pad-minX) : 0, dy = minY<0 ? (pad-minY) : 0;
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){ el.x1+=dx; el.y1+=dy; el.x2+=dx; el.y2+=dy; }
      else { el.cx+=dx; el.cy+=dy; }
    });
    fpState.objects.forEach(o=>{ o.cx+=dx; o.cy+=dy; });
  }

  function fpDeselect(){ fpSelectedId = null; fpSelectedKind = null; fpSelectAllActive = false; }

  // Lightweight selection: toggles the CSS class on existing DOM nodes and
  // drops any stale node-handle layer, instead of a full fpRender() -- so
  // it's safe to call right before a drag starts without yanking the
  // element being dragged out of the document. Resize/rotate node handles
  // for a newly selected element reappear on the next full fpRender() (on
  // drag release), which is an acceptable one-step lag in exchange for
  // never rebuilding out from under a live drag.
  function fpSelect(kind, id){
    fpSelectedKind = kind; fpSelectedId = id; fpSelectAllActive = false;
    document.querySelectorAll('#fpCanvas .fp-item').forEach(node=>{
      node.classList.toggle('selected', kind==='object' && Number(node.dataset.id)===id);
    });
    document.querySelectorAll('#fpCanvas .fp-el').forEach(node=>{
      node.classList.toggle('selected', kind==='element' && Number(node.dataset.id)===id);
    });
    const nodesLayer = document.querySelector('#fpCanvas .fp-nodes-layer');
    if(nodesLayer) nodesLayer.remove();
  }

  // Delete tool: a toggled mode (like Draw), not a one-shot action -- once
  // on, tapping any wall/shape/object deletes it immediately and the mode
  // stays on so several items can be removed in a row; tapping the Delete
  // button again (or switching to Select/Draw) turns it back off.
  let fpDeleteModeActive = false;
  // Single source of truth for which toolbar control(s) show the green
  // "in use" border -- called after anything that can change fpMode,
  // fpDrawTool, or fpDeleteModeActive, so exactly one story is ever true at
  // once: Delete active means only Delete is highlighted (everything else
  // below is suppressed regardless of what Draw/Select tool was active
  // underneath); otherwise Select alone is highlighted in Select mode, and
  // in Draw mode both the Draw button AND whichever specific placement tool
  // is armed (the plain line/shape <select> or the Opening/Window/Door
  // dropdown, never both) are highlighted together.
  function fpSyncToolActiveUI(){
    const drawActive = fpMode==='draw' && !fpDeleteModeActive;
    const selectActive = fpMode==='select' && !fpDeleteModeActive;
    const isOpeningTool = fpDrawTool==='opening' || fpDrawTool==='window' || fpDrawTool==='door';
    const drawBtn = document.getElementById('fpModeDrawBtn');
    const selectBtn = document.getElementById('fpModeSelectBtn');
    const toolSelect = document.getElementById('fpDrawToolSelect');
    const openingBtn = document.getElementById('fpOpeningDdBtn');
    if(drawBtn) drawBtn.classList.toggle('active', drawActive);
    if(selectBtn) selectBtn.classList.toggle('active', selectActive);
    if(toolSelect) toolSelect.classList.toggle('fp-tool-select-active', drawActive && !isOpeningTool);
    if(openingBtn) openingBtn.classList.toggle('fp-opening-dd-btn-active', drawActive && isOpeningTool);
  }
  function fpSetDeleteMode(active){
    fpDeleteModeActive = active;
    const btn = document.getElementById('fpDeleteBtn');
    if(btn) btn.classList.toggle('active', active);
    const canvas = document.getElementById('fpCanvas');
    if(canvas) canvas.classList.toggle('fp-delete-mode', active);
    if(active) fpDeselect();
    fpSyncToolActiveUI();
  }
  function fpDeleteItem(kind, id){
    fpPushHistory();
    if(kind==='element'){
      fpState.elements = fpState.elements.filter(el=>el.id!==id);
    } else if(kind==='object'){
      fpState.objects = fpState.objects.filter(o=>o.id!==id);
    }
    if(fpSelectedId===id) fpDeselect();
    fpSave(); fpRender();
  }
  function fpDeleteSelected(){
    if(fpSelectedId==null) return;
    fpDeleteItem(fpSelectedKind, fpSelectedId);
  }

  // ---------- Export: shared bounds/SVG snapshot, used by PNG/JPG/PDF/DXF/copy ----------
  function fpObjectBoundsFeet(item){
    const hw = (item.w/12)/2, hd = (item.d/12)/2;
    return { minX:item.cx-hw, minY:item.cy-hd, maxX:item.cx+hw, maxY:item.cy+hd };
  }
  function fpElementBounds(el){
    if(fpIsLineType(el.type)){
      return { minX:Math.min(el.x1,el.x2), minY:Math.min(el.y1,el.y2), maxX:Math.max(el.x1,el.x2), maxY:Math.max(el.y1,el.y2) };
    }
    if(el.type==='circle'){
      return { minX:el.cx-el.r, minY:el.cy-el.r, maxX:el.cx+el.r, maxY:el.cy+el.r };
    }
    // rect/square/oval -- ignore rotation for a simple, slightly-generous bbox
    const half = Math.max(el.w,el.h)/2;
    return { minX:el.cx-half, minY:el.cy-half, maxX:el.cx+half, maxY:el.cy+half };
  }
  function fpComputePlanBounds(){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    const consider = b=>{ minX=Math.min(minX,b.minX); minY=Math.min(minY,b.minY); maxX=Math.max(maxX,b.maxX); maxY=Math.max(maxY,b.maxY); };
    fpState.elements.forEach(el=>consider(fpElementBounds(el)));
    fpState.objects.forEach(o=>consider(fpObjectBoundsFeet(o)));
    if(minX===Infinity) return { minX:0, minY:0, maxX:10, maxY:10 }; // empty plan fallback
    const pad = 2; // feet
    return { minX:minX-pad, minY:minY-pad, maxX:maxX+pad, maxY:maxY+pad };
  }
  function fpSelectionBounds(){
    if(fpSelectedId==null) return null;
    if(fpSelectedKind==='element'){
      const el = fpState.elements.find(e=>e.id===fpSelectedId);
      return el ? fpElementBounds(el) : null;
    }
    const o = fpState.objects.find(x=>x.id===fpSelectedId);
    return o ? fpObjectBoundsFeet(o) : null;
  }

  // Builds a standalone, self-contained SVG string of the plan (or a region
  // of it) at a fixed export scale -- independent of the on-screen zoom --
  // for rasterizing to PNG/JPG, printing to PDF, or copying to the clipboard.
  const FP_EXPORT_SCALE = 40; // px per foot
  function fpBuildExportSvg(bounds){
    const scale = FP_EXPORT_SCALE;
    const w = Math.max(1, Math.round((bounds.maxX-bounds.minX)*scale));
    const h = Math.max(1, Math.round((bounds.maxY-bounds.minY)*scale));
    const px = (x,y) => [ (x-bounds.minX)*scale, (y-bounds.minY)*scale ];
    let body = '';
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){
        const lineStyle = FP_LINE_TYPE_STYLE[el.type];
        const stroke = lineStyle ? lineStyle.stroke : '#2a2f36';
        const dash = lineStyle ? lineStyle.dash : (el.type==='dashedline' ? '10,7' : null);
        const strokeWidth = lineStyle ? FP_OPENING_STROKE_WIDTH : FP_WALL_STROKE_WIDTH;
        // Plain walls skip whatever range an opening/window/door on top of
        // them covers, same as the live canvas (see fpVisibleWallRanges()) --
        // exported art shouldn't show a solid wall poking through a door.
        const ranges = lineStyle ? [[0,1]] : fpVisibleWallRanges(el, fpState.elements);
        ranges.forEach(([lo,hi])=>{
          const [x1,y1] = px(el.x1+(el.x2-el.x1)*lo, el.y1+(el.y2-el.y1)*lo);
          const [x2,y2] = px(el.x1+(el.x2-el.x1)*hi, el.y1+(el.y2-el.y1)*hi);
          body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;
        });
        if(lineStyle && lineStyle.double){
          const dxr = el.x2-el.x1, dyr = el.y2-el.y1, len = Math.hypot(dxr,dyr)||1;
          const off = 2.5/scale;
          const [ox1,oy1] = px(el.x1-dyr/len*off, el.y1+dxr/len*off);
          const [ox2,oy2] = px(el.x2-dyr/len*off, el.y2+dxr/len*off);
          body += `<line x1="${ox1}" y1="${oy1}" x2="${ox2}" y2="${oy2}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linecap="round"/>`;
        }
      } else if(el.type==='circle'){
        const [cx,cy] = px(el.cx,el.cy);
        body += `<circle cx="${cx}" cy="${cy}" r="${el.r*scale}" stroke="#2a2f36" stroke-width="2" fill="none"/>`;
      } else if(el.type==='oval'){
        const [cx,cy] = px(el.cx,el.cy);
        body += `<ellipse cx="${cx}" cy="${cy}" rx="${el.w/2*scale}" ry="${el.h/2*scale}" stroke="#2a2f36" stroke-width="2" fill="none" transform="rotate(${el.rot||0} ${cx} ${cy})"/>`;
      } else {
        const [x,y] = px(el.cx-el.w/2, el.cy-el.h/2);
        const [cx,cy] = px(el.cx,el.cy);
        body += `<rect x="${x}" y="${y}" width="${el.w*scale}" height="${el.h*scale}" stroke="#2a2f36" stroke-width="2" fill="none" transform="rotate(${el.rot||0} ${cx} ${cy})"/>`;
      }
    });
    fpState.objects.forEach(item=>{
      const pw = (item.w/12)*scale, pd = (item.d/12)*scale;
      const [x,y] = px(item.cx-item.w/24, item.cy-item.d/24);
      const [cx,cy] = px(item.cx,item.cy);
      body += `<g transform="rotate(${item.rot||0} ${cx} ${cy})"><svg x="${x}" y="${y}" width="${pw}" height="${pd}" viewBox="0 0 ${item.w} ${item.d}" preserveAspectRatio="none">${fpIconMarkup(item)}</svg></g>`;
      if(item.label && item.label.trim()){
        body += `<text x="${cx}" y="${y+pd+13}" text-anchor="middle" font-size="11" fill="#2a2f36" font-family="sans-serif">${fpEscapeHtml(item.label)}</text>`;
      }
    });
    return `<svg xmlns="${SVG_NS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="0" y="0" width="${w}" height="${h}" fill="#ffffff"/>${body}</svg>`;
  }
  function fpRasterizeSvg(svgString, w, h){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas);
      };
      img.onerror = reject;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
    });
  }
  function fpSafeFileName(title){
    return (title||'floor-plan').trim().replace(/[\\/:*?"<>|]+/g,'-').slice(0,60) || 'floor-plan';
  }
  // Always shows a fresh save-location picker (unlike the auto-backup path,
  // which silently reuses a remembered handle) -- this is "Save As", so a new
  // destination each time is the point.
  async function fpSaveBlobWithPicker(blob, suggestedName, description, acceptMap){
    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({ suggestedName, types:[{ description, accept:acceptMap }] });
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        return true;
      }catch(e){ if(e && e.name==='AbortError') return false; /* else fall through to plain download */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = suggestedName;
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  }

  async function fpExportRaster(format){ // 'png' | 'jpeg'
    const bounds = fpComputePlanBounds();
    const svg = fpBuildExportSvg(bounds);
    const w = Math.round((bounds.maxX-bounds.minX)*FP_EXPORT_SCALE), h = Math.round((bounds.maxY-bounds.minY)*FP_EXPORT_SCALE);
    const canvas = await fpRasterizeSvg(svg, w, h);
    const mime = format==='jpeg' ? 'image/jpeg' : 'image/png';
    const blob = await new Promise(res=>canvas.toBlob(res, mime, 0.95));
    if(!blob){ toast('Could not create the image.', true); return; }
    const ext = format==='jpeg' ? 'jpg' : 'png';
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.${ext}`, format==='jpeg'?'JPEG image':'PNG image', {[mime]:['.'+ext]});
  }

  async function fpExportPdf(){
    const bounds = fpComputePlanBounds();
    const svg = fpBuildExportSvg(bounds);
    const container = document.getElementById('fpPrintContainer');
    container.innerHTML = svg;
    document.body.classList.add('fp-printing');
    window.print();
    // No reliable "print dialog closed" event across browsers -- clear the
    // print-only content shortly after, well past when the dialog opens.
    setTimeout(()=>{ document.body.classList.remove('fp-printing'); container.innerHTML=''; }, 1000);
  }

  async function fpExportProjectFile(){
    const json = fpBackupPayload();
    if(!json){ toast('Nothing to export yet.', true); return; }
    const blob = new Blob([json], {type:'application/json'});
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.json`, 'DrawDesignGo project file', {'application/json':['.json']});
  }

  // ---- DXF export -----------------------------------------------------
  // True binary DWG is a large, proprietary Autodesk format -- infeasible to
  // write correctly from scratch. DXF is the open, text-based CAD exchange
  // format AutoCAD (and virtually everything else) reads natively, so it
  // actually satisfies "import into other CAD programs" without pretending
  // to be a real DWG file. Coordinates are in feet; Y is flipped since DXF's
  // convention is Y-up while this app's plan uses screen-style Y-down.
  function fpDxfLine(x1,y1,x2,y2){ return `0\nLINE\n8\n0\n10\n${x1}\n20\n${y1}\n11\n${x2}\n21\n${y2}\n`; }
  function fpDxfCircle(cx,cy,r){ return `0\nCIRCLE\n8\n0\n10\n${cx}\n20\n${cy}\n40\n${r}\n`; }
  function fpDxfText(x,y,text,height){ return `0\nTEXT\n8\n0\n10\n${x}\n20\n${y}\n40\n${height}\n1\n${String(text).replace(/[\r\n]+/g,' ')}\n`; }
  function fpRotatePoint(x,y,cx,cy,deg){
    const rad = deg*Math.PI/180;
    const dx=x-cx, dy=y-cy;
    return [ cx+dx*Math.cos(rad)-dy*Math.sin(rad), cy+dx*Math.sin(rad)+dy*Math.cos(rad) ];
  }
  function fpBuildDxf(){
    let body = '';
    const flipY = y => -y;
    fpState.elements.forEach(el=>{
      if(fpIsLineType(el.type)){
        body += fpDxfLine(el.x1, flipY(el.y1), el.x2, flipY(el.y2));
        const lineStyle = FP_LINE_TYPE_STYLE[el.type];
        if(lineStyle && lineStyle.double){
          const dxr = el.x2-el.x1, dyr = el.y2-el.y1, len = Math.hypot(dxr,dyr)||1, off = 0.2;
          body += fpDxfLine(el.x1-dyr/len*off, flipY(el.y1+dxr/len*off), el.x2-dyr/len*off, flipY(el.y2+dxr/len*off));
        }
      } else if(el.type==='circle'){
        body += fpDxfCircle(el.cx, flipY(el.cy), el.r);
      } else if(el.type==='oval'){
        const N=48; let prev=null;
        for(let i=0;i<=N;i++){
          const t=(i/N)*2*Math.PI;
          let x=el.cx+Math.cos(t)*el.w/2, y=el.cy+Math.sin(t)*el.h/2;
          [x,y]=fpRotatePoint(x,y,el.cx,el.cy,el.rot||0);
          if(prev) body += fpDxfLine(prev[0], flipY(prev[1]), x, flipY(y));
          prev=[x,y];
        }
      } else { // rect | square
        const hw=el.w/2, hh=el.h/2;
        const corners = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy])=>fpRotatePoint(el.cx+dx, el.cy+dy, el.cx, el.cy, el.rot||0));
        for(let i=0;i<4;i++){ const a=corners[i], b=corners[(i+1)%4]; body += fpDxfLine(a[0], flipY(a[1]), b[0], flipY(b[1])); }
      }
    });
    fpState.objects.forEach(item=>{
      const hw=(item.w/12)/2, hd=(item.d/12)/2;
      const corners = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([dx,dy])=>fpRotatePoint(item.cx+dx, item.cy+dy, item.cx, item.cy, item.rot||0));
      for(let i=0;i<4;i++){ const a=corners[i], b=corners[(i+1)%4]; body += fpDxfLine(a[0], flipY(a[1]), b[0], flipY(b[1])); }
      if(item.label && item.label.trim()){
        body += fpDxfText(item.cx-hw, flipY(item.cy-hd-0.3), item.label, 0.25);
      }
    });
    return `0\nSECTION\n2\nENTITIES\n${body}0\nENDSEC\n0\nEOF\n`;
  }
  async function fpExportDxf(){
    const dxf = fpBuildDxf();
