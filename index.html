    const blob = new Blob([dxf], {type:'application/dxf'});
    await fpSaveBlobWithPicker(blob, `${fpSafeFileName(fpState.title)}.dxf`, 'DXF drawing (opens in AutoCAD and most CAD software)', {'application/dxf':['.dxf']});
  }

  function fpOpenExportModal(){
    const wrap = openModal('Save As',
      '<p class="fp-hint" style="margin:0 0 .7rem;">Choose a format, then pick where to save it.</p>' +
      '<button class="btn" id="fpExpPng" style="width:100%; margin-bottom:.4rem;">Image (PNG)</button>' +
      '<button class="btn" id="fpExpJpg" style="width:100%; margin-bottom:.4rem;">Image (JPG)</button>' +
      '<button class="btn" id="fpExpPdf" style="width:100%; margin-bottom:.4rem;">Print / Save as PDF&hellip;</button>' +
      '<button class="btn" id="fpExpDxf" style="width:100%; margin-bottom:.4rem;">DXF drawing (AutoCAD &amp; other CAD software)</button>' +
      '<button class="btn" id="fpExpProject" style="width:100%; border-color:var(--accent); color:var(--accent);">Project file (.json, re-editable)</button>'
    );
    wrap.querySelector('#fpExpPng').addEventListener('click', async ()=>{ wrap.remove(); await fpExportRaster('png'); });
    wrap.querySelector('#fpExpJpg').addEventListener('click', async ()=>{ wrap.remove(); await fpExportRaster('jpeg'); });
    wrap.querySelector('#fpExpPdf').addEventListener('click', async ()=>{ wrap.remove(); await fpExportPdf(); });
    wrap.querySelector('#fpExpDxf').addEventListener('click', async ()=>{ wrap.remove(); await fpExportDxf(); });
    wrap.querySelector('#fpExpProject').addEventListener('click', async ()=>{ wrap.remove(); await fpExportProjectFile(); });
  }

  // ---- Copy to system clipboard (Ctrl/Cmd+C; Ctrl/Cmd+A marks "whole plan") ----
  let fpSelectAllActive = false;
  async function fpCopyToClipboard(){
    if(!navigator.clipboard || !window.ClipboardItem){ toast('This browser can\'t copy images to the clipboard.', true); return; }
    let bounds = null;
    if(!fpSelectAllActive){
      const sel = fpSelectionBounds();
      if(sel) bounds = { minX:sel.minX-1, minY:sel.minY-1, maxX:sel.maxX+1, maxY:sel.maxY+1 };
    }
    if(!bounds) bounds = fpComputePlanBounds();
    const svg = fpBuildExportSvg(bounds);
    const w = Math.round((bounds.maxX-bounds.minX)*FP_EXPORT_SCALE), h = Math.round((bounds.maxY-bounds.minY)*FP_EXPORT_SCALE);
    try{
      const canvas = await fpRasterizeSvg(svg, w, h);
      const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
      toast('Copied to clipboard.');
    }catch(e){
      toast('Could not copy to clipboard in this browser.', true);
    }
  }

  // ---- Recent Projects: up to 5, entirely internal (IndexedDB) -- click to
  // switch, no file picker involved. The currently-open plan is always also
  // one of these entries, kept in sync by scheduleFpProjectSave() from
  // fpSave() on every real edit. Separate from the file-system backup above,
  // which is about surviving data loss, not organizing multiple plans.
  const FP_PROJECTS_DB = 'floorplanner-projects', FP_PROJECTS_STORE = 'projects', FP_MAX_PROJECTS = 5;
  const FP_ACTIVE_PROJECT_ID_KEY = 'floorplanner-active-project-id';
  let fpActiveProjectId = null;
  function openFpProjectsDb(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(FP_PROJECTS_DB, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(FP_PROJECTS_STORE, { keyPath:'id' }); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async function fpListProjects(){
    try{
      const db = await openFpProjectsDb();
      const all = await new Promise((resolve,reject)=>{
        const req = db.transaction(FP_PROJECTS_STORE,'readonly').objectStore(FP_PROJECTS_STORE).getAll();
        req.onsuccess = ()=>resolve(req.result||[]);
        req.onerror = ()=>reject(req.error);
      });
      return all.sort((a,b)=>b.savedAt-a.savedAt);
    }catch(e){ return []; }
  }
  async function fpGetProject(id){
    try{
      const db = await openFpProjectsDb();
      return await new Promise((resolve,reject)=>{
        const req = db.transaction(FP_PROJECTS_STORE,'readonly').objectStore(FP_PROJECTS_STORE).get(id);
        req.onsuccess = ()=>resolve(req.result||null);
        req.onerror = ()=>reject(req.error);
      });
    }catch(e){ return null; }
  }
  async function fpPutProject(record){
    try{
      const db = await openFpProjectsDb();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(FP_PROJECTS_STORE,'readwrite');
        tx.objectStore(FP_PROJECTS_STORE).put(record);
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
    }catch(e){}
  }
  async function fpDeleteProject(id){
    try{
      const db = await openFpProjectsDb();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(FP_PROJECTS_STORE,'readwrite');
        tx.objectStore(FP_PROJECTS_STORE).delete(id);
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
    }catch(e){}
  }
  function fpGetActiveProjectId(){ try{ return localStorage.getItem(FP_ACTIVE_PROJECT_ID_KEY); }catch(e){ return null; } }
  function fpSetActiveProjectId(id){ try{ localStorage.setItem(FP_ACTIVE_PROJECT_ID_KEY, id); }catch(e){} }
  function fpNewProjectId(){ return 'p' + Date.now() + Math.random().toString(36).slice(2,7); }
  function fpProjectSnapshot(){
    return JSON.parse(JSON.stringify(Object.assign({}, fpState, { __idSeq: fpIdSeq })));
  }
  async function fpEnforceProjectLimit(){
    const list = await fpListProjects();
    for(const p of list.slice(FP_MAX_PROJECTS)) await fpDeleteProject(p.id); // oldest beyond the cap
  }

  let fpProjectSaveDebounceId = null;
  function scheduleFpProjectSave(){
    if(fpProjectSaveDebounceId) clearTimeout(fpProjectSaveDebounceId);
    fpProjectSaveDebounceId = setTimeout(async ()=>{
      fpProjectSaveDebounceId = null;
      if(!fpActiveProjectId) return;
      await fpPutProject({ id:fpActiveProjectId, name:fpState.title, savedAt:Date.now(), state:fpProjectSnapshot() });
    }, 500);
  }
  // Immediately persists the CURRENT project's latest state, bypassing the
  // 500ms debounce above -- called right before switching away from it (new
  // project or an existing one), so an edit made just before switching can't
  // be lost to a debounce timer that hadn't fired yet.
  async function fpFlushActiveProjectSave(){
    if(fpProjectSaveDebounceId){ clearTimeout(fpProjectSaveDebounceId); fpProjectSaveDebounceId = null; }
    if(!fpActiveProjectId) return;
    await fpPutProject({ id:fpActiveProjectId, name:fpState.title, savedAt:Date.now(), state:fpProjectSnapshot() });
  }

  async function fpStartNewProject(){
    await fpFlushActiveProjectSave();
    fpActiveProjectId = fpNewProjectId();
    fpSetActiveProjectId(fpActiveProjectId);
    fpState = fpDefaultState();
    fpDeselect();
    fpHistory = [];
    document.getElementById('fpUndoBtn').disabled = true;
    document.getElementById('fpTitle').textContent = fpState.title;
    fpSave();
    await fpPutProject({ id:fpActiveProjectId, name:fpState.title, savedAt:Date.now(), state:fpProjectSnapshot() });
    await fpEnforceProjectLimit();
    fpRender();
  }
  async function fpSwitchToProject(id){
    if(id===fpActiveProjectId) return;
    const record = await fpGetProject(id);
    if(!record) return;
    await fpFlushActiveProjectSave();
    fpActiveProjectId = id;
    fpSetActiveProjectId(id);
    const parsed = record.state || {};
    fpState = Object.assign({}, fpDefaultState(), parsed);
    fpIdSeq = parsed.__idSeq || 1000;
    delete fpState.__idSeq;
    fpDeselect();
    fpHistory = [];
    document.getElementById('fpUndoBtn').disabled = true;
    document.getElementById('fpTitle').textContent = fpState.title;
    fpSave();
    fpRender();
  }
  async function fpRenameProject(id, name){
    const record = await fpGetProject(id);
    if(!record) return;
    record.name = name;
    await fpPutProject(record);
    if(id===fpActiveProjectId){
      fpState.title = name;
      document.getElementById('fpTitle').textContent = name;
      fpSave();
    }
  }

  function fpOpenProjectsModal(){
    const wrap = openModal('Recent Projects',
      '<button class="btn" id="fpNewProjectBtn" style="width:100%; margin-bottom:.7rem; border-color:var(--accent); color:var(--accent);">+ New Project</button>' +
      '<div id="fpProjectsListWrap" class="fp-list"></div>'
    );
    async function refresh(){
      const list = await fpListProjects();
      const listWrap = wrap.querySelector('#fpProjectsListWrap');
      listWrap.innerHTML = '';
      if(!list.length){
        const p = document.createElement('p'); p.className = 'fp-hint'; p.style.margin = '0';
        p.textContent = 'No saved projects yet.';
        listWrap.appendChild(p);
        return;
      }
      list.forEach(rec=>{
        const isActive = rec.id===fpActiveProjectId;
        const row = document.createElement('div'); row.className = 'fp-row';
        const nameBtn = document.createElement('button');
        nameBtn.type = 'button'; nameBtn.className = 'fp-row-grow';
        nameBtn.style.cssText = 'text-align:left; background:none; border:none; font-size:.8rem; cursor:pointer; padding:.3rem 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;' +
          (isActive ? 'color:var(--accent); font-weight:700;' : 'color:var(--text);');
        nameBtn.textContent = (rec.name || 'Untitled Floor Plan') + (isActive ? ' (current)' : '');
        nameBtn.title = 'Open this project';
        nameBtn.addEventListener('click', async ()=>{ await fpSwitchToProject(rec.id); wrap.remove(); });
        const renameBtn = document.createElement('button');
        renameBtn.type = 'button'; renameBtn.className = 'fp-row-remove'; renameBtn.style.color = 'var(--dim)';
        renameBtn.textContent = '⌨'; renameBtn.title = 'Rename';
        // In-row inline edit instead of window.prompt() -- native blocking
        // dialogs are unreliable in an installed standalone-mode PWA window.
        renameBtn.addEventListener('click', ()=>{
          const input = document.createElement('input');
          input.type = 'text'; input.className = 'fp-row-grow fp-detail-input';
          input.value = rec.name || 'Untitled Floor Plan';
          row.replaceChild(input, nameBtn);
          input.focus(); input.select();
          let done = false;
          function commit(){
            if(done) return; done = true;
            const next = input.value.trim();
            if(next && next!==rec.name){ fpRenameProject(rec.id, next).then(refresh); }
            else refresh();
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (e)=>{
            if(e.key==='Enter'){ e.preventDefault(); commit(); }
            else if(e.key==='Escape'){ e.preventDefault(); done = true; refresh(); }
          });
        });
        const delBtn = document.createElement('button');
        delBtn.type = 'button'; delBtn.className = 'fp-row-remove'; delBtn.textContent = '×'; delBtn.title = 'Delete';
        delBtn.addEventListener('click', async ()=>{
          const ok = await fpConfirmModal(`Delete "${rec.name || 'Untitled Floor Plan'}"? This can't be undone.`, 'Delete');
          if(!ok) return;
          await fpDeleteProject(rec.id);
          if(rec.id===fpActiveProjectId) await fpStartNewProject();
          refresh();
        });
        row.append(nameBtn, renameBtn, delBtn);
        listWrap.appendChild(row);
      });
    }
    wrap.querySelector('#fpNewProjectBtn').addEventListener('click', async ()=>{
      const ok = await fpConfirmModal('Start a new blank project? Your current one stays saved in Recent Projects.', 'Start new');
      if(!ok) return;
      await fpStartNewProject();
      wrap.remove();
    });
    refresh();
  }

  const FP_SHOW_GRID_KEY = 'floorplanner-show-grid';
  function fpGetShowGrid(){ try{ return localStorage.getItem(FP_SHOW_GRID_KEY) !== '0'; }catch(e){ return true; } }
  function fpSetShowGrid(show){ try{ localStorage.setItem(FP_SHOW_GRID_KEY, show ? '1' : '0'); }catch(e){} }

  function fpApplyGridBackground(canvas, scale){
    if(!fpGetShowGrid()){ canvas.style.backgroundImage = 'none'; return; }
    const minor = FP_GRID_STEP*scale, major = 5*scale;
    canvas.style.backgroundImage =
      'linear-gradient(to right, rgba(74,144,217,.4) 1px, transparent 1px),' +
      'linear-gradient(to bottom, rgba(74,144,217,.4) 1px, transparent 1px),' +
      'linear-gradient(to right, rgba(74,144,217,.16) 1px, transparent 1px),' +
      'linear-gradient(to bottom, rgba(74,144,217,.16) 1px, transparent 1px)';
    canvas.style.backgroundSize = `${major}px ${major}px, ${major}px ${major}px, ${minor}px ${minor}px, ${minor}px ${minor}px`;
    canvas.style.backgroundPosition = '-1.5px -1.5px';
  }

  function fpSvgEl(tag, attrs){
    const el = document.createElementNS(SVG_NS, tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Writes an element's current feet-based geometry onto its live SVG shape
  // node -- shared by body-drag (moving) and node-drag (reshaping) so both
  // repaint identically without a full fpRender() mid-gesture.
  function fpUpdateShapeAttrs(shapeNode, el, px){
    if(!shapeNode) return;
    if(fpIsLineType(el.type)){
      shapeNode.setAttribute('x1', px(el.x1)); shapeNode.setAttribute('y1', px(el.y1));
      shapeNode.setAttribute('x2', px(el.x2)); shapeNode.setAttribute('y2', px(el.y2));
    } else if(el.type==='circle'){
      shapeNode.setAttribute('cx', px(el.cx)); shapeNode.setAttribute('cy', px(el.cy)); shapeNode.setAttribute('r', px(el.r));
    } else if(el.type==='oval'){
      shapeNode.setAttribute('cx', px(el.cx)); shapeNode.setAttribute('cy', px(el.cy));
      shapeNode.setAttribute('rx', px(el.w/2)); shapeNode.setAttribute('ry', px(el.h/2));
      shapeNode.setAttribute('transform', `rotate(${el.rot||0} ${px(el.cx)} ${px(el.cy)})`);
    } else { // rect | square
      shapeNode.setAttribute('x', px(el.cx-el.w/2)); shapeNode.setAttribute('y', px(el.cy-el.h/2));
      shapeNode.setAttribute('width', px(el.w)); shapeNode.setAttribute('height', px(el.h));
      shapeNode.setAttribute('transform', `rotate(${el.rot||0} ${px(el.cx)} ${px(el.cy)})`);
    }
  }

  // Resize/reshape/rotate node handles for the selected structural element.
  // Lines get two independent endpoint handles (no rotation math needed).
  // Circles get one radius handle. Rects/squares/ovals get 4 corner handles
  // that resize symmetrically around the fixed center (simpler and more
  // predictable under rotation than pinning one visual corner) plus a
  // rotate handle mirroring the furniture rotate-dot pattern.
  function fpAddElementNodes(svg, canvas, el, px, scale){
    const layer = fpSvgEl('g', { class:'fp-nodes-layer' });
    const shapeNode = svg.querySelector(`.fp-el[data-id="${el.id}"] .fp-el-shape`);

    function feetFromClient(clientX, clientY){
      const rect = canvas.getBoundingClientRect();
      return [ fpSnap((clientX-rect.left)/scale), fpSnap((clientY-rect.top)/scale) ];
    }
    function mkHandle(fx, fy, cls, onMoveFeet){
      const h = fpSvgEl('circle', { cx:px(fx), cy:px(fy), r:6, class:cls||'fp-node' });
      h.addEventListener('pointerdown', (e)=>{
        e.preventDefault(); e.stopPropagation();
        fpPushHistory();
        // See the matching comment in the whole-element drag handler above --
        // a wall's decorative visible sub-segments (hide-under-opening
        // effect) are a static snapshot that won't track a live endpoint
        // drag, so show the plain full line for the move and let the next
        // fpRender() at drag-end recompute the split.
        if(shapeNode && shapeNode.classList.contains('fp-hidden-under-opening')){
          shapeNode.classList.remove('fp-hidden-under-opening');
          shapeNode.removeAttribute('pointer-events');
          svg.querySelectorAll(`.fp-el[data-id="${el.id}"] .fp-el-shape-visible`).forEach(n=>n.remove());
        }
        try{ h.setPointerCapture(e.pointerId); }catch(err){}
        function move(ev){
          const [mx,my] = feetFromClient(ev.clientX, ev.clientY);
          onMoveFeet(mx, my);
          fpUpdateShapeAttrs(shapeNode, el, px);
          h.setAttribute('cx', px(mx)); h.setAttribute('cy', px(my));
        }
        function up(){
          h.removeEventListener('pointermove', move);
          h.removeEventListener('pointerup', up);
          fpSave(); fpRender();
        }
        h.addEventListener('pointermove', move);
        h.addEventListener('pointerup', up);
      });
      return h;
    }

    if(fpIsLineType(el.type)){
      layer.appendChild(mkHandle(el.x1, el.y1, 'fp-node', (mx,my)=>{ el.x1=mx; el.y1=my; }));
      layer.appendChild(mkHandle(el.x2, el.y2, 'fp-node', (mx,my)=>{ el.x2=mx; el.y2=my; }));
    } else if(el.type==='circle'){
      layer.appendChild(mkHandle(el.cx+el.r, el.cy, 'fp-node', (mx,my)=>{
        el.r = Math.max(FP_GRID_STEP, fpSnap(Math.hypot(mx-el.cx, my-el.cy)));
      }));
    } else {
      const rad = (el.rot||0)*Math.PI/180;
      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
        const lx0 = sx*el.w/2, ly0 = sy*el.h/2;
        const fx = el.cx + lx0*Math.cos(rad) - ly0*Math.sin(rad);
        const fy = el.cy + lx0*Math.sin(rad) + ly0*Math.cos(rad);
        layer.appendChild(mkHandle(fx, fy, 'fp-node', (mx,my)=>{
          const dxr = mx-el.cx, dyr = my-el.cy;
          const cr = Math.cos(-rad), sr = Math.sin(-rad);
          const lx = dxr*cr - dyr*sr, ly = dxr*sr + dyr*cr;
          let halfW = Math.max(FP_GRID_STEP/2, Math.abs(fpSnap(lx)));
          let halfH = Math.max(FP_GRID_STEP/2, Math.abs(fpSnap(ly)));
          if(el.type==='square'){ const s = Math.max(halfW,halfH); halfW=s; halfH=s; }
          el.w = halfW*2; el.h = halfH*2;
        }));
      });
      // Rotate handle, above the shape's (rotated) top edge
      const topLocalY = -el.h/2 - 1.4;
      const rtx = el.cx - topLocalY*Math.sin(rad), rty = el.cy + topLocalY*Math.cos(rad);
      const rh = fpSvgEl('circle', { cx:px(rtx), cy:px(rty), r:6, class:'fp-rotate-node' });
      rh.addEventListener('pointerdown', (e)=>{
        e.preventDefault(); e.stopPropagation();
        fpPushHistory();
        try{ rh.setPointerCapture(e.pointerId); }catch(err){}
        function move(ev){
          const rect = canvas.getBoundingClientRect();
          const mx = (ev.clientX-rect.left)/scale, my = (ev.clientY-rect.top)/scale;
          const angle = Math.atan2(my-el.cy, mx-el.cx)*180/Math.PI + 90;
          el.rot = Math.round(angle/5)*5;
          fpUpdateShapeAttrs(shapeNode, el, px);
          const rad2 = el.rot*Math.PI/180, ty = -el.h/2-1.4;
          rh.setAttribute('cx', px(el.cx - ty*Math.sin(rad2)));
          rh.setAttribute('cy', px(el.cy + ty*Math.cos(rad2)));
        }
        function up(){
          rh.removeEventListener('pointermove', move);
          rh.removeEventListener('pointerup', up);
          fpSave(); fpRender();
        }
        rh.addEventListener('pointermove', move);
        rh.addEventListener('pointerup', up);
      });
      layer.appendChild(rh);
    }
    svg.appendChild(layer);
  }

  // Wires whole-canvas interaction for the current mode. Uses property
  // assignment (canvas.onclick = ...) rather than addEventListener for the
  // per-render handlers, since this runs on every fpRender() and the canvas
  // DOM node itself is reused across renders -- addEventListener here would
  // silently stack duplicate handlers on every re-render.
  function fpWireCanvasInteraction(canvas, svg, px, scale){
    function feetFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      return [ fpSnap((e.clientX-rect.left)/scale), fpSnap((e.clientY-rect.top)/scale) ];
    }
    canvas.onpointerdown = null;
    canvas.onpointermove = null;
    canvas.onclick = null;

    if(fpMode!=='draw'){
      canvas.onpointerdown = (e)=>{
        if(e.target===canvas || e.target===svg){ fpDeselect(); fpRender(); }
      };
      return;
    }

    const isLineTool = fpIsLineType(fpDrawTool);
    if(isLineTool){
      if(fpDrawPending){
        const previewStyle = FP_LINE_TYPE_STYLE[fpDrawTool];
        const previewLine = fpSvgEl('line', {
          x1:px(fpDrawPending.x1), y1:px(fpDrawPending.y1),
          x2:px(fpDrawPending.x1), y2:px(fpDrawPending.y1),
          stroke: previewStyle ? previewStyle.stroke : '#40d0b5', 'stroke-width':2,
          'stroke-dasharray': previewStyle ? (previewStyle.dash||'none') : (fpDrawTool==='dashedline' ? '8,6' : 'none'),
        });
        svg.appendChild(previewLine);
        canvas.onpointermove = (e)=>{
          const [mx,my] = feetFromEvent(e);
          previewLine.setAttribute('x2', px(mx)); previewLine.setAttribute('y2', px(my));
        };
      }
      canvas.onclick = (e)=>{
        if(e.target.closest('.fp-item, .fp-node, .fp-rotate-node')) return;
        const [mx,my] = feetFromEvent(e);
        if(!fpDrawPending){
          fpDrawPending = { x1:mx, y1:my };
          fpRender();
        } else {
          const start = fpDrawPending;
          fpDrawPending = null;
          if(Math.hypot(mx-start.x1, my-start.y1) >= FP_GRID_STEP){
            fpPushHistory();
            fpState.elements.push({ id:fpIdSeq++, type:fpDrawTool, x1:start.x1, y1:start.y1, x2:mx, y2:my, color:'#8b8d8e' });
            fpSave();
          }
          fpRender();
        }
      };
      return;
    }

    // Shape tools: drag from one grid-snapped corner/center to another
    canvas.onpointerdown = (e)=>{
      if(e.target.closest('.fp-item, .fp-node, .fp-rotate-node')) return;
      if(e.button!=null && e.button!==0) return;
      const [sx,sy] = feetFromEvent(e);
      const isCircle = fpDrawTool==='circle', isOval = fpDrawTool==='oval';
      const previewShape = fpSvgEl(isCircle?'circle':isOval?'ellipse':'rect', {
        stroke:'#40d0b5', 'stroke-width':2, fill:'rgba(64,208,181,.14)',
        ...(isCircle ? {cx:px(sx),cy:px(sy),r:0} : isOval ? {cx:px(sx),cy:px(sy),rx:0,ry:0} : {x:px(sx),y:px(sy),width:0,height:0}),
      });
      svg.appendChild(previewShape);
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      function onMove(ev){
        const [mx,my] = feetFromEvent(ev);
        if(isCircle){
          previewShape.setAttribute('r', px(Math.hypot(mx-sx,my-sy)));
        } else if(isOval){
          const ww=Math.abs(mx-sx), hh=Math.abs(my-sy);
          previewShape.setAttribute('cx', px((sx+mx)/2)); previewShape.setAttribute('cy', px((sy+my)/2));
          previewShape.setAttribute('rx', px(ww/2)); previewShape.setAttribute('ry', px(hh/2));
        } else {
          let ww = mx-sx, hh = my-sy;
          if(fpDrawTool==='square'){ const s=Math.max(Math.abs(ww),Math.abs(hh)); ww=(ww<0?-1:1)*s; hh=(hh<0?-1:1)*s; }
          previewShape.setAttribute('x', px(Math.min(sx,sx+ww)));
          previewShape.setAttribute('y', px(Math.min(sy,sy+hh)));
          previewShape.setAttribute('width', px(Math.abs(ww)));
          previewShape.setAttribute('height', px(Math.abs(hh)));
        }
      }
      function onUp(ev){
        canvas.removeEventListener('pointermove', onMove);
        canvas.removeEventListener('pointerup', onUp);
        const [mx,my] = feetFromEvent(ev);
        if(isCircle){
          const r = Math.max(FP_GRID_STEP, fpSnap(Math.hypot(mx-sx,my-sy)));
          if(r>=FP_GRID_STEP){
            fpPushHistory();
            fpState.elements.push({ id:fpIdSeq++, type:'circle', cx:sx, cy:sy, r, color:'#8b8d8e', fill:'rgba(139,141,142,.06)' });
            fpSave();
          }
        } else {
          let ww = Math.abs(mx-sx), hh = Math.abs(my-sy);
          if(fpDrawTool==='square'){ const s=Math.max(ww,hh); ww=s; hh=s; }
          if(ww>=FP_GRID_STEP && hh>=FP_GRID_STEP){
            const cx = fpSnap((sx+mx)/2), cy = fpSnap((sy+my)/2);
            fpPushHistory();
            fpState.elements.push({ id:fpIdSeq++, type:fpDrawTool, cx, cy, w:ww, h:hh, rot:0, color:'#8b8d8e', fill:'rgba(139,141,142,.06)' });
            fpSave();
          }
        }
        fpRender();
      }
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
    };
  }

  function fpRender(){
    const canvas = document.getElementById('fpCanvas');
    const wrap = document.getElementById('fpCanvasWrap');
    // Auto-fit: shrink so the grid fits the available width on narrow
    // screens (never scales UP past real size on wide ones), on top of
    // which the zoom buttons apply a manual multiplier. Recomputed on every
    // render, which also covers resize/orientation change since those call
    // fpRender() too.
    const gridSize = fpComputeGridSize();
    const naturalW = gridSize.w * FP_SCALE;
    const availW = wrap ? wrap.clientWidth - 80 : 0; // minus 40px padding each side
    const autoFit = (availW > 0) ? Math.min(1, availW/naturalW) : 1;
    const scale = FP_SCALE * autoFit * fpZoomMultiplier;
    const zoomLabel = document.getElementById('fpZoomLabel');
    if(zoomLabel) zoomLabel.textContent = Math.round(autoFit*fpZoomMultiplier*100)+'%';
    const w = gridSize.w * scale, d = gridSize.h * scale;
    canvas.style.width = w+'px'; canvas.style.height = d+'px';
    fpApplyGridBackground(canvas, scale);
    canvas.classList.toggle('fp-draw-mode', fpMode==='draw');
    canvas.innerHTML = '';
    const px = v => v*scale;

    const svg = fpSvgEl('svg', { width:w, height:d, class:'fp-svg' });
    canvas.appendChild(svg);

    // Structural elements (walls + shapes)
    fpState.elements.forEach(el=>{
      const selected = fpSelectedKind==='element' && el.id===fpSelectedId;
      const g = fpSvgEl('g', { class:'fp-el'+(selected?' selected':''), 'data-id':el.id });
      let shape;
      let visibleRanges = null; // wall-only: sub-ranges NOT covered by an opening on top (see fpVisibleWallRanges)
      if(el.type==='line' || el.type==='dashedline' || FP_LINE_TYPE_STYLE[el.type]){
        const lineStyle = FP_LINE_TYPE_STYLE[el.type];
        const strokeColor = lineStyle ? lineStyle.stroke : (el.color||'#8b8d8e');
        const strokeWidth = lineStyle ? FP_OPENING_STROKE_WIDTH : FP_WALL_STROKE_WIDTH;
        if(!lineStyle) visibleRanges = fpVisibleWallRanges(el, fpState.elements);
        shape = fpSvgEl('line', {
          x1:px(el.x1), y1:px(el.y1), x2:px(el.x2), y2:px(el.y2),
          stroke: strokeColor, 'stroke-width':strokeWidth, 'stroke-linecap':'round',
        });
        if(el.type==='dashedline') shape.setAttribute('stroke-dasharray','10,7');
        if(lineStyle && lineStyle.dash) shape.setAttribute('stroke-dasharray', lineStyle.dash);
        if(lineStyle && lineStyle.double){
          // A second, perpendicular-offset line for the "double line" door
          // symbol -- purely cosmetic (not draggable), recomputed on every
          // full render, including right after a drag ends.
          const dx = el.x2-el.x1, dy = el.y2-el.y1, len = Math.hypot(dx,dy)||1;
          const off = 2.5/scale; // feet, so the on-screen gap stays constant across zoom
          const ox = -dy/len*off, oy = dx/len*off;
          const secondary = fpSvgEl('line', {
            x1:px(el.x1+ox), y1:px(el.y1+oy), x2:px(el.x2+ox), y2:px(el.y2+oy),
            stroke: lineStyle.stroke, 'stroke-width':strokeWidth, 'stroke-linecap':'round',
            class:'fp-el-shape-secondary',
          });
          g.appendChild(secondary);
        }
      } else if(el.type==='circle'){
        shape = fpSvgEl('circle', {
          cx:px(el.cx), cy:px(el.cy), r:px(el.r),
          stroke: el.color||'#8b8d8e', 'stroke-width':2, fill: el.fill||'rgba(139,141,142,.06)',
        });
      } else if(el.type==='oval'){
        shape = fpSvgEl('ellipse', {
          cx:px(el.cx), cy:px(el.cy), rx:px(el.w/2), ry:px(el.h/2),
          stroke: el.color||'#8b8d8e', 'stroke-width':2, fill: el.fill||'rgba(139,141,142,.06)',
          transform: `rotate(${el.rot||0} ${px(el.cx)} ${px(el.cy)})`,
        });
      } else { // rect | square
        shape = fpSvgEl('rect', {
          x:px(el.cx-el.w/2), y:px(el.cy-el.h/2), width:px(el.w), height:px(el.h),
          stroke: el.color||'#8b8d8e', 'stroke-width':2, fill: el.fill||'rgba(139,141,142,.06)',
          transform: `rotate(${el.rot||0} ${px(el.cx)} ${px(el.cy)})`,
        });
      }
      shape.setAttribute('class','fp-el-shape');
      g.appendChild(shape);

      // Wall hidden (fully or partially) under an opening/window/door on
      // top of it: `shape` becomes an invisible full-span hit-target (so
      // the wall stays selectable/draggable across its whole original
      // length, same as before) while separate, non-interactive line(s)
      // draw only the uncovered range(s) -- see fpVisibleWallRanges().
      const isFullyVisible = !visibleRanges || (visibleRanges.length===1 && visibleRanges[0][0]<=1e-9 && visibleRanges[0][1]>=1-1e-9);
      if(!isFullyVisible){
        shape.classList.add('fp-hidden-under-opening');
        shape.setAttribute('pointer-events','stroke');
        const dash = shape.getAttribute('stroke-dasharray');
        visibleRanges.forEach(([lo,hi])=>{
          const seg = fpSvgEl('line', {
            x1:px(el.x1+(el.x2-el.x1)*lo), y1:px(el.y1+(el.y2-el.y1)*lo),
            x2:px(el.x1+(el.x2-el.x1)*hi), y2:px(el.y1+(el.y2-el.y1)*hi),
            stroke: shape.getAttribute('stroke'), 'stroke-width': shape.getAttribute('stroke-width'), 'stroke-linecap':'round',
            class:'fp-el-shape-visible',
          });
          if(dash) seg.setAttribute('stroke-dasharray', dash);
          seg.setAttribute('pointer-events','none');
          g.appendChild(seg);
        });
      }

      g.addEventListener('pointerdown', (e)=>{
        if(fpDeleteModeActive){ e.preventDefault(); e.stopPropagation(); fpDeleteItem('element', el.id); return; }
        if(fpMode!=='select') return;
        if(e.target.closest('.fp-node, .fp-rotate-node')) return;
        e.preventDefault(); e.stopPropagation();
        fpSelect('element', el.id);
        fpPushHistory();
        // The decorative visible sub-segments above are a static snapshot
        // from this render and won't track a live drag -- show the plain
        // full line for the move instead of letting them go stale; the
        // next fpRender() at drag-end recomputes the correct split for
        // wherever this wall lands.
        if(shape.classList.contains('fp-hidden-under-opening')){
          shape.classList.remove('fp-hidden-under-opening');
          shape.removeAttribute('pointer-events');
          g.querySelectorAll('.fp-el-shape-visible').forEach(n=>n.remove());
        }
        const startX=e.clientX, startY=e.clientY;
        const orig = JSON.parse(JSON.stringify(el));
        function onMove(ev){
          const dx = (ev.clientX-startX)/scale, dy = (ev.clientY-startY)/scale;
          if(fpIsLineType(el.type)){
            el.x1 = fpSnap(orig.x1+dx); el.y1 = fpSnap(orig.y1+dy);
            el.x2 = fpSnap(orig.x2+dx); el.y2 = fpSnap(orig.y2+dy);
          } else {
            el.cx = fpSnap(orig.cx+dx); el.cy = fpSnap(orig.cy+dy);
          }
          fpUpdateShapeAttrs(shape, el, px);
        }
        function onUp(){
          canvas.removeEventListener('pointermove', onMove);
          canvas.removeEventListener('pointerup', onUp);
          fpSave(); fpRender();
        }
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', onUp);
      });

      svg.appendChild(g);
      if(selected && fpMode==='select') fpAddElementNodes(svg, canvas, el, px, scale);

      if(fpIsLineType(el.type)){
        const hasLineLabel = !!(el.label && el.label.trim());
        if(hasLineLabel || selected){
          const midX = (el.x1+el.x2)/2, midY = (el.y1+el.y2)/2;
          const lineLabel = document.createElement('div');
          lineLabel.className = 'fp-item-label' + (hasLineLabel ? '' : ' placeholder');
          lineLabel.spellcheck = false;
          lineLabel.textContent = hasLineLabel ? el.label : 'Add label';
          lineLabel.title = 'Tap to edit name/length, drag to reposition';
          fpWireDraggableLabel(lineLabel, el, {x:px(midX), y:px(midY)}, 0, scale, 0, -0.5, ()=> fpOpenLineDetailsModal(el));
          canvas.appendChild(lineLabel);
        }
      }
    });

    // Objects (furniture, from the library)
    function updateObjStyle(el, item){
      const pw = (item.w/12)*scale, pd = (item.d/12)*scale;
      Object.assign(el.style, {
        left:(item.cx*scale - pw/2)+'px', top:(item.cy*scale - pd/2)+'px',
        width:pw+'px', height:pd+'px', transform:`rotate(${item.rot||0}deg)`,
      });
    }
    fpState.objects.forEach(item=>{
      const el = document.createElement('div');
      const isSelected = fpSelectedKind==='object' && item.id===fpSelectedId;
      el.className = 'fp-item' + (isSelected ? ' selected' : '');
      el.dataset.id = item.id;
      updateObjStyle(el, item);

      const icon = document.createElementNS(SVG_NS, 'svg');
      icon.setAttribute('viewBox', `0 0 ${item.w} ${item.d}`);
      icon.setAttribute('preserveAspectRatio', 'none');
      icon.setAttribute('class', 'fp-item-icon');
      icon.innerHTML = fpIconMarkup(item);
      el.appendChild(icon);

      // No label by default (an item from the library doesn't force its
      // catalog name onto the plan) -- shown only once the user sets one, or
      // while selected (as an editable placeholder), and drawn snug against
      // the object itself rather than a separate chip that eats canvas space.
      const hasLabel = !!(item.label && item.label.trim());
      const label = document.createElement('div');
      label.className = 'fp-item-label' + (hasLabel ? '' : ' placeholder');
      label.style.display = (hasLabel || isSelected) ? '' : 'none';
      label.spellcheck = false;
      label.textContent = hasLabel ? `${item.label} (${Math.round(item.w)}×${Math.round(item.d)} in)` : 'Add label';
      label.title = 'Tap to edit name/dimensions, drag to reposition';
      const pw = (item.w/12)*scale, pd = (item.d/12)*scale;
      fpWireDraggableLabel(label, item, {x:pw/2, y:pd/2}, item.rot||0, scale, 0, -(item.d/24+0.25), ()=> fpOpenObjectDetailsModal(item));
      el.appendChild(label);

      const rotHandle = document.createElement('div');
      rotHandle.className = 'fp-rotate-handle';
      el.appendChild(rotHandle);

      // Resize/reshape nodes, center-anchored (mirrors the structural-
      // element node-resize in fpAddElementNodes): the 4 corners resize
      // both width and depth together; the 4 edge midpoints resize just
      // one axis, so stretching a single side -- turning a square table
      // into a rectangle, or a circle into an oval -- doesn't require
      // dragging a corner at an exact diagonal to avoid nudging the other
      // axis too. All 8 resize the same way otherwise (symmetric about
      // cx/cy, honoring rotation).
      const RESIZE_NODES = { nw:{w:1,d:1}, ne:{w:1,d:1}, sw:{w:1,d:1}, se:{w:1,d:1}, n:{d:1}, s:{d:1}, e:{w:1}, w:{w:1} };
      Object.keys(RESIZE_NODES).forEach(corner=>{
        const axes = RESIZE_NODES[corner];
        const node = document.createElement('div');
        node.className = 'fp-obj-node ' + corner;
        node.addEventListener('pointerdown', (e)=>{
          if(fpMode!=='select') return;
          e.stopPropagation(); e.preventDefault();
          fpSelect('object', item.id);
          fpPushHistory();
          const rad = (item.rot||0)*Math.PI/180;
          const cr = Math.cos(-rad), sr = Math.sin(-rad);
          try{ node.setPointerCapture(e.pointerId); }catch(err){}
          function onMove(ev){
            const rect = canvas.getBoundingClientRect();
            const mx = (ev.clientX-rect.left)/scale, my = (ev.clientY-rect.top)/scale;
            const dxr = mx-item.cx, dyr = my-item.cy; // feet, relative to center
            const lx = dxr*cr - dyr*sr, ly = dxr*sr + dyr*cr; // feet, in the item's local (unrotated) axes
            if(axes.w) item.w = Math.max(2, Math.round(Math.abs(lx)*12))*2;
            if(axes.d) item.d = Math.max(2, Math.round(Math.abs(ly)*12))*2;
            updateObjStyle(el, item);
            icon.setAttribute('viewBox', `0 0 ${item.w} ${item.d}`);
            icon.innerHTML = fpIconMarkup(item);
          }
          function onUp(){
            node.removeEventListener('pointermove', onMove);
            node.removeEventListener('pointerup', onUp);
            fpSave(); fpRender();
          }
          node.addEventListener('pointermove', onMove);
          node.addEventListener('pointerup', onUp);
        });
        el.appendChild(node);
      });

      el.addEventListener('pointerdown', (e)=>{
        if(fpDeleteModeActive){ e.preventDefault(); e.stopPropagation(); fpDeleteItem('object', item.id); return; }
        if(fpMode!=='select') return;
        if(e.target.closest('.fp-rotate-handle, .fp-obj-node, .fp-item-label') || e.target.isContentEditable) return;
        e.preventDefault();
        fpSelect('object', item.id);
        fpPushHistory();
        const startX = e.clientX, startY = e.clientY, ocx = item.cx, ocy = item.cy;
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        function onMove(ev){
          item.cx = fpSnap(ocx + (ev.clientX-startX)/scale);
          item.cy = fpSnap(ocy + (ev.clientY-startY)/scale);
          updateObjStyle(el, item);
        }
        function onUp(){
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          fpSave();
        }
        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
      });

      rotHandle.addEventListener('pointerdown', (e)=>{
        if(fpMode!=='select') return;
        e.stopPropagation();
        e.preventDefault();
        fpSelect('object', item.id);
        fpPushHistory();
        try{ rotHandle.setPointerCapture(e.pointerId); }catch(err){}
        function onMove(ev){
          const rect = el.getBoundingClientRect();
          const ccx = rect.left+rect.width/2, ccy = rect.top+rect.height/2;
          const angle = Math.atan2(ev.clientY-ccy, ev.clientX-ccx) * 180/Math.PI + 90;
          item.rot = Math.round(angle/5)*5; // snap to 5-degree steps
          el.style.transform = `rotate(${item.rot}deg)`;
        }
        function onUp(){
          rotHandle.removeEventListener('pointermove', onMove);
          rotHandle.removeEventListener('pointerup', onUp);
          fpSave();
        }
        rotHandle.addEventListener('pointermove', onMove);
        rotHandle.addEventListener('pointerup', onUp);
      });

      canvas.appendChild(el);
    });

    // Real drag-and-drop from the Objects/Images library panels onto the
    // grid -- allowed in any tool mode (it's a distinct browser DnD event
    // stream from the pointerdown/move/up sequence Draw mode uses to place
    // lines/shapes, so there's no real conflict between the two).
    canvas.ondragover = (e)=>{ e.preventDefault(); };
    canvas.ondrop = (e)=>{
      const raw = e.dataTransfer.getData('application/json');
      if(!raw) return;
      e.preventDefault();
      try{
        const tpl = JSON.parse(raw);
        const rect = canvas.getBoundingClientRect();
        fpAddObjectFromTemplate(tpl, (e.clientX-rect.left)/scale, (e.clientY-rect.top)/scale);
      }catch(err){}
    };

    fpWireCanvasInteraction(canvas, svg, px, scale);
    fpRenderSidePanels();
  }

  function fpRenderSidePanels(){
    // Objects: category accordion, built once. Each item is a draggable
    // (real HTML5 DnD onto the grid) icon card; a plain click/tap is a
    // fallback that drops it at grid center, for touch devices without drag.
    // "Upload" (user-added graphics) sits first, folded by default; the
    // furniture categories from FP_LIBRARY follow, with the first one open.
    const tplWrap = document.getElementById('fpObjectTemplates');
    if(tplWrap && !tplWrap.dataset.built){
      tplWrap.dataset.built = '1';

      const uploadDetails = document.createElement('details');
      uploadDetails.className = 'fp-lib-cat';
      const uploadSummary = document.createElement('summary');
      uploadSummary.textContent = 'Upload';
      uploadDetails.appendChild(uploadSummary);
      const uploadGrid = document.createElement('div');
      uploadGrid.className = 'fp-lib-grid';
      uploadGrid.id = 'fpImageUploadGrid';
      uploadDetails.appendChild(uploadGrid);
      tplWrap.appendChild(uploadDetails);
      fpRefreshImageLibraryGrid();

      FP_LIBRARY.forEach((cat)=>{
        const details = document.createElement('details');
        details.className = 'fp-lib-cat';
        const summary = document.createElement('summary');
        summary.textContent = cat.name;
        details.appendChild(summary);
        const grid = document.createElement('div');
        grid.className = 'fp-lib-grid';
        cat.items.forEach(tpl=>{
          const btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'fp-lib-item'; btn.draggable = true;
          btn.title = `${tpl.label} (${tpl.w}×${tpl.d}in) — drag onto the grid, or tap to add at center`;
          btn.innerHTML = `<svg viewBox="0 0 ${tpl.w} ${tpl.d}" preserveAspectRatio="xMidYMid meet">${fpIconMarkup(tpl)}</svg><span>${fpEscapeHtml(tpl.label)}</span>`;
          btn.addEventListener('click', ()=> fpAddObjectFromTemplate(tpl));
          btn.addEventListener('dragstart', (e)=>{
            e.dataTransfer.setData('application/json', JSON.stringify(tpl));
            e.dataTransfer.effectAllowed = 'copy';
          });
          grid.appendChild(btn);
        });
        details.appendChild(grid);
        tplWrap.appendChild(details);
      });
    }

    // Notes
    const noteList = document.getElementById('fpNotesList');
    noteList.innerHTML = '';
    fpState.notes.forEach((text, idx)=>{
      const row = document.createElement('div'); row.className='fp-row';
      row.innerHTML = `
        <input type="text" class="fp-row-grow fp-note-text">
        <button class="fp-row-remove" type="button" title="Remove">&times;</button>`;
      row.querySelector('.fp-note-text').value = text;
      row.querySelector('.fp-note-text').addEventListener('change', e=>{ fpState.notes[idx]=e.target.value; fpSave(); });
      row.querySelector('.fp-row-remove').addEventListener('click', ()=>{
        fpPushHistory();
        fpState.notes = fpState.notes.filter((_,i)=>i!==idx);
        fpSave(); fpRender();
      });
      noteList.appendChild(row);
    });
  }

  function fpSetMode(mode){
    fpMode = mode;
    fpDrawPending = null;
    fpSetDeleteMode(false); // also calls fpSyncToolActiveUI(), now that fpMode is up to date
    fpRender();
  }

  function initFloorPlan(){
    // No active-project id yet means this is the very first time the app has
    // ever been opened on this device -- every later open (even of a still-
    // blank, never-renamed project) finds the id this run is about to set
    // below, and just silently resumes it instead.
    const isFirstEverOpen = !fpGetActiveProjectId();
    fpState = fpLoad();
    fpActiveProjectId = fpGetActiveProjectId() || fpNewProjectId();
    fpSetActiveProjectId(fpActiveProjectId);
    document.getElementById('fpTitle').textContent = fpState.title;
    fpRender();
    if(isFirstEverOpen){
      // Prompt for a project name immediately: focus the title field with
      // its placeholder text selected, so a blinking cursor is ready and the
      // very first keystroke replaces "Untitled Floor Plan" outright rather
      // than requiring the user to clear it themselves first. Deferred a
      // tick -- a focus() call made synchronously during initial page
      // bootstrap is unreliable in some browsers (silently dropped before
      // the document itself has taken focus); firing after the current
      // task/paint settles is the standard fix.
      setTimeout(()=>{
        const titleEl = document.getElementById('fpTitle');
        titleEl.focus();
        const range = document.createRange();
        range.selectNodeContents(titleEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 0);
    }
    // Registers the just-loaded plan in Recent Projects even before its
    // first edit, so a fresh install's default/empty plan still shows up.
    fpPutProject({ id:fpActiveProjectId, name:fpState.title, savedAt:Date.now(), state:fpProjectSnapshot() });

    document.getElementById('fpTitle').addEventListener('blur', (e)=>{
      fpState.title = e.target.textContent.trim() || 'Untitled Floor Plan';
      fpSave();
    });

    document.getElementById('fpProjectsBtn').addEventListener('click', fpOpenProjectsModal);
    document.getElementById('fpNewProjectQuickBtn').addEventListener('click', async ()=>{
      const ok = await fpConfirmModal('Start a new blank project? Your current one is saved first, and stays in Recent Projects.', 'Start new');
      if(!ok) return;
      await fpStartNewProject();
    });
    document.getElementById('fpExportBtn').addEventListener('click', fpOpenExportModal);

    document.getElementById('fpModeGroup').addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-mode]');
      if(btn) fpSetMode(btn.dataset.mode);
    });
    document.getElementById('fpModeSelectBtn').addEventListener('click', ()=> fpSetMode('select'));
    document.getElementById('fpDrawToolSelect').addEventListener('change', (e)=>{
      fpDrawTool = e.target.value;
      fpDrawPending = null;
      fpSyncToolActiveUI();
      fpRender();
    });

    // Opening/Window/Door: a custom dropdown (not <select>, which can't
    // render a per-option icon) that arms Draw mode with whichever style was
    // picked -- drawn exactly like a wall, two clicked points anywhere on
    // the grid, not tied to any existing wall.
    const openingDd = document.getElementById('fpOpeningDd');
    const openingDdBtn = document.getElementById('fpOpeningDdBtn');
    const openingDdMenu = document.getElementById('fpOpeningDdMenu');
    const openingDdIcon = document.getElementById('fpOpeningDdIcon');
    const openingDdLabel = document.getElementById('fpOpeningDdLabel');
    const OPENING_DD_LABELS = { opening:'Opening', window:'Window', door:'Door' };
    openingDdBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openingDdMenu.hidden = !openingDdMenu.hidden;
    });
    openingDdMenu.querySelectorAll('.fp-opening-dd-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const tool = item.dataset.tool;
        fpDrawTool = tool;
        fpSetMode('draw'); // also calls fpSyncToolActiveUI(), which marks this dropdown active now that fpDrawTool is opening/window/door
        openingDdIcon.innerHTML = item.querySelector('svg').innerHTML;
        openingDdLabel.textContent = OPENING_DD_LABELS[tool];
        openingDdMenu.hidden = true;
        // Desync the toolbar <select> from its last real option -- picking
        // Opening/Window/Door here never touches that <select>, so without
        // this, re-picking the *same* <select> option afterward (e.g.
        // "Solid line" right after "Opening") fires no 'change' event at
        // all (the browser sees no value change) and fpDrawTool silently
        // stays stuck on 'opening'/'window'/'door'.
        document.getElementById('fpDrawToolSelect').value = '';
      });
    });
    document.addEventListener('click', (e)=>{
      if(!openingDd.contains(e.target)) openingDdMenu.hidden = true;
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key==='Escape') openingDdMenu.hidden = true;
    });
    fpSyncToolActiveUI(); // initial state: Draw + the default "Solid line" tool, matching fpMode/fpDrawTool's defaults above
    document.getElementById('fpImageUploadInput').addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files || []);
      e.target.value = ''; // allow re-selecting the same file later
      for(const file of files) await fpAddImageToLibrary(file);
      if(files.length) toast(files.length>1 ? `Added ${files.length} images.` : 'Image added.');
    });
    document.getElementById('fpNotesAdd').addEventListener('click', ()=>{
      fpPushHistory();
      fpState.notes.push('');
      fpSave(); fpRender();
    });
    document.getElementById('fpGenerateFromPhotosBtn').addEventListener('click', fpOpenGenerateModal);

    document.getElementById('fpDeleteBtn').addEventListener('click', ()=> fpSetDeleteMode(!fpDeleteModeActive));
    document.getElementById('fpUndoBtn').addEventListener('click', fpUndo);
    document.getElementById('fpResetBtn').addEventListener('click', async ()=>{
      const ok = await fpConfirmModal('Clear this floor plan and start blank?', 'Clear');
      if(!ok) return;
      fpPushHistory();
      fpState = fpDefaultState();
      fpDeselect();
      document.getElementById('fpTitle').textContent = fpState.title;
      fpSave(); fpRender();
    });

    document.getElementById('fpZoomIn').addEventListener('click', ()=>{ fpZoomMultiplier = Math.min(3, fpZoomMultiplier*1.25); fpRender(); });
    document.getElementById('fpZoomOut').addEventListener('click', ()=>{ fpZoomMultiplier = Math.max(0.25, fpZoomMultiplier/1.25); fpRender(); });
    document.getElementById('fpZoomFit').addEventListener('click', ()=>{ fpZoomMultiplier = 1; fpRender(); });
    const gridToggleBtn = document.getElementById('fpGridToggle');
    gridToggleBtn.classList.toggle('active', fpGetShowGrid());
    gridToggleBtn.addEventListener('click', ()=>{
      const show = !fpGetShowGrid();
      fpSetShowGrid(show);
      gridToggleBtn.classList.toggle('active', show);
      fpRender();
    });
    let fpResizeTimer = null;
    window.addEventListener('resize', ()=>{
      clearTimeout(fpResizeTimer);
      fpResizeTimer = setTimeout(fpRender, 150);
    });

    document.addEventListener('keydown', (e)=>{
      if(e.key==='Escape' && fpDrawPending){ fpDrawPending = null; fpRender(); return; }
      if(e.key==='Escape' && fpDeleteModeActive){ fpSetDeleteMode(false); return; }
      const typing = document.activeElement.tagName==='INPUT' || document.activeElement.isContentEditable;
      if((e.key==='Delete'||e.key==='Backspace') && fpSelectedId!==null && !typing){
        fpDeleteSelected();
        return;
      }
      if(!typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){
        e.preventDefault();
        fpSelectAllActive = true;
        toast('Selected all — press Ctrl/Cmd+C to copy the whole plan.');
        return;
      }
      if(!typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){
        if(fpSelectedId==null && !fpSelectAllActive) return; // nothing to copy, let the browser's own copy behave normally
        e.preventDefault();
        fpCopyToClipboard();
      }
    });
  }

  // ---------- Floor Plan: generate from photos (Claude vision API) ----------
  // Runs entirely client-side: the photo(s) go straight from this browser to
  // Anthropic's API using a key Russ enters and stores himself (localStorage,
  // this device only) -- never something typed into chat with Claude Code.
  const FP_API_KEY_STORAGE = 'floorplanner-anthropic-key';
  function fpGetApiKey(){ try{ return localStorage.getItem(FP_API_KEY_STORAGE) || ''; }catch(e){ return ''; } }
  function fpSetApiKey(key){ try{ if(key) localStorage.setItem(FP_API_KEY_STORAGE, key); else localStorage.removeItem(FP_API_KEY_STORAGE); }catch(e){} }

  // OpenAI has no CORS support for direct browser calls, so it's reached
  // through a small proxy Worker you deploy yourself (see
  // cloudflare-worker/README.md) -- your key still only ever lives here and
  // in that Worker's memory for a single request, never a third party.
  const FP_PROVIDER_STORAGE = 'floorplanner-ai-provider';
  function fpGetProvider(){ try{ return localStorage.getItem(FP_PROVIDER_STORAGE) || 'openai'; }catch(e){ return 'openai'; } }
  function fpSetProvider(p){ try{ localStorage.setItem(FP_PROVIDER_STORAGE, p); }catch(e){} }
  const FP_OPENAI_KEY_STORAGE = 'floorplanner-openai-key';
  function fpGetOpenAiKey(){ try{ return localStorage.getItem(FP_OPENAI_KEY_STORAGE) || ''; }catch(e){ return ''; } }
  function fpSetOpenAiKey(key){ try{ if(key) localStorage.setItem(FP_OPENAI_KEY_STORAGE, key); else localStorage.removeItem(FP_OPENAI_KEY_STORAGE); }catch(e){} }
  const FP_OPENAI_PROXY_STORAGE = 'floorplanner-openai-proxy-url';
  const FP_OPENAI_PROXY_DEFAULT = 'https://floorplanner-openai-proxy.rfwrites2.workers.dev'; // deployed 2026-09-04, locked to this app's GitHub Pages origin
  function fpGetOpenAiProxyUrl(){ try{ return localStorage.getItem(FP_OPENAI_PROXY_STORAGE) || FP_OPENAI_PROXY_DEFAULT; }catch(e){ return FP_OPENAI_PROXY_DEFAULT; } }
  function fpSetOpenAiProxyUrl(url){ try{ if(url) localStorage.setItem(FP_OPENAI_PROXY_STORAGE, url); else localStorage.removeItem(FP_OPENAI_PROXY_STORAGE); }catch(e){} }

  // Whether OpenAI trains on your prompts/photos is an OpenAI *account*
  // setting (platform.openai.com/settings/organization/data-controls) --
  // there's no API request field for it, so this app can't set it for you.
  // This checkbox is just your own acknowledgment/record of having turned
  // it on there; it doesn't change what gets sent.
  const FP_OPENAI_DATASHARING_ACK = 'floorplanner-openai-datasharing-ack';
  function fpGetDataSharingAck(){ try{ return localStorage.getItem(FP_OPENAI_DATASHARING_ACK) === '1'; }catch(e){ return false; } }
  function fpSetDataSharingAck(v){ try{ localStorage.setItem(FP_OPENAI_DATASHARING_ACK, v ? '1' : '0'); }catch(e){} }

  function fpFileToBase64(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Downscale + re-encode as JPEG before sending to either provider -- phone
  // photos can be several MB each, and neither provider needs more than
  // ~1568px on the long edge for room/furniture recognition (Anthropic
  // downscales server-side above that anyway, so sending less doesn't cost
  // accuracy, just less upload data and fewer image tokens billed).
  const FP_IMAGE_MAX_DIM = 1568;
  const FP_IMAGE_QUALITY = 0.82;
  function fpDownscaleImage(file){
    return new Promise((resolve, reject)=>{
      const label = (file.name||'photo') + (file.type ? ' ('+file.type+')' : '');
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        URL.revokeObjectURL(url);
        const scale = Math.min(1, FP_IMAGE_MAX_DIM / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('Could not encode '+label+'.'));
        }, 'image/jpeg', FP_IMAGE_QUALITY);
      };
      // Most commonly hit for HEIC/HEIF photos -- iOS Safari auto-converts
      // those to JPEG on picking, but Android Chrome (and some other
      // browsers) have no built-in HEIC decoder at all, so the <img> simply
      // fails to load with no more specific reason given by the browser.
      img.onerror = ()=>{
        URL.revokeObjectURL(url);
        const isHeic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name||'');
        const hint = isHeic
          ? ' -- likely a HEIC/HEIF photo, which this browser can\'t display. Try a photo saved as JPEG or PNG instead.'
          : ' -- this browser could not decode it. Try a different photo (JPEG/PNG work everywhere).';
        reject(new Error('Could not load '+label+hint));
      };
      img.src = url;
    });
  }
  async function fpFileToDownscaledBase64(file){
    const blob = await fpDownscaleImage(file);
    return fpFileToBase64(blob);
  }

  // Renders each page of a PDF to a PNG File (via pdf.js, vendored under
  // ./vendor/pdfjs so this keeps working offline once installed) so a
  // scanned/exported floor-plan PDF can flow through the exact same
  // photo-analysis pipeline as a regular photo -- no separate code path.
  // Capped at 6 pages: this is meant for a floor plan, not a whole document.
  const FP_PDF_MAX_PAGES = 6;
  const FP_PDF_RENDER_SCALE = 2;
  async function fpPdfFileToImageFiles(file){
    if(!window.pdfjsLib) throw new Error('PDF support failed to load -- try again after reloading the page.');
    const baseName = (file.name||'plan').replace(/\.pdf$/i,'');
    const data = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const pageCount = Math.min(pdf.numPages, FP_PDF_MAX_PAGES);
    const files = [];
    for(let i=1; i<=pageCount; i++){
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: FP_PDF_RENDER_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const blob = await new Promise(res=> canvas.toBlob(res, 'image/png'));
      if(blob) files.push(new File([blob], `${baseName}-p${i}.png`, { type:'image/png' }));
    }
    if(!files.length) throw new Error('Could not render any pages from '+(file.name||'that PDF')+'.');
    return files;
  }

  // Shared by every photo-input path (file picker, drag-drop) -- expands any
  // PDF into its rendered page images first, so everything downstream only
  // ever deals in actual images.
  async function fpExpandPickedFiles(fileList, statusEl){
    const out = [];
    for(const f of fileList){
      if(f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')){
        if(statusEl) statusEl.textContent = 'Converting '+(f.name||'PDF')+'…';
        try{ out.push(...await fpPdfFileToImageFiles(f)); }
        catch(err){ toast(err.message || 'Could not convert that PDF.', true); }
      } else {
        out.push(f);
      }
    }
    if(statusEl) statusEl.textContent = '';
    return out;
  }

  // Shows just enough of a saved key (prefix + last 4 chars) for the user
  // to visually confirm it matches what they actually copied, without this
  // app (or us) ever needing to see/ask for the full value.
  // Includes the character count deliberately -- a prefix+suffix-only mask
  // would still "look right" even if something truncated the middle of the
  // key (a real, documented failure mode for modern sk-proj-... keys, which
  // run 150-170+ characters -- some integrations historically truncated
  // them to ~100 assuming the shorter legacy sk-... format, causing exactly
  // this "looks valid, gets rejected" symptom with no other visible sign).
  function fpMaskKey(key){
    if(!key) return '';
    const masked = key.length <= 14 ? key.slice(0,4)+'…' : key.slice(0,10)+'…'+key.slice(-4);
    return masked + ' ['+key.length+' chars]';
  }
  // type="text" (not "password") deliberately -- on mobile, password-type
  // fields are prone to browser/OS password-manager autofill silently
  // overwriting a pasted value, which is indistinguishable from "the key is
  // just wrong" when debugging a rejected key. autocomplete/autocorrect/
  // autocapitalize are all disabled so mobile keyboards can't mangle a
  // paste either.
  const FP_KEY_INPUT_ATTRS = `type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"`;
  function fpKeyRowHtml(provider){
    if(provider === 'openai'){
      const key = fpGetOpenAiKey();
      const proxyUrl = fpGetOpenAiProxyUrl();
      return `
        <label class="mini" style="display:block; color:var(--dim);">Proxy Worker URL
          <input type="text" id="fpProxyInput" placeholder="https://your-proxy.workers.dev" value="${fpEscapeHtml(proxyUrl)}" style="width:100%;">
        </label>
        <div class="fp-key-row" style="margin-top:.4rem;">
          ${key
            ? `<span>Key set: <code>${fpEscapeHtml(fpMaskKey(key))}</code></span><button class="fp-row-remove" id="fpKeyClear" style="width:auto; border-radius:6px; padding:.2rem .5rem;" title="Remove saved key">Clear key</button>`
            : `<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get an OpenAI key</a><input ${FP_KEY_INPUT_ATTRS} id="fpKeyInput" placeholder="sk-..."><button class="btn" id="fpKeySave" style="padding:.3rem .6rem; font-size:.74rem;">Save</button>`}
        </div>
        <label class="mini" style="display:flex; align-items:flex-start; gap:.4rem; margin-top:.3rem; color:var(--dim);">
          <input type="checkbox" id="fpDataSharingAck" ${fpGetDataSharingAck() ? 'checked' : ''} style="margin-top:.2rem;">
          <span>I've enabled OpenAI's <a href="https://platform.openai.com/settings/organization/data-controls" target="_blank" rel="noopener">data-sharing</a> discount.</span>
        </label>
      `;
    }
    const key = fpGetApiKey();
    return `
      <div class="fp-key-row">
        ${key
          ? `<span>Key set: <code>${fpEscapeHtml(fpMaskKey(key))}</code></span><button class="fp-row-remove" id="fpKeyClear" style="width:auto; border-radius:6px; padding:.2rem .5rem;" title="Remove saved key">Clear key</button>`
          : `<a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get an Anthropic key</a><input ${FP_KEY_INPUT_ATTRS} id="fpKeyInput" placeholder="sk-ant-..."><button class="btn" id="fpKeySave" style="padding:.3rem .6rem; font-size:.74rem;">Save</button>`}
      </div>
    `;
  }

  // Shared by the Settings modal's "AI Provider" section -- the provider
  // toggle plus everything fpKeyRowHtml() renders (proxy URL, key entry,
  // data-sharing ack). Import Photo only shows a one-line status pointing
  // here instead of the full setup UI inline.
  function fpBuildProviderConfigHtml(provider){
    return `
      <div class="mini" style="display:flex; gap:.4rem; margin-bottom:.5rem;">
        <button class="btn fp-provider-btn" data-provider="anthropic" style="${provider==='anthropic'?'border-color:var(--accent); color:var(--accent);':''}">Claude (Anthropic)</button>
        <button class="btn fp-provider-btn" data-provider="openai" style="${provider==='openai'?'border-color:var(--accent); color:var(--accent);':''}">OpenAI</button>
      </div>
      <div id="fpKeyRowWrap">${fpKeyRowHtml(provider)}</div>
    `;
  }
  function fpWireProviderConfig(container, provider, onProviderChange){
    container.querySelectorAll('.fp-provider-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ fpSetProvider(btn.dataset.provider); onProviderChange(btn.dataset.provider); });
    });
    const proxyInput = container.querySelector('#fpProxyInput');
    if(proxyInput) proxyInput.addEventListener('change', ()=> fpSetOpenAiProxyUrl(proxyInput.value.trim()));
    const dataSharingAck = container.querySelector('#fpDataSharingAck');
    if(dataSharingAck){
      dataSharingAck.addEventListener('change', ()=>{
        fpSetDataSharingAck(dataSharingAck.checked);
        const statusEl = container.querySelector('#fpDataSharingStatus');
        if(statusEl) statusEl.textContent = dataSharingAck.checked ? 'Recorded: data-sharing acknowledged.' : 'Not yet acknowledged.';
      });
    }
    const keySave = container.querySelector('#fpKeySave');
    if(keySave){
      keySave.addEventListener('click', ()=>{
        const v = container.querySelector('#fpKeyInput').value.trim();
        if(!v){ toast('Enter a key first.', true); return; }
        if(provider==='openai') fpSetOpenAiKey(v); else fpSetApiKey(v);
        onProviderChange(provider);
      });
    }
    const keyClear = container.querySelector('#fpKeyClear');
    if(keyClear){
      keyClear.addEventListener('click', ()=>{

        onProviderChange(provider);
      });
    }
  }
